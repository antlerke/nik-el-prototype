      <p>Надсилаючи форму на сайті nik-el.com, реєструючись в особистому кабінеті або надсилаючи резюме, ви даєте ТОВ «НІК-&#8288;ЕЛЕКТРОНІКА» (код ЄДРПОУ&nbsp;33401202) згоду на обробку ваших персональних даних на таких умовах.</p>
      <p><b>Які дані.</b> Дані, які ви вказали у формі, листі чи резюме: ПІБ, телефон, email, регіон, тема і опис запиту; для особистого кабінету&nbsp;— також назва компанії. Для резюме&nbsp;— також дані про освіту та досвід роботи.</p>
      <p><b>Мета.</b> Відповісти на ваш запит, підготувати пропозицію, надати доступ до особистого кабінету, розглянути вашу кандидатуру на вакансію чи практику. Якщо ви окремо погодилися на розсилку,&nbsp;— також надсилати новини та пропозиції компанії на email.</p>
      <p><b>Дії з даними.</b> Збирання, реєстрація, накопичення, зберігання, зміна, поновлення, використання, передача постачальникам, які забезпечують роботу сайту, знеособлення і знищення&nbsp;— лише в межах цієї мети.</p>
      <p><b>Строк.</b> Протягом строків, вказаних у <a href="privacy.html">Політиці конфіденційності</a>, або до відкликання згоди.</p>
      <p><b>Ваші права.</b> Ви повідомлені про володільця даних, мету обробки, осіб, яким дані можуть передаватися, і про свої права за статтею&nbsp;8 Закону України «Про захист персональних даних». Детальніше&nbsp;— у <a href="privacy.html">Політиці конфіденційності</a>.</p>
      <p><b>Відкликання.</b> Ви можете відкликати згоду будь-коли, написавши на [email&nbsp;— уточнити]. Ми припинимо обробку і видалимо дані, якщо закон не вимагає їх зберігати.</p>
