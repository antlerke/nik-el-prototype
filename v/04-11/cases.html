<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кейси та об’єкти з обладнанням NIK</title>
<meta name="description" content="Реалізовані проєкти з лічильниками та системами обліку NIK: житлові комплекси, промислові об’єкти, водоканали, мережі обленерго.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script src="runtime.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<shell-top></shell-top>
<main id="main">
<section class="phead">
  <div class="wrap">
    <nav aria-label="Навігаційний ланцюжок"><ol class="crumbs"><li><a href="index.html">Головна</a></li><li><a href="about.html">Про нас</a></li><li><span aria-current="page">Кейси та об’єкти</span></li></ol></nav>
    <h1>Кейси та об’єкти</h1>
    <p class="lead">Об’єкти, де працюють лічильники, системи обліку та обладнання NIK. Для кожного — задача клієнта, рішення та результат.</p>
    <nav class="tabs" aria-label="Розділ «Про нас»"><a href="about.html">Про компанію</a><a href="history.html">Історія</a><a href="career.html">Кар’єра</a><a href="conformity.html">Центр оцінки відповідності</a><a href="partners.html">Партнери</a><a href="cases.html" aria-current="page">Кейси та об’єкти</a></nav>
  </div>
</section>

<div class="wrap pbody">
  <sc-if value="{{hasCases}}" hint-placeholder-val="{{true}}">
  <div class="tabs" role="tablist" aria-label="Тип клієнта">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button type="button" role="tab" aria-selected="{{c.on}}" aria-controls="case-panel" onClick="{{c.pick}}">{{c.t}}</button></sc-for>
  </div>
  <div class="ngrid pair" id="case-panel" role="tabpanel" aria-label="{{catName}}">
    <sc-for list="{{list}}" as="k" hint-placeholder-count="4">
      <article class="case">
        <div class="pi"><sc-if value="{{k.hasFile}}" hint-placeholder-val="{{true}}"><img src="{{k.img}}" alt=""></sc-if></div>
        <div class="bd">
          <span class="tag">{{k.c}}</span>
          <h2>[Назва об’єкта]</h2>
          <div class="facts"><div class="spec"><span>Регіон</span><b>[Регіон]</b></div></div>
          <a href="case.html" class="btn btn-line">Детальніше<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </div>
      </article>
    </sc-for>
  </div>
  </sc-if>
  <sc-if value="{{noCases}}" hint-placeholder-val="{{false}}"><div class="empty">Кейси з’являться найближчим часом.</div></sc-if>
</div>

<section class="wrap band-sec">
  <div class="band">
    <div><h2>Опишіть ваш об’єкт — ми запропонуємо рішення</h2></div>
    <a href="index.html#contact" class="btn btn-red">Зв'язатися з нами<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</section>
</main>
<shell-bottom></shell-bottom>
</script>
<script>
window.DC_BLOBS = {"5a730fd2f1cb33a5b04465cf472e04b9":"../../assets/5a730fd2-hero-1.webp","6bad89e8cd66dd4a3f75be4c2902edc5":"../../assets/6bad89e8-hero-2.webp"};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cookie: true, menu: false, cat: 'Усі' };
  }
  renderVals() {
    const s = this.state;
    const B = '/_blob/';
    // two photos aren't in assets/ yet (the export leaves out what the code puts together): those cases show the grey photo box until they are added to DC_BLOBS
    // the address with ?empty shows the state with no cases
    const K = new URLSearchParams(location.search).has('empty') ? [] : [
      { c: 'Забудовники', img: '5a730fd2f1cb33a5b04465cf472e04b9' },
      { c: 'Промислові об’єкти', img: '6bad89e8cd66dd4a3f75be4c2902edc5' },
      { c: 'Водоканали', img: 'd388df99ebf0c0b1f372c4851ac78d85' },
      { c: 'Оператори систем розподілу', img: 'b76b763965df40d22e1607eab06daaab' }
    ];
    const cats = ['Усі', 'Забудовники', 'Промислові об’єкти', 'Водоканали', 'Оператори систем розподілу'].map((t) => ({ t, on: String(s.cat === t), pick: () => this.setState({ cat: t }) }));
    const list = K.filter((k) => s.cat === 'Усі' || k.c === s.cat).map((k) => ({ ...k, hasFile: !!window.DC_BLOBS[k.img], img: B + k.img }));
    return Object.assign(this.base(s), { cats, catName: s.cat, list, hasCases: K.length > 0, noCases: !K.length });
  }
}

DC.mount(Component);
</script>
</body>
</html>
