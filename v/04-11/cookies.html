    <article class="art">
      <p>Cookie&nbsp;— це невеликі текстові файли, які сайт зберігає у вашому браузері. Вони допомагають сайту працювати і запам’ятовувати ваші налаштування.</p>

      <h2>Які cookie ми використовуємо</h2>
      <p><b>Необхідні.</b> Потрібні для роботи сайту: запам’ятовують мову і ваш вибір щодо cookie, підтримують вхід до особистого кабінету, захищають форми від спаму. Їх не можна вимкнути: без них сайт працюватиме некоректно.</p>
      <p><b>Аналітичні.</b> Показують, які сторінки відвідують і як користуються сайтом. Ми дивимося на загальну статистику, а не на дії окремої людини. Вмикаються лише за вашою згодою.</p>
      <p><b>Сторонні сервіси.</b> Карта Google&nbsp;Maps на сторінках контактів і відео YouTube на головній можуть встановлювати власні cookie. Ми завантажуємо їх лише після вашої згоди.</p>

      <h2>Перелік cookie</h2>
      <!-- one table per category; under each name, in grey, who sets the cookie -->

      <table class="dtable fixed">
        <thead><tr><th scope="col">Назва<small>Хто встановлює</small></th><th scope="col">Призначення</th><th scope="col">Строк</th></tr></thead>

          <tr><td>[уточнити]<small>nik-el.com</small></td><td>Запам’ятовує мову сайту</td><td>[12 місяців]</td></tr>
          <tr><td>[уточнити]<small>nik-el.com</small></td><td>Запам’ятовує ваш вибір щодо cookie</td><td>[12 місяців]</td></tr>
          <tr><td>[уточнити]<small>nik-el.com</small></td><td>Підтримує вхід до особистого кабінету</td><td>до виходу або закриття браузера</td></tr>

          <tr><td>_ga<small>Google Analytics</small></td><td>Розрізняє відвідувачів</td><td>2&nbsp;роки</td></tr>

      <h2>Як змінити вибір</h2>
      <p>Змінити вибір можна будь-коли через посилання «<a href="#" onClick="{{openCookie}}">Налаштування cookie</a>» у футері сайту.</p>
      <p>Також cookie можна видалити або заблокувати в налаштуваннях браузера. Якщо заблокувати необхідні cookie, частина сайту може не працювати.</p>

      <h2>Персональні дані</h2>
      <p>Як ми обробляємо дані, зібрані за допомогою cookie, описано в <a href="#">Політиці конфіденційності</a>.</p>
