<section class="sec">

    <div class="about-cols"><h2 class="h2">Наші клієнти</h2><div class="art"><p>Лічильники NIK використовують оператори систем розподілу по всій Україні. Серед наших клієнтів також державні й муніципальні установи, девелопери та B2B-партнери. Продукцію експортуємо до країн ЄС, Близького Сходу та Азії.</p></div></div>
    <div class="about-cols"><h2 class="h2">Якість і стандарти</h2><div class="art"><p>Прилади підтримують протоколи DLMS/COSEM та IDIS, система управління якістю сертифікована за ISO&nbsp;9001.</p><p>Наш випробувальний центр акредитований Національним агентством з акредитації України на відповідність ДСТУ&nbsp;EN&nbsp;ISO/IEC&nbsp;17025:2019 у сфері випробувань лічильників електричної енергії та програмного забезпечення засобів вимірювальної техніки. Це означає, що результати наших випробувань мають офіційно визнану достовірність.</p></div></div>
    <div class="about-cols"><h2 class="h2">Команда</h2><div class="art"><p>У нашій команді понад 600 людей: інженери, програмісти, конструктори, технологи, виробничі фахівці, маркетологи та інші. Деякі працівники з нами понад 10 років.</p><p>Ми цінуємо інженерну точність і відповідальність за результат, а кожен працівник бачить, які результати приносить його робота.</p></div></div>

      <div class="band band-more"><div><h2>Наше бачення</h2><p>Ми бачимо майбутнє, у якому кожен ресурс облікований точно й використаний дбайливо. Нам важливо берегти ресурси планети, людей і компаній, з якими ми працюємо. Тому ми постійно розвиваємося, стежимо за прогресом і шукаємо нестандартні рішення.</p></div></div>

<script>
window.DC_BLOBS = {};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cookie: true, menu: false };
  }
  base(s) {
    const isMenu = (t, href, items) => ({ t, href, items: items.map((x) => (Array.isArray(x) ? { t: x[0], href: x[1] } : { t: x, href })) });
    return {
      menu: [
        isMenu('Каталог', 'catalog.html', ['Продукти', 'Послуги', 'Програмне забезпечення', 'Таблиця взаємозамінності', 'Порівняти товари']),
        isMenu('Про нас', 'about.html', ['Про компанію', ['Історія компанії', 'history.html'], ['Кар’єра', 'career.html'], ['Вакансії', 'vacancies.html'], ['Центр оцінки відповідності', 'conformity.html'], ['Наші партнери', 'partners.html']]),
        isMenu('Контакти', 'where.html', ['Де купити', ['Сервісний центр', 'service.html']]),
        isMenu('Прес-центр', 'news.html', ['Новини', ['НІКіпедія', '#'], ['Ми у ЗМІ', '#']])
      ],
      cookie: s.cookie && !s.menu,
      menuOpen: s.menu, menuExp: String(s.menu), menuLabel: s.menu ? 'Закрити меню' : 'Відкрити меню',
      burgerPath: s.menu ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      menuClick: (e) => { if (e && e.target && e.target.closest && e.target.closest('a')) this.setState({ menu: false }); },
      closeCookie: () => this.setState({ cookie: false }),
      openCookie: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ cookie: true }); }
    };
  }
  renderVals() {
    return this.base(this.state);
  }
}

DC.mount(Component);
</script>
