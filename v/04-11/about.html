    <div class="about-cols"><h2 class="h2">Наші клієнти</h2><div class="art"><p>Лічильники NIK використовують оператори систем розподілу по всій Україні. Серед наших клієнтів також державні й муніципальні установи, девелопери та B2B-партнери. Продукцію експортуємо до країн ЄС, Близького Сходу та Азії.</p></div></div>
    <div class="about-cols"><h2 class="h2">Якість і стандарти</h2><div class="art"><p>Прилади підтримують протоколи DLMS/COSEM та IDIS, система управління якістю сертифікована за ISO&nbsp;9001.</p><p>Наш випробувальний центр акредитований Національним агентством з акредитації України на відповідність ДСТУ&nbsp;EN&nbsp;ISO/IEC&nbsp;17025:2019 у сфері випробувань лічильників електричної енергії та програмного забезпечення засобів вимірювальної техніки. Це означає, що результати наших випробувань мають офіційно визнану достовірність.</p></div></div>
    <div class="about-cols"><h2 class="h2">Команда</h2><div class="art"><p>У нашій команді понад 600 людей: інженери, програмісти, конструктори, технологи, виробничі фахівці, маркетологи та інші. Деякі працівники з нами понад 10 років.</p><p>Ми цінуємо інженерну точність і відповідальність за результат, а кожен працівник бачить, які результати приносить його робота.</p></div></div>
