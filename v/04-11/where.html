</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div style="font-family: Geologica, sans-serif; color: var(--text); background: #ffffff; overflow-x: clip">

<a href="#main" class="skip">Перейти до змісту</a>
<header class="hd">
  <div class="wrap">
    <a href="index.html" aria-label="НІК-ЕЛЕКТРОНІКА — на головну" style="display: flex"><img src="../../assets/4acb50f3-nik-logo.svg" alt="НІК-ЕЛЕКТРОНІКА — на головну" style="height: 34px; width: auto; display: block; position: relative; top: -6px"></a>
    <nav aria-label="Головне меню" style="flex: 1 1 auto">

        <sc-for list="{{menu}}" as="m" hint-placeholder-count="4">
          <li>
            <a href="{{m.href}}" aria-haspopup="true">{{m.t}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></a>

    </nav>
    <a href="#" class="docs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>Електронні документи</a>
    <div style="display: flex; align-items: center; gap: 6px">

      <a href="#" class="icon" aria-label="Увійти в особистий кабінет" title="Увійти в особистий кабінет"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
      <div class="lang"><button type="button" class="lang-btn" aria-haspopup="true" aria-label="Мова сайту: українська">UA<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button><div class="drop lang-drop" aria-label="Мова сайту"><a href="#" aria-current="true" lang="uk">Українська</a><a href="#" lang="en">English</a><a href="#" lang="ru">Русский</a></div></div>
    </div>
  </div>
</header>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
  <nav class="mnav" id="mnav" aria-label="Мобільне меню" onClick="{{menuClick}}">

      <div class="grp">
        <a href="{{m.href}}">{{m.t}}<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        <div class="sub"><sc-for list="{{m.items}}" as="i" hint-placeholder-count="4"><a href="{{i.href}}">{{i.t}}</a></sc-for></div>
      </div>

    <div class="foot">

      <a href="index.html#contact" class="btn btn-red" style="width: 100%">Зв'язатися з нами</a>
      <div class="seg" aria-label="Мова сайту" style="align-self: flex-start"><a href="#" aria-current="true">UA</a><a href="#">EN</a><a href="#">RU</a></div>
    </div>
  </nav>
</sc-if>

<main id="main">
<section class="phead">
  <div class="wrap">
    <nav aria-label="Навігаційний ланцюжок"><ol class="crumbs"><li><a href="index.html">Головна</a></li><li><a href="#">Контакти</a></li><li><span aria-current="page">Де купити</span></li></ol></nav>
    <h1>Де купити</h1>
    <p class="lead">Ми продаємо через мережу дилерів. Знайдіть найближчого на карті або в списку за регіонами.</p>
    <nav class="tabs" aria-label="Розділ «Контакти»"><a href="where.html" aria-current="page">Де купити</a><a href="service.html">Сервісний центр</a></nav>
  </div>
</section>

<div class="wrap pbody">
  <div class="lab">
    <figure class="map" role="group" aria-label="Карта дилерів">
      <sc-for list="{{pins}}" as="p" hint-placeholder-count="8"><button type="button" class="pin-btn" style="{{p.st}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" onClick="{{p.pick}}"><span></span></button></sc-for>
    </figure>
    <div class="contact-card" aria-live="polite">
      <h2>{{dealer.n}}</h2>
      <small>{{dealer.reg}}</small>
      <div class="clist">
        <div><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg></i><span>[Адреса]</span></div>
        <a href="#"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"></path></svg></i><span class="num">[Телефон]</span></a>
        <div><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></i><span class="num">[Пн–Пт, графік]</span></div>
      </div>
      <a href="#" class="btn btn-ink">Прокласти маршрут</a>
    </div>
  </div>
  <div class="tabs" role="tablist" aria-label="Регіон">
    <sc-for list="{{regs}}" as="r" hint-placeholder-count="5"><button type="button" role="tab" aria-selected="{{r.on}}" aria-controls="dealer-panel" onClick="{{r.pick}}">{{r.t}}</button></sc-for>
  </div>
  <div class="vlist" id="dealer-panel" role="tabpanel" aria-label="{{regName}}">
    <sc-for list="{{rows}}" as="d" hint-placeholder-count="8">
      <article class="vac dealer">
        <div><h2>{{d.n}}</h2><p class="cd">{{d.reg}}</p></div>
        <div class="spec addr"><span>Адреса</span><b>[Адреса]</b></div>
        <div class="spec"><span>Телефон</span><b>[Телефон]</b></div>
        <div class="spec"><span>Графік</span><b>[Графік роботи]</b></div>
        <a href="#" class="btn btn-line" aria-label="Маршрут: {{d.n}}">Маршрут</a>
      </article>
    </sc-for>
  </div>
</div>

<section class="wrap band-sec">
  <div class="band">
    <div><span class="kick">Партнерам</span><h2>Хочете стати дилером?</h2><p>Залиште заявку — менеджер вашого регіону зв’яжеться з вами.</p></div>
    <a href="index.html#contact" class="btn btn-red">Стати дилером<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
  <div class="band band-more">
    <div><span class="kick">Сервіс</span><h2>Сервісний центр</h2><p>Гарантійний і післягарантійний ремонт, консультації інженерів.</p></div>
    <a href="service.html" class="btn btn-line">Детальніше<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</section>
</main>

<!-- 11. Футер -->
<footer class="ft">
  <div class="wrap">
    <div class="ftop"><img src="../../assets/0fb4110e-nik-logo-white.svg" alt="НІК-ЕЛЕКТРОНІКА" style="height: 64px; width: auto; display: block"></div>
    <div class="fcols">
      <div><b>Каталог</b><a href="catalog.html">Облік електроенергії</a><a href="catalog.html">Облік води й тепла</a><a href="catalog.html">АСКОЕ та контролери</a><a href="catalog.html">Стабілізатори напруги</a></div>
      <div><b>Компанія</b><a href="about.html">Про нас</a><a href="#">Виробництво</a><a href="career.html">Кар’єра</a><a href="vacancies.html">Вакансії</a><a href="news.html">Прес-центр</a></div>
      <div><b>Партнерам</b><a href="where.html">Де купити</a><a href="index.html#contact">Стати дилером</a><a href="#">Електронні документи</a><a href="service.html">Сервісний центр</a></div>
      <div><b>Контакти</b><a href="#" class="num">+380 (44) 498-06-19</a><a href="#">info@nikel.com.ua</a><span>Пн–Пт, 8:00–17:00</span></div>
    </div>
    <div class="fbot">
      <span>© 2005–2026 ТОВ «НІК-ЕЛЕКТРОНІКА»</span>
      <nav aria-label="Правова інформація та соцмережі"><a href="#">Політика конфіденційності</a><a href="#" onClick="{{openCookie}}">Cookie</a><span><a href="#">LinkedIn</a> · <a href="#">Facebook</a> · <a href="#">YouTube</a></span></nav>
    </div>
  </div>
</footer>

<!-- Cookie-банер -->
<sc-if value="{{cookie}}" hint-placeholder-val="{{true}}">
  <div class="cookie" role="region" aria-label="Налаштування cookie">
    <p>Ми використовуємо необхідні cookie, щоб сайт працював. За вашою згодою також використаємо аналітичні cookie і сторонні сервіси — карти та відео. Детальніше — у <a href="#">Політиці cookie</a>.</p>
    <div class="row">
      <button class="btn btn-ink" onClick="{{closeCookie}}">Прийняти всі</button>
      <button class="btn btn-line" onClick="{{closeCookie}}">Лише необхідні</button>
      <button class="btn lnk" onClick="{{closeCookie}}">Налаштувати</button>
    </div>
  </div>
</sc-if>

</div>
</script>
<script>
window.DC_BLOBS = {};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cookie: true, menu: false, pin: 2, reg: 0 };
  }
  base(s) {
    const isMenu = (t, href, items) => ({ t, href, items: items.map((x) => (Array.isArray(x) ? { t: x[0], href: x[1] } : { t: x, href })) });
    return {
      menu: [
        isMenu('Каталог', 'catalog.html', ['Продукти', 'Послуги', 'Програмне забезпечення', 'Таблиця взаємозамінності', 'Порівняти товари']),
        isMenu('Про нас', 'about.html', ['Про компанію', ['Історія компанії', 'history.html'], ['Кар’єра', 'career.html'], ['Вакансії', 'vacancies.html'], ['Центр оцінки відповідності', 'conformity.html'], ['Наші партнери', 'partners.html']]),
        isMenu('Контакти', 'where.html', ['Де купити', ['Сервісний центр', 'service.html']]),
        isMenu('Прес-центр', 'news.html', ['Новини', ['НІКіпедія', '#'], ['Ми у ЗМІ', '#']])
      ],
      cookie: s.cookie && !s.menu,
      menuOpen: s.menu, menuExp: String(s.menu), menuLabel: s.menu ? 'Закрити меню' : 'Відкрити меню',
      burgerPath: s.menu ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      menuClick: (e) => { if (e && e.target && e.target.closest && e.target.closest('a')) this.setState({ menu: false }); },
      closeCookie: () => this.setState({ cookie: false }),
      openCookie: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ cookie: true }); }
    };
  }
  renderVals() {
    const s = this.state;
    // made-up dealers and places on a drawn map until the company gives the list and a real map takes over
    const D = [
      { n: '[Дилер А]', r: 1, x: 26, y: 44 }, { n: '[Дилер Б]', r: 1, x: 34, y: 58 }, { n: '[Дилер В]', r: 2, x: 44, y: 32 },
      { n: '[Дилер Г]', r: 2, x: 50, y: 62 }, { n: '[Дилер Д]', r: 3, x: 58, y: 40 }, { n: '[Дилер Е]', r: 3, x: 66, y: 52 },
      { n: '[Дилер Є]', r: 4, x: 60, y: 72 }, { n: '[Дилер Ж]', r: 4, x: 74, y: 36 }
    ];
    const inRegion = (d) => !s.reg || d.r === s.reg;
    const pins = D.map((d, i) => ({ d, i })).filter((x) => inRegion(x.d)).map(({ d, i }) => ({ st: 'left: ' + d.x + '%; top: ' + d.y + '%', on: String(s.pin === i), aria: d.n + ', регіон ' + d.r, pick: () => this.setState({ pin: i }) }));
    const dd = D[s.pin];
    const R = [[0, 'Усі регіони'], [1, 'Регіон 1'], [2, 'Регіон 2'], [3, 'Регіон 3'], [4, 'Регіон 4']];
    const regs = R.map(([id, t]) => ({ t, on: String(s.reg === id), pick: () => this.setState({ reg: id, pin: !id || D[s.pin].r === id ? s.pin : D.findIndex((d) => d.r === id) }) }));
    const rows = D.filter(inRegion).map((d) => ({ n: d.n, reg: 'Регіон ' + d.r + ' · [область]' }));
    return Object.assign(this.base(s), { pins, dealer: { n: dd.n, reg: 'Регіон ' + dd.r + ' · [область, місто]' }, regs, regName: R[s.reg][1], rows });
  }
}

DC.mount(Component);
</script>
</body>
</html>
