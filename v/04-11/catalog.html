<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — НІК-ЕЛЕКТРОНІКА</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script src="runtime.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<shell-top></shell-top>
<main id="main">
<section class="phead">
  <div class="wrap">
    <nav aria-label="Навігаційний ланцюжок"><ol class="crumbs"><li><a href="index.html">Головна</a></li><li><span aria-current="page">Каталог</span></li></ol></nav>
    <span class="kick">Продуктовий портфель</span>
    <h1>Каталог</h1>
    <p class="lead">Прилади обліку енергоресурсів, компоненти АСКОЕ, стабілізатори напруги та послуги&nbsp;— з документацією й сертифікатами.</p>
    <div class="tabs" role="tablist" aria-label="Розділ каталогу">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
    </div>
  </div>
</section>

<sc-if value="{{isProd}}" hint-placeholder-val="{{true}}">
<div class="wrap cat pbody">
  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}"><div class="veil" onClick="{{closeSheet}}"></div></sc-if>
  <aside class="{{filtCls}}" aria-labelledby="filt-h">
    <div class="fhead"><h2 id="filt-h">Фільтри</h2><button class="icon fbtn" type="button" aria-label="Закрити фільтри" onClick="{{closeSheet}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4"><div class="fg acc"><h3 class="acc-hd"><button type="button" class="acc-t" id="{{g.hid}}" aria-expanded="{{g.exp}}" aria-controls="{{g.pid}}" onClick="{{g.toggleOpen}}"><span>{{g.t}}</span><sc-if value="{{g.hasSel}}" hint-placeholder-val="{{false}}"><span class="acc-n">· {{g.cnt}}</span></sc-if><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></h3><sc-if value="{{g.open}}" hint-placeholder-val="{{true}}"><div class="acc-p" id="{{g.pid}}" role="group" aria-labelledby="{{g.hid}}"><sc-for list="{{g.optsShown}}" as="o" hint-placeholder-count="4"><button type="button" class="cb" role="checkbox" aria-checked="{{o.on}}" onClick="{{o.toggle}}"><i></i>{{o.label}}<em>{{o.n}}</em></button></sc-for><div class="acc-f"><sc-if value="{{g.long}}" hint-placeholder-val="{{false}}"><button type="button" class="tl sm" aria-expanded="{{g.moreExp}}" onClick="{{g.toggleMore}}">{{g.moreLabel}}</button></sc-if><sc-if value="{{g.hasSel}}" hint-placeholder-val="{{false}}"><button type="button" class="tl sm" aria-label="{{g.resetLabel}}" onClick="{{g.reset}}">Скинути</button></sc-if></div></div></sc-if></div></sc-for>
    <div class="fg"><button type="button" class="cb" role="checkbox" aria-checked="{{eolOn}}" onClick="{{toggleEol}}"><i></i>Показати зняті з виробництва</button></div>
    <div class="ffoot"><button type="button" class="tl" disabled="{{noneActive}}" onClick="{{resetAll}}">Скинути все</button><button type="button" class="btn btn-ink" onClick="{{closeSheet}}">{{showLabel}}</button></div>
  </aside>
  <div id="cat-res">
    <form class="search" role="search" onSubmit="{{onQ}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><label class="sr" for="cat-q">Пошук у каталозі</label><input type="search" id="cat-q" placeholder="Модель, протокол або тип" title="Наприклад: NIK 2306, G3-PLC" value="{{q}}"><button type="submit" class="btn btn-ink sgo">Знайти</button></form>
    <div class="rbar">
      <button type="button" class="btn btn-line fbtn" onClick="{{openSheet}}">Фільтри{{fCount}}</button>
      <span class="n" aria-live="polite">Знайдено: {{found}}</span>
      <sc-if value="{{anyActive}}" hint-placeholder-val="{{false}}"><button type="button" class="chipx chip-clear" onClick="{{resetAll}}">Очистити всі</button></sc-if><sc-for list="{{active}}" as="a" hint-placeholder-count="2"><button type="button" class="chipx" onClick="{{a.remove}}" aria-label="{{a.aria}}">{{a.label}}<b aria-hidden="true">×</b></button></sc-for>
    </div>
    <div class="rbar rtools">
      <a class="lnk" href="#">Таблиця взаємозамінності<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      <select class="sort" aria-label="Сортування" value="{{sort}}" onChange="{{onSort}}"><option value="new">Спочатку новинки</option><option value="name">За назвою</option></select>
    </div>
    <div class="pgrid">
      <sc-for list="{{items}}" as="c" hint-placeholder-count="9">
        <a href="product.html" class="{{c.cls}}">
          <span class="ctop"><span class="{{c.tagCls}}">{{c.tag}}</span><sc-if value="{{c.isNew}}" hint-placeholder-val="{{false}}"><span class="tag new">Новинка</span></sc-if></span>
          <span class="cimg"><img class="{{c.k}}" src="{{c.img}}" alt="{{c.alt}}"></span>
          <span class="ct">{{c.m}}</span>
          <span class="cd">{{c.t}}</span>
          <span class="spec"><span>{{c.k1}}</span><b>{{c.v1}}</b></span>
          <span class="spec"><span>{{c.k2}}</span><b>{{c.v2}}</b></span>
          <span class="cgo"><span class="cgo-in">Специфікація<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></span>
        </a>
      </sc-for>
      <sc-if value="{{none}}" hint-placeholder-val="{{false}}"><div class="empty">За цими фільтрами моделей немає. Змініть умови або <button type="button" class="btn rst" style="min-height: 0; padding: 0; color: var(--ink)" onClick="{{reset}}">скиньте фільтри</button>.</div></sc-if>
    </div>
    <sc-if value="{{multi}}" hint-placeholder-val="{{true}}"><nav class="pager" aria-label="Сторінки"><sc-for list="{{pages}}" as="pg" hint-placeholder-count="2"><sc-if value="{{pg.cur}}" hint-placeholder-val="{{false}}"><span aria-current="page">{{pg.n}}</span></sc-if><sc-if value="{{pg.other}}" hint-placeholder-val="{{true}}"><a href="#" aria-label="{{pg.aria}}" onClick="{{pg.go}}">{{pg.n}}</a></sc-if></sc-for><sc-if value="{{hasNext}}" hint-placeholder-val="{{true}}"><a href="#" aria-label="Наступна сторінка" onClick="{{next}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></sc-if><sc-if value="{{noNext}}" hint-placeholder-val="{{false}}"><span class="off" aria-disabled="true" aria-label="Наступна сторінка"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></sc-if></nav></sc-if>
  </div>
</div>
</sc-if>

<sc-if value="{{isSvc}}" hint-placeholder-val="{{false}}">
<div class="wrap pbody" style="padding-top: 48px; padding-bottom: 120px">
  <div class="svc-grid">
    <sc-for list="{{svcs}}" as="v" hint-placeholder-count="4"><a href="#" class="scard"><img src="{{v.img}}" alt=""><b>{{v.t}}</b><span>{{v.d}}</span></a></sc-for>
  </div>
</div>
</sc-if>

<sc-if value="{{isSoft}}" hint-placeholder-val="{{false}}">
<div class="wrap pbody" style="padding-top: 48px; padding-bottom: 120px">
  <div class="pgrid soft" style="margin-top: 0">
    <a href="#" class="card"><span class="ctop"><span class="tag">Програмне забезпечення</span></span><span class="cimg"><img class="flat" src="../../assets/fdc858a8-p-space.jpg" alt="Логотип NIK SPACE"></span><span class="ct">NIK SPACE</span><span class="cd">ПЗ для дистанційного збору та обробки даних з приладів обліку.</span><span class="cgo"><span class="cgo-in">Детальніше<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></span></a>
    <div class="placeholder" style="min-height: 360px">[Опис платформи, скриншоти інтерфейсу та документація — від замовника]</div>
  </div>
</div>
</sc-if>

<section class="wrap band-sec" style="padding-bottom: 120px">
  <div class="band">
    <div><span class="kick">Підбір обладнання</span><h2>Не знайшли потрібну модель?</h2><p>Опишіть об’єкт і задачу — інженер підбере прилади й канали зв’язку під вашу систему обліку.</p></div>
    <a href="index.html#contact" class="btn btn-red">Отримати консультацію<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</section>
</main>
<shell-bottom></shell-bottom>
</script>
<script>
window.DC_BLOBS = {"f17070b288dd9e18e46b94068534e6a7":"../../assets/f17070b2-nik2306-ua.webp","d3153f2f5ed8d9965f5fb1e49ae07ad9":"../../assets/d3153f2f-cut-2300.webp","f0a2363fd4057897cae4831524ce270e":"../../assets/f0a2363f-cut-2303.webp","d44b48d010a937c9048712bd27b4b807":"../../assets/d44b48d0-cut-2104.webp","9b13e5f6913676cc93140685ba7b1bc0":"../../assets/9b13e5f6-cut-2100.webp","c4241830221490918fd0d48d83d56297":"../../assets/c4241830-cut-7071.webp","59c125130fc7c7750a7256ca7228fc69":"../../assets/59c12513-cut-7011.webp","4e3e1ef59dd050762514eb1b6bc902b0":"../../assets/4e3e1ef5-cut-kc02.webp","1bc2c60e4fa2f82c5d311ace163765cc":"../../assets/1bc2c60e-cut-kk01.webp","f7fccb09fa506c70f87d6dad6abfc916":"../../assets/f7fccb09-p-ambus.jpg","07c44668a5a79d699210918f2ee79e65":"../../assets/07c44668-cut-stv.webp","1695fc08e5d7c1a2fcd4fbc761e00a02":"../../assets/1695fc08-c-tampo.jpg","5a730fd2f1cb33a5b04465cf472e04b9":"../../assets/5a730fd2-hero-1.webp","e3a26a87fafda2aa0c87ff6cdb2b951e":"../../assets/e3a26a87-c-calibration.jpg","2d5e93a952ee95766eb8b2734477ce42":"../../assets/2d5e93a9-c-robot.jpg"};

      { m: 'KK-01', t: 'Комунікаційний контролер АСКОЕ', img: '1bc2c60e4fa2f82c5d311ace163765cc', k: 'cut', dir: 'am', ch: [], cert: [], k1: 'Призначення', v1: 'Передача даних', k2: 'Система', v2: 'АСКОЕ' },

    const G = [
      { id: 'dir', t: 'Напрям', opts: [['el', 'Електроенергія'], ['wh', 'Вода та тепло'], ['am', 'АСКОЕ та контролери'], ['st', 'Стабілізатори напруги']] },
      { id: 'ph', t: 'Кількість фаз', opts: [['1', 'Однофазні'], ['3', 'Трифазні']] },
      { id: 'ch', t: 'Канали зв’язку', opts: [['PLC', 'PLC'], ['G3-PLC', 'G3-PLC'], ['RS-485', 'RS-485'], ['LTE', 'LTE'], ['M-Bus', 'M-Bus']] },

    ];
    const has = (p, g, v) => (Array.isArray(p[g]) ? p[g].includes(v) : p[g] === v);
    // filters apply instantly: every tick updates the list and the count
    const match = (p, f) => G.every((g) => !f[g.id].length || f[g.id].some((v) => has(p, g.id, v))) && (f.eol || !p.eol);

    const toggle = (g, v) => () => { const ff = this.state.applied, cur = ff[g]; this.setState({ applied: { ...ff, [g]: cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat(v) }, page: 1 }); };
    const rm = (g, v) => () => { const ff = this.state.applied; this.setState({ applied: { ...ff, [g]: ff[g].filter((x) => x !== v) }, page: 1 }); };
    const label = {}; G.forEach((g) => g.opts.forEach(([v, l]) => { label[g.id + v] = l; }));

      const k = f[g.id].length, open = !!(s.open || {})[g.id];
      return {

    list = list.slice().sort(s.sort === 'name' ? (a, b) => a.m.localeCompare(b.m, 'uk', { numeric: true }) : (a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
    const PER = 9;
    const pageCount = Math.max(1, Math.ceil(list.length / PER));
    const page = Math.min(s.page || 1, pageCount);
    const items = list.slice((page - 1) * PER, page * PER).map(card);
    const toList = () => setTimeout(() => { const el = document.getElementById('cat-res'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' }); }, 0);
    const goPage = (k) => (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ page: k }); toList(); };
    const pages = Array.from({ length: pageCount }, (_, i) => ({ n: i + 1, cur: i + 1 === page, other: i + 1 !== page, go: goPage(i + 1), aria: 'Сторінка ' + (i + 1) }));
    const active = [];
    G.forEach((g) => f[g.id].forEach((v) => active.push({ label: label[g.id + v], aria: 'Прибрати фільтр ' + label[g.id + v], remove: rm(g.id, v) })));
    const n = active.length;

    const svcs = [
      { t: 'Контрактне виробництво', d: 'SMT-монтаж плат, лиття корпусів і складання за вашою документацією.', img: B + '1695fc08e5d7c1a2fcd4fbc761e00a02' },
      { t: 'Високовольтні мережі', d: 'Обладнання 0,4–35 кВ і реконструкція підстанцій.', img: B + '5a730fd2f1cb33a5b04465cf472e04b9' },
      { t: 'Випробування та сертифікація', d: 'Акредитований випробувальний центр: 28 видів випробувань лічильників і випробування ПЗ.', img: B + 'e3a26a87fafda2aa0c87ff6cdb2b951e' },
      { t: 'Сервісне обслуговування', d: 'Гарантійний і післягарантійний ремонт, консультації інженерів.', img: B + '2d5e93a952ee95766eb8b2734477ce42' }
    ];

    groups.forEach((g, i) => {
      const gid = G[i].id, all = g.opts, more = !!(s.more || {})[gid];

      g.optsShown = g.long && !more ? all.slice(0, MORE) : all;
      g.moreLabel = more ? 'Згорнути' : 'Показати ще (' + (all.length - MORE) + ')'; g.moreExp = String(more);
      g.toggleMore = () => this.setState({ more: { ...(this.state.more || {}), [gid]: !more } });
    });
    return Object.assign(this.base(s), {
      tabs, isProd: s.tab === 'prod', isSvc: s.tab === 'svc', isSoft: s.tab === 'soft', svcs,
      groups, items, none: !list.length, found: list.length + ' ' + (list.length % 10 === 1 && list.length % 100 !== 11 ? 'модель' : [2, 3, 4].includes(list.length % 10) && ![12, 13, 14].includes(list.length % 100) ? 'моделі' : 'моделей'), active,
      q: s.q, sort: s.sort, onQ: (e) => { e.preventDefault(); this.setState({ q: e.target.querySelector('input').value.trim(), page: 1 }); }, onSort: (e) => this.setState({ sort: e.target.value, page: 1 }),
      // page buttons only when there is more than one page (not for one page, not for «нічого не знайдено»)
      pages, multi: pageCount > 1, hasNext: page < pageCount, noNext: page >= pageCount, next: goPage(Math.min(page + 1, pageCount)),
      eolOn: String(f.eol), toggleEol: () => { const ff = this.state.applied; this.setState({ applied: { ...ff, eol: !ff.eol }, page: 1 }); },
      // the field keeps what was typed (inputs aren't re-rendered), so it is emptied here too
      reset: () => { const qi = document.getElementById('cat-q'); if (qi) qi.value = ''; this.setState({ applied: empty, q: '', page: 1 }); },
      resetAll: () => this.setState({ applied: empty, page: 1 }),
      anyActive: n > 0 || f.eol, noneActive: !(n > 0 || f.eol),
      showLabel: list.length ? 'Показати (' + list.length + ')' : 'Моделей немає',
      fCount: n ? ' · ' + n : '', sheet: s.sheet, filtCls: 'filt' + (s.sheet ? ' open' : ''),
      openSheet: () => this.setState({ sheet: true }), closeSheet: () => this.setState({ sheet: false })
    });
  }
}

DC.mount(Component);
</script>
</body>
