<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIK 2306 — лічильник електроенергії трифазний — НІК-ЕЛЕКТРОНІКА</title>
<meta name="robots" content="noindex">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Geologica';font-style:normal;font-weight:300 800;font-display:swap;src:url(../../assets/58ce8622-Geologica-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Geologica';font-style:normal;font-weight:300 800;font-display:swap;src:url(../../assets/129ad3ba-Geologica-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<style>
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
:root{--mono:'JetBrains Mono',ui-monospace,monospace;--ink:#13385d;--ink-d:#0d2a47;--text:#36434f;--muted:#59636e;--line:#dde3e9;--gray:#e6eaeb;--paper:#f4f6f8;--red:#c8102e;--red-h:#a50d26;--red-a:rgba(200,16,46,.08);--red-b:rgba(200,16,46,.18);--red-t:#a50d26;--ease:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.23,1,.32,1)}
body{margin:0;background:#ffffff}
::selection{background:var(--ink);color:#ffffff}
a{color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #007ac2;outline-offset:3px}
.skip{position:absolute;left:16px;top:-80px;z-index:100;background:var(--ink);color:#ffffff;padding:12px 16px;border-radius:8px;text-decoration:none;font-weight:600}.skip:focus{top:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 28px 3px;border-radius:8px;border:0;font:500 16px Geologica,sans-serif;text-decoration:none;cursor:pointer;box-sizing:border-box;transition:background-color .2s ease,color .2s ease,box-shadow .25s ease,transform .16s var(--out)}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:#ffffff}.btn-ink:hover{background:var(--ink-d)}
.btn-red{background:var(--red);color:#ffffff}.btn-red:hover{background:var(--red-h);box-shadow:0 14px 30px -12px rgba(200,16,46,.45)}
.btn-line{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);background:transparent}.btn-line:hover{background:var(--ink);color:#ffffff}
.btn svg{transition:transform .25s var(--out)}
.btn svg,.cgo svg{flex:0 0 auto;display:block;position:relative;top:2px}
.icon{width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;transition:background-color .2s ease}
.icon:hover{background:var(--gray)}
.icon svg{display:block}
.kick{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--red-a);box-shadow:inset 0 0 0 1px var(--red-b);color:var(--red-t);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.kick::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}

/* header */
.hd{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:32px;height:80px}
.menu{display:flex;gap:4px;flex:1 1 auto;margin:0;padding:0;list-style:none}
.menu>li{position:relative}
.menu>li>a{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;text-decoration:none;font-size:16px;font-weight:500;line-height:1;color:var(--ink);transition:background-color .2s ease}
.menu>li>a svg{flex:0 0 auto;display:block;transition:transform .25s var(--out)}
.menu>li:hover>a,.menu>li:focus-within>a{background:var(--gray)}
.menu>li:hover>a svg,.menu>li:focus-within>a svg{transform:rotate(180deg)}
.drop{position:absolute;left:0;top:calc(100% + 10px);min-width:280px;padding:10px;background:#ffffff;border-radius:16px;box-shadow:0 24px 48px rgba(19,56,93,.16),0 0 0 1px rgba(19,56,93,.06);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease,transform .25s var(--out)}
.drop::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
.menu>li:hover .drop,.menu>li:focus-within .drop{opacity:1;transform:none;pointer-events:auto}
.drop a{display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;text-decoration:none;font-size:16px;font-weight:500;color:var(--text)}
.drop a:hover{background:var(--paper);color:var(--ink)}
.docs{min-height:44px;padding:0 18px 3px;font-size:16px;border-radius:8px}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.seg a{display:grid;place-items:center;min-width:40px;height:36px;padding:0 6px;border-radius:9px;font-size:14px;font-weight:500;line-height:1;color:var(--muted);text-decoration:none;transition:background-color .2s ease,color .2s ease}
.seg a:hover{color:var(--ink)}
.seg a[aria-current]{background:var(--ink);color:#ffffff}
.burger{display:none}
.mnav{display:none}
@media (max-width:900px){
  .mnav{display:block;position:fixed;left:0;right:0;top:81px;bottom:0;z-index:29;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#ffffff;padding:8px 16px 40px;box-sizing:border-box;animation:mIn .35s var(--ease) both}
  @keyframes mIn{from{opacity:0;transform:translateY(-12px)}}
  .mnav .grp{padding:20px 0;border-bottom:1px solid var(--line)}
  .mnav .grp>a{display:flex;justify-content:space-between;align-items:center;min-height:48px;font-size:26px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);text-decoration:none}
  .mnav .sub{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:6px}
  .mnav .sub a{display:flex;align-items:center;min-height:44px;font-size:16px;color:var(--text);text-decoration:none}
  .mnav .foot{display:flex;flex-direction:column;gap:16px;padding-top:24px}
}
.cap{grid-area:1/1;opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .9s var(--out);pointer-events:none}
.cap.on{opacity:1;transform:none;transition-delay:.45s,.45s;pointer-events:auto}
.cap h1,.cap h2{margin:0;font-size:clamp(40px,4.4vw,68px);line-height:1;font-weight:700;letter-spacing:-0.04em;color:var(--ink);text-wrap:balance;max-width:16ch}
.cap p{margin:24px 0 0;font-size:clamp(20px,1.6vw,23px);line-height:1.55;color:var(--text);max-width:50ch}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* sections */
.sec{padding:120px 0}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.shead:has(>.lead){display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:32px;row-gap:0;align-items:start}
.shead:has(>.lead)>div{display:contents}
.shead:has(>.lead) .kick{grid-column:1;grid-row:1;justify-self:start}
.shead:has(>.lead) .h2{grid-column:1;grid-row:2}
.shead:has(>.lead)>.lead{grid-column:2;grid-row:2;margin-top:16px;max-width:38ch}
@media (max-width:900px){.shead:has(>.lead){grid-template-columns:minmax(0,1fr)}.shead:has(>.lead)>.lead{grid-column:1;grid-row:3;margin-top:24px;max-width:44ch}}
.h2{margin:16px 0 0;font-size:clamp(36px,3.6vw,56px);line-height:1.02;font-weight:700;color:var(--ink);letter-spacing:-0.04em;text-wrap:balance}
.lead{margin:0;font-size:clamp(20px,1.6vw,23px);line-height:1.5;color:var(--text);max-width:44ch}
.card{display:flex;flex-direction:column;padding:16px;border-radius:24px;background:#ffffff;box-shadow:0 0 0 1px var(--line);text-decoration:none;color:var(--ink);transition:transform .35s var(--out),box-shadow .35s ease;animation:cin .5s var(--out) both}
@keyframes cin{from{opacity:0;transform:translateY(16px)}}
.card.wide{grid-column:span 2}
.ctop{display:flex;justify-content:space-between;align-items:center}
.tag{padding:6px 10px;border-radius:8px;background:rgba(19,56,93,.08);color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tag.r{background:rgba(200,16,46,.08);color:var(--red-h)}
.cimg{position:relative;margin-top:14px;height:220px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--paper) 0%,var(--gray) 100%);display:flex;align-items:center;justify-content:center}
.card.wide .cimg{height:260px}
.cimg img{max-width:72%;max-height:84%;object-fit:contain;transition:transform .6s var(--out)}
.cimg img.cut{filter:drop-shadow(0 18px 18px rgba(19,56,93,.22))}
.cimg img.flat{mix-blend-mode:multiply}
.ct{margin-top:18px;font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}
.cd{margin-top:8px;font-size:17px;line-height:1.5;color:var(--text);flex:1 1 auto}
.spec{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.cd+.spec{margin-top:16px}
.spec>span{color:var(--muted);font-weight:500}.spec b{font-weight:600;color:var(--ink);text-align:right}
.cgo{margin-top:18px;height:48px;padding-bottom:3px;box-sizing:border-box;border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:500;transition:background-color .25s ease,color .25s ease}
@media (hover:hover) and (pointer:fine){
  .card:hover{transform:translateY(-6px);box-shadow:0 28px 56px -24px rgba(19,56,93,.35),0 0 0 1.5px var(--ink)}
  .card:hover .cimg img:not(.photo){transform:scale(1.06) rotate(-2deg)}
  .card:hover .cgo{background:var(--ink);color:#ffffff}
}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.info{flex:1 1 auto;border-radius:28px;padding:36px;background:linear-gradient(160deg,var(--ink) 0%,var(--ink-d) 100%);color:#ffffff;display:flex;flex-direction:column}
.info .n{flex:0 0 auto;box-sizing:border-box;width:52px;height:52px;padding:0 0 2px;border-radius:14px;background:var(--red);display:grid;place-items:center;text-align:center;line-height:1;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.info h3{margin:0;font-size:28px;line-height:1.15;letter-spacing:-0.02em}
.info .sub{margin-top:8px;font-size:16px;color:#d3deea}
.info p{margin:24px 0 0;font-size:19px;line-height:1.6;color:var(--text)}
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){
  @keyframes asm{from{translate:calc(var(--ax) * 1cqi) calc(var(--ay) * 1cqi)}}
  @keyframes mk{from{opacity:0;transform:scale(.4)}}
}}
@keyframes vfade{0%{opacity:0;transform:scale(1.04)}6%{opacity:1}33%{opacity:1}40%{opacity:0;transform:scale(1.14)}100%{opacity:0}}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* footer */
.ft{background:linear-gradient(160deg,var(--ink) 0%,var(--ink-d) 100%);color:#ffffff}
.ft a{color:#ffffff;text-decoration:none;transition:color .15s ease}.ft a:hover{color:#ffffff}
.ftop{padding:72px 0 44px;border-bottom:1px solid rgba(255,255,255,.14)}
.fcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px;padding-top:44px}
.fcols>div{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.45}
.fcols>div>a,.fcols>div>span{font-family:Geologica,sans-serif;font-size:16px;font-weight:500;line-height:1.45;font-variant-numeric:tabular-nums}
.fcols b{margin-bottom:12px;font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:0;text-transform:uppercase;color:#d3deea}
.fbot{display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap;padding:56px 0 32px;font-family:var(--mono);font-size:14px;font-weight:500;line-height:1.45;color:#a9bbcf}
.fbot nav{display:flex;gap:24px;flex-wrap:wrap}
.fbot a{color:#a9bbcf}

/* cookie */
.cookie{position:fixed;left:32px;right:32px;bottom:16px;z-index:50;max-width:1216px;margin:0 auto;display:flex;align-items:center;gap:24px;box-sizing:border-box;background:#ffffff;border-radius:20px;padding:16px 16px 16px 24px;box-shadow:0 24px 64px rgba(10,32,56,.22),0 0 0 1px rgba(19,56,93,.06);animation:pop .5s var(--ease) .8s both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.98)}}
.cookie p{margin:0;flex:1 1 auto;font-size:15px;line-height:1.55;color:var(--text)}
.cookie .row{display:flex;gap:8px;flex:0 0 auto}
.cookie .btn{min-height:44px;padding:0 18px 3px;font-size:16px;border-radius:8px}
.cookie .lnk{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:0 8px}

/* reveal */
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){
  @keyframes rv{from{opacity:0;transform:translateY(40px)}}
}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition-duration:.01ms !important}}

/* secondary typeface: JetBrains Mono for labels, tags and technical data */
.kick,.tag,.spec,.fcols b,.info .sub{font-family:var(--mono)}
.kick{font-size:12px;letter-spacing:.12em}
.tag{font-size:13px;letter-spacing:.04em}
.spec{font-size:14px}

/* responsive */
@media (max-width:1180px){.menu>li>a{padding:0 10px;font-size:15px}.docs{display:none}}
@media (max-width:900px){
  .menu,.seg.top{display:none}.burger{display:inline-grid}
  .cap h1,.cap h2{font-size:40px}
  .fcols{grid-template-columns:1fr 1fr}
  .fcols .num{white-space:nowrap}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .sec{padding:80px 0}.card{flex:0 0 82%;scroll-snap-align:start}
  .cimg,.card.wide .cimg{height:200px}
  .info{padding:28px}.info h3{font-size:24px}
  .ftop{padding:56px 0 32px}.fcols{gap:32px 20px;padding-top:32px}.fbot{flex-direction:column;align-items:flex-start;padding-top:40px}
  .cookie{left:16px;right:16px;bottom:16px;flex-direction:column;align-items:stretch;gap:14px;padding:18px}.cookie .row{flex-wrap:wrap}
}
/* mobile headings: smaller and fluid */
@media (max-width:600px){.cap h1,.cap h2{font-size:clamp(30px,8.5vw,40px)}.h2{font-size:clamp(28px,7.4vw,36px)}.info h3,.ct{font-size:clamp(20px,5.6vw,24px)}}
/* mobile body text: smaller */
@media (max-width:600px){.cap p,.lead{font-size:17px;line-height:1.5}.info p{font-size:16px}.cd{font-size:15px}}
/* mobile: tighter heading-to-body spacing */
@media (max-width:600px){.cap p{margin-top:10px}.shead:has(>.lead)>.lead{margin-top:10px}.info p{margin-top:12px}#contact .lead{margin-top:10px !important}}
/* mobile: section buttons full width */
@media (max-width:600px){.shead>.btn{width:100%;align-self:stretch}}
/* mobile: section head → content 24px everywhere */
@media (max-width:600px){.shead{gap:24px}}
/* mobile: equal 80px between sections (no doubled gaps on same-colour neighbours) */
@media (max-width:600px){.sec{padding:80px 0}}
/* mobile: cookie banner — two equal buttons, settings link below */
@media (max-width:600px){.cookie p{font-size:14px}.cookie .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cookie .row .btn{width:100%;padding:0 12px 3px}.cookie .row .lnk{grid-column:1/-1}}
@media (max-width:600px){section[aria-labelledby="h-news"] .shead>.btn{display:none}}
/* mobile: slimmer header bar */
@media (max-width:600px){.hd .wrap{height:64px}.mnav{top:65px}}
/* mobile type, step 2: headings and body a bit smaller */
@media (max-width:600px){.cap h1,.cap h2{font-size:30px}.h2{font-size:26px}.info h3,.ct{font-size:20px}.cap p,.lead{font-size:16px}.info p{font-size:15px}}
/* mobile consistency pass: one scale for headings, body and spacing
   H1 30 · H2 26 · card title 20 · body 16 · card text 15 · meta 14
   kicker→heading 16 · heading→text 10 · text/head→content or button 24 · card padding 20 */
@media (max-width:600px){
  .info p{line-height:1.5}
  .card{padding:20px}.info{padding:20px}
}
/* mobile 8-pt grid: every gap, margin and padding is a multiple of 8 (tiny badges use a 4px half-step) */
@media (max-width:600px){
  .cap p,.shead:has(>.lead)>.lead,.info p{margin-top:8px}#contact .lead{margin-top:8px !important}
  .hd .wrap>div:last-child{gap:8px !important}.mnav .grp{padding:24px 0}.mnav .sub{margin-top:8px}
  .btn{gap:8px;padding-left:24px;padding-right:24px}.cookie .row .btn{padding-left:16px;padding-right:16px}
  .card{padding:16px}.cimg{margin-top:16px}.ct{margin-top:16px}.spec{padding:8px 0}.cgo{margin-top:16px;gap:8px}.tag{padding:4px 8px}.info{padding:16px}.info>div:first-child{gap:16px !important}
  form .btn[type="submit"]{margin-top:24px !important}
  .fcols{gap:32px 16px}.fcols>div{gap:8px}.fcols b{margin-bottom:8px}
  .cookie{padding:16px;gap:16px}
}
/* desktop & tablet 8-pt grid: every gap, margin and padding is a multiple of 8 (tiny badges use a 4px half-step) */
@media (min-width:601px){
  .btn{gap:8px;padding-left:24px;padding-right:24px}
  .kick{gap:8px}
  .menu>li>a{gap:8px;padding:0 16px}
  .drop{top:calc(100% + 8px);padding:8px}.drop::before{top:-8px;height:8px}.drop a{padding:0 16px}
  .docs{padding-left:16px;padding-right:16px}
  .seg a{padding:0 8px}
  .hd .wrap>div:last-child{gap:8px !important}.seg.top{margin-left:8px !important}
  .cimg{margin-top:16px}.ct{margin-top:16px}.spec{padding:8px 0;gap:8px}.cgo{margin-top:16px;gap:8px}
  .tag{padding:4px 8px}
  .info{padding:40px}.info>div:first-child{gap:16px !important}
  #contact .lead{margin-top:16px !important}
  form .btn[type="submit"]{margin-top:24px !important}
  .ftop{padding:72px 0 48px}.fcols{gap:32px;padding-top:48px}.fcols>div{gap:8px}.fcols b{margin-bottom:8px}
  .cookie .btn{padding-left:16px;padding-right:16px}.cookie .lnk{padding-left:8px;padding-right:8px}
}
@media (min-width:601px) and (max-width:900px){
  .mnav .grp{padding:24px 0}.mnav .sub{margin-top:8px}
}
/* desktop consistency pass: one type scale and one spacing scale (values at 1440; fluid below)
   H1 64 · H2 48 · H3 32 · card title 24 · lead 20 · large-card text 18 · body 16 · meta 14
   kicker→H2 16 · H2→text 24 · section head→content 48 · grid gaps 24 · small card 24 · large card 32 · sections 120 */
@media (min-width:601px){
  .cap h1,.cap h2{font-size:clamp(40px,4.4vw,64px)}
  .h2{font-size:clamp(36px,3.4vw,48px);line-height:1.04;letter-spacing:-0.04em}
  .ct,.info h3{font-size:24px;line-height:1.2}
  .cap p,.lead{font-size:clamp(18px,1.4vw,20px);line-height:1.5}
  .info p{font-size:18px}
  .cd{font-size:16px}
  .cookie p{font-size:14px}
  #contact .lead{margin-top:24px !important}
  .card{padding:24px}.info{padding:32px}
}
/* one shape for chips, labels and links: 8 px corners like buttons, tabs and cards */
.kick{border-radius:8px}
/* detail card in «Від чипа до корпусу»: light, to match the device panel on the left */
.info{background:#ffffff;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.info h3{color:var(--ink)}
.info .sub{color:var(--muted)}
.info p{color:var(--text)}
.info .n{background:var(--red-a);color:var(--red-t);box-shadow:inset 0 0 0 1px var(--red-b)}
/* two-column layout (>900 px): the detail card is as tall as its text; the device panel follows the right column */
@media (min-width:901px){.info{flex:0 0 auto}}
/* header: more air. >900 px: taller (96), logo 40; >1359 px: wider gaps. Menu text never wraps:

.m3d-reset{position:absolute;right:16px;top:14px;z-index:2;display:none;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-radius:8px;background:#ffffff;box-shadow:inset 0 0 0 1.5px var(--line);font:500 14px var(--mono);color:var(--muted);cursor:pointer;transition:box-shadow .2s ease,color .2s ease}

.m3d .hm{display:none}
@media (hover:none),(max-width:600px){.m3d .hd{display:none}.m3d .hm{display:inline}}
@media (max-width:600px){.m3d .ihint{left:16px;top:16px}.m3d.moved .ihint{display:none}}
/* «PDF» badges: same font effect as the tags, capitals sat 1.3 px high; text moved down, badge size unchanged */
.doc em{padding-top:2.6px}

    <p>NIK 2306 вимірює активну й реактивну енергію в трифазних мережах 3×230/400 В і зберігає показання за тарифами та журнал подій. Дані передаються в систему АСКОЕ через RS-485, PLC або змінний модуль LTE.</p>
