    <p>NIK 2306 вимірює активну й реактивну енергію в трифазних мережах 3×230/400 В і зберігає показання за тарифами та журнал подій. Дані передаються в систему АСКОЕ через RS-485, PLC або змінний модуль LTE.</p>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = Object.assign({ cookie: true, menu: false }, { sec: 'p-desc', gi: 0, gstop: false });
    this.spyTimer = setTimeout(() => this.initSpy(), 300);
  }
  // sub-menu: the item of the section that is under the (sticky) sub-menu is the current one, while scrolling too
  initSpy() {
    const ids = ['p-desc', 'p-spec', 'p-draw', 'p-docs', 'p-video'];
    let queued = false;
    const spy = () => {
      queued = false;
      const nav = document.querySelector('nav.subnav');
      if (!nav) return;

      const line = nav.getBoundingClientRect().bottom + 80;
      let cur = ids[0];
