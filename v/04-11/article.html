    <article class="art">
      <p>Три роки тому — в 2017 році — лінійка основної продукції ТОВ «НІК-ЕЛЕКТРОНІКА» — лічильники енергоресурсів (електроенергії, води, тепла, газу) — поповнилася ще одним виробом широкого застосування: трансформаторами струму нової конструкції.</p>
      <h2 id="s1">Що таке трансформатор струму</h2>
      <p>Трансформатор струму — це вимірювальний трансформатор, у якому вторинний струм при нормальних умовах застосування є пропорційним первинному струму. Первинні обмотки трансформаторів струму включаються у розрив лінійних провідників.</p>
      <p>Вимірювальні трансформатори, до яких відносять трансформатори струму, призначені для зменшення первинних струмів до рівнів, зручних для приєднання до вимірювальних приладів. Вони також забезпечують розділення кіл високої та низької напруги, що робить їх відносно безпечними для обслуговуючого персоналу.</p>
      <p>Трансформатори струму нашого виробництва застосовуються у розподільних пристроях низької напруги й призначені для передачі аналогових сигналів вимірювальним пристроям, лічильникам та мають одну вторинну обмотку. Трансформатори застосовуються в системах обліку, у тому числі комерційного, електричної енергії.</p>
      <p>Хоча принцип дії трансформаторів струму не залежить від напруги мереж, де вони застосовуються, але напруга мережі суттєво впливає на вимоги щодо ізоляції обмоток, а відтак й на їх конструкцію.</p>
      <h2 id="s2">Як він влаштований</h2>
      <p>В нашому виконанні трансформатор струму представляє собою одношарову обмотку на тороїдному магнітопроводі, виготовленому з нанокристалічних сплавів. Нанокристалічні сплави — новий клас магнітом’яких матеріалів, які вигідно відрізняються своєю технологічністю і відносною дешевизною сировини від інших. Завдяки структурній особливості сплаву досягається висока магнітна проникність, а також забезпечуються низькі втрати на вихрові струми і прекрасні характеристики магнітної проникності.</p>
      <p>Обмотка на тороїдному магнітопроводі є вторинною обмоткою, а первинною обмоткою є шина, пропущена крізь отвір тороїда. Шина поворотна (ТОПН-0,66) або неповоротна (ТОПНШ-0,66). Якщо через первинну обмотку пропустити змінний струм, то він створить змінний магнітний потік у магнітопроводі, який наведе електрорушійну силу у вторинній обмотці.</p>
      <h2 id="s3">Де застосовується</h2>
      <p>Трансформатори струму, виробництво яких здійснюється на заводі в м.&nbsp;Дніпро, призначені для передачі сигналу вимірювальної інформації вимірювальним приладам та пристроям в установках змінного струму частотою 50&nbsp;Гц з номінальною напругою до 0,66&nbsp;кВ включно на об’єктах електроенергетики, сільського господарства, в комунальному секторі та організаціях інших галузей народного господарства.</p>
      <h2 id="s4">Відповідність стандартам</h2>
      <p>Трансформатор ТОPN (ТОПН)-0,66 відповідає вимогам наступних стандартів:</p>
      <ul class="feat"><li>ДСТУ IEC 60044-1:2008 «Трансформатори вимірювальні. Частина 1. Трансформатори струму (IEC 60044-1:2003, IDT)»</li><li>ГОСТ 15150-69 — в частині кліматичних факторів для експлуатації в районах, що відносяться до кліматичного виконання У категорії розміщення 3</li><li>ГОСТ 17516.1-90 — в частині стійкості до дії механічних факторів зовнішнього середовища, згідно з групою механічного виконання М39 ступеню жорсткості 8</li></ul>
      <p>За ДСТУ IEC 60044-1:2008:</p>
      <table class="dtable"><tbody><tr><td>Ізоляція первинної обмотки витримує випробувальну напругу частотою 50&nbsp;Гц протягом 60&nbsp;с</td><td>3&nbsp;кВ</td></tr><tr><td>Нормована витримана напруга частотою 50&nbsp;Гц для ізоляції вторинної обмотки (середньоквадратичне значення)</td><td>3&nbsp;кВ</td></tr><tr><td>Номінальна витримана напруга для міжвиткової ізоляції (амплітудне значення)</td><td>4,5&nbsp;кВ</td></tr><tr><td>Опір ізоляції первинної обмотки за нормальних кліматичних умов, не менше</td><td>40&nbsp;МОм</td></tr><tr><td>Опір ізоляції вторинної обмотки за нормальних кліматичних умов, не менше</td><td>20&nbsp;МОм</td></tr></tbody></table>
      <p>Захист проти втручання в конструкцію трансформаторів здійснюється за допомогою пломбування корпусу трансформатора, внаслідок чого унеможливлюється доступ до елементів трансформатора без пошкодження пломб.</p>
      <h2 id="s5">Технічні характеристики</h2>
      <table class="dtable"><tbody><tr><td>Номінальна напруга</td><td>0,66&nbsp;кВ</td></tr><tr><td>Найвища робоча напруга</td><td>0,72&nbsp;кВ</td></tr><tr><td>Номінальна сила первинного струму</td><td>150; 200; 300; 400; 500; 600; 800; 1000; 1200; 1500; 2000&nbsp;А</td></tr><tr><td>Номінальна частота</td><td>50&nbsp;Гц</td></tr><tr><td>Номінальна сила вторинного струму</td><td>5&nbsp;А</td></tr><tr><td>Клас точності вторинної обмотки за ДСТУ IEC 60044-1</td><td>0,5S</td></tr><tr><td>Номінальна потужність вторинної обмотки (cos&nbsp;φ&nbsp;=&nbsp;0,8)</td><td>5&nbsp;В·А</td></tr><tr><td>Номінальний коефіцієнт безпеки приладів вторинної обмотки</td><td>3</td></tr><tr><td>Робочий діапазон температури</td><td>від −45&nbsp;°C до +40&nbsp;°C</td></tr><tr><td>Первинна обмотка</td><td>поворотна шина (ТОПН-0,66) або неповоротна (ТОПНШ-0,66)</td></tr><tr><td>Габарити, 150–400&nbsp;А</td><td>не більше 125&nbsp;×&nbsp;98&nbsp;×&nbsp;75&nbsp;мм</td></tr><tr><td>Габарити, 500–600&nbsp;А</td><td>не більше 170&nbsp;×&nbsp;98&nbsp;×&nbsp;75&nbsp;мм</td></tr><tr><td>Габарити, 800–2000&nbsp;А</td><td>не більше 180&nbsp;×&nbsp;66&nbsp;×&nbsp;170&nbsp;мм</td></tr><tr><td>Маса</td><td>не більше 0,7&nbsp;кг (150–400&nbsp;А), 1,0&nbsp;кг (500–600&nbsp;А), 1,5&nbsp;кг (800–2000&nbsp;А)</td></tr><tr><td>Середнє напрацювання на відмову</td><td>не менше 3×10<sup>5</sup> годин</td></tr><tr><td>Середній строк служби</td><td>не менше 25 років</td></tr></tbody></table>
      <h2 id="s6">Як позначати при замовленні</h2>
      <p>Приклад запису умовного позначення трансформатора на номінальну напругу 0,66&nbsp;кВ при його замовленні: <strong>трансформатор струму ТОPN (ТОПН)-0,66-0,5S-600/5 У3</strong></p>
      <table class="dtable"><tbody><tr><td>Т</td><td>трансформатор</td></tr><tr><td>О</td><td>опорний в пластмасовому корпусі</td></tr><tr><td>Р (П)</td><td>із поворотною шиною</td></tr><tr><td>N (Н)</td><td>торговельна марка NiK</td></tr><tr><td>0,66</td><td>номінальна напруга 0,66&nbsp;кВ</td></tr><tr><td>0,5S</td><td>клас точності 0,5S</td></tr><tr><td>600/5</td><td>номінальний первинний струм 600&nbsp;А, вторинний 5&nbsp;А</td></tr><tr><td>У3</td><td>кліматичне виконання У, категорія розміщення 3</td></tr></tbody></table>
