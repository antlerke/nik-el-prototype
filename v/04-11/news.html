<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = Object.assign({ cookie: true, menu: false }, { cat: 'Усі' });
  }
  base(s) {
    const isMenu = (t, href, items) => ({ t, href, items: items.map((x) => (Array.isArray(x) ? { t: x[0], href: x[1] } : { t: x, href })) });
    return {
      menu: [
        isMenu('Каталог', 'catalog.html', ['Продукти', 'Послуги', 'Програмне забезпечення', 'Таблиця взаємозамінності', 'Порівняти товари']),

        isMenu('Контакти', '#', ['Де купити', ['Сервісний центр', '#']]),
        isMenu('Прес-центр', 'news.html', ['Новини', ['НІКіпедія', '#'], ['Ми у ЗМІ', '#']])
      ],
      cookie: s.cookie && !s.menu,
      menuOpen: s.menu, menuExp: String(s.menu), menuLabel: s.menu ? 'Закрити меню' : 'Відкрити меню',
      burgerPath: s.menu ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      menuClick: (e) => { if (e && e.target && e.target.closest && e.target.closest('a')) this.setState({ menu: false }); },
      closeCookie: () => this.setState({ cookie: false }),
      openCookie: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ cookie: true }); }
    };
  }
  renderVals() {
    const s = this.state;
    const B = '/_blob/';
    const NEWS = [
      { d: '26.08.2026', c: 'Компанія', t: 'Звіт незалежного аудитора щодо фінансової звітності за 2025 рік', img: 'c0704521db1416ec66e4d8545678ba60' },

      { d: '05.11.2024', c: 'Партнерство', t: 'НІК-ЕЛЕКТРОНІКА подовжила членство в ICC', img: '64d3854c808afc98f555fddf056f74b8' },

      { d: '10.12.2021', c: 'Сертифікація', t: 'Лічильник 7021 сертифіковано', img: 'ea5a942ba9f38ea4590615924d2a72ed' },
      { d: '25.03.2021', c: 'Продукти', t: 'Розробка пересувних електротехнічних лабораторій від NIK', img: 'c0704521db1416ec66e4d8545678ba60' },

      { d: '08.12.2020', c: 'Сертифікація', t: 'Сертифікат експертизи типу для KC-\u206002', img: 'cf8e2f1dd66b397312a466e40c80f839' },
      { d: '17.07.2020', c: 'Виробництво', t: 'Запуск автоматизованого тамподруку', img: '1695fc08e5d7c1a2fcd4fbc761e00a02' }
    ].map((n) => ({ ...n, iso: n.d.split('.').reverse().join('-'), img: B + n.img, tagCls: 'tag' + (n.c === 'Компанія' ? ' r' : '') }));
    const C = ['Усі', 'Компанія', 'Сертифікація', 'Продукти', 'Виробництво', 'Партнерство', 'Події'];
    const cats = C.map((t) => ({ t, on: String(s.cat === t), pick: () => this.setState({ cat: t }) }));
    const rest = NEWS.slice(1).filter((n) => s.cat === 'Усі' || n.c === s.cat);
    // page buttons only when there is more than one page, as in the catalog: every theme fits on one page
    return Object.assign(this.base(s), { top: NEWS[0], cats, catName: s.cat, list: rest, multi: s.cat === 'Усі' });
  }

DC.mount(Component);
</script>
