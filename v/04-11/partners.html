<script>
window.DC_BLOBS = {};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cookie: true, menu: false };
  }
  renderVals() {
    const s = this.state, open = s.open || {}, MORE = 6;
    // [Назва компанії] until the client sends the names; the counts only show how «Показати ще» works
    const ph = (k) => Array.from({ length: k }, () => ({ n: '[Назва компанії]', cls: 'ph' }));
    // a long group shows its first six companies and «Показати ще (N)», as the catalog filters do;
    // a button for one hidden name is not worth a click, so a group of seven shows all seven
    const group = (id, names) => {
      const more = !!open[id], long = names.length > MORE + 1;
      return { shown: long && !more ? names.slice(0, MORE) : names, long, exp: String(more),
        label: more ? 'Згорнути' : 'Показати ще (' + (names.length - MORE) + ')',
        toggle: () => this.setState({ open: { ...open, [id]: !more } }) };
    };
    return Object.assign(this.base(s), { gov: group('gov', ph(10)), dev: group('dev', ph(7)), dist: group('dist', ph(14)), intl: group('intl', ph(6)) });
  }
}

DC.mount(Component);
</script>
