    <nav class="tabs" aria-label="Розділ «Про нас»"><a href="about.html">Про компанію</a><a href="history.html">Історія</a><a href="career.html">Кар’єра</a><a href="conformity.html">Центр оцінки відповідності</a><a href="partners.html" aria-current="page">Партнери</a><a href="cases.html">Кейси та об’єкти</a></nav>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">

      <div class="art"><h2>{{g.t}}</h2></div>
      <div class="ngrid three">

    <div><h2>Пропонуємо співпрацю дистриб’юторам і компаніям енергетичного сектору</h2><p>Напишіть нам — обговоримо умови.</p></div>

<script>
window.DC_BLOBS = {};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cookie: true, menu: false };
  }
  renderVals() {
    const s = this.state;
    const more = ['[Назва компанії]', '[Назва компанії]', '[Назва компанії]'];
    const groups = [
      { t: 'Оператори систем розподілу', items: ['Житомиробленерго', 'Прикарпаття­обленерго', 'Харківобленерго'] },
      { t: 'Державні й муніципальні замовники', items: more },
      { t: 'Девелопери', items: more },
      { t: 'Дистриб’ютори', items: more },
      { t: 'Міжнародні партнери', items: more }
    ];
    return Object.assign(this.base(s), { groups });
  }
}

DC.mount(Component);
</script>
