<!doctype html>

<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<shell-top></shell-top>
<main id="main">
<section class="phead">
  <div class="wrap">
    <nav aria-label="Навігаційний ланцюжок"><ol class="crumbs"><li><a href="index.html">Головна</a></li><li><a href="catalog.html">Каталог</a></li><li><span aria-current="page">Послуги</span></li></ol></nav>
    <h1>Послуги</h1>
    <p class="lead">Власні конструкторське бюро, виробництво та випробувальний центр дозволяють нам не лише випускати прилади обліку, а й виконувати замовлення партнерів: від монтажу друкованих плат до здачі об’єктів енергетики «під ключ».</p>
    <div class="tabs"><a href="catalog.html">Продукти</a><a href="services.html" aria-current="page">Послуги</a><a href="software.html">Програмне забезпечення</a></div>
  </div>
</section>

<div class="wrap pbody">
  <div class="ngrid three">
    <sc-for list="{{services}}" as="s" hint-placeholder-count="6">
      <article class="case">
        <div class="bd">
          <h2>{{s.t}}</h2>
          <p class="cd">{{s.d}}</p>
          <a href="{{s.href}}" class="btn btn-line">Детальніше<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </div>
      </article>
    </sc-for>
  </div>
</div>

<section class="wrap band-sec">
  <div class="band">
    <div><h2>Опишіть свій проєкт — ми запропонуємо рішення</h2></div>

  </div>
</section>
</main>
<shell-bottom></shell-bottom>
</script>
<script>
window.DC_BLOBS = {};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cookie: true, menu: false };
  }
  renderVals() {
    return Object.assign(this.base(this.state), {
      services: [
        { t: 'Контрактне виробництво', d: 'SMT-монтаж друкованих плат, лиття пластику та збирання пристроїв за вашою документацією.', href: 'contract.html' },
        { t: 'Випробувальний центр', d: 'Випробування лічильників електроенергії та ПЗ засобів вимірювання в акредитованій лабораторії.', href: 'conformity.html' },
        { t: 'Високовольтні мережі', d: 'Реконструкція підстанцій «під ключ» з розподільчим обладнанням 0,4–35 кВ.', href: 'hv.html' },

      ]
    });
  }
}

DC.mount(Component);
</script>
