<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вакансії НІК-ЕЛЕКТРОНІКА — робота в енергетиці</title>
<meta name="description" content="Відкриті вакансії для інженерів, програмістів, технологів і виробничих фахівців у компанії, що виробляє прилади обліку енергоресурсів.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script src="runtime.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<shell-top></shell-top>
<main id="main">
<section class="phead">
  <div class="wrap">
    <nav aria-label="Навігаційний ланцюжок"><ol class="crumbs"><li><a href="index.html">Головна</a></li><li><a href="about.html">Про нас</a></li><li><a href="career.html">Кар’єра</a></li><li><span aria-current="page">Вакансії</span></li></ol></nav>
    <h1>Вакансії</h1>
    <p class="lead">Приєднуйтеся до команди з понад 600 людей, яка створює прилади обліку для України та інших країн. Оберіть вакансію та надішліть нам резюме.</p>
    <nav class="tabs" aria-label="Розділ «Про нас»"><a href="about.html">Про компанію</a><a href="history.html">Історія</a><a href="career.html" aria-current="page">Кар’єра</a><a href="conformity.html">Центр оцінки відповідності</a><a href="partners.html">Партнери</a><a href="cases.html">Кейси та об’єкти</a></nav>
  </div>
</section>

<div class="wrap pbody">
  <sc-if value="{{hasVacs}}" hint-placeholder-val="{{true}}">
  <div class="vlist">
    <sc-for list="{{vacs}}" as="v" hint-placeholder-count="5">
      <article class="vac">
        <div><h2>{{v.t}}</h2></div>
        <div class="spec"><span>Відділ</span><b>{{v.dep}}</b></div>
        <div class="spec"><span>Локація</span><b>{{v.loc}}</b></div>
        <a href="{{v.mail}}" class="btn btn-line" aria-label="Відгукнутися: {{v.t}}">Відгукнутися</a>
      </article>
    </sc-for>
  </div>
  </sc-if>
  <sc-if value="{{hasVacs}}" hint-placeholder-val="{{true}}"><p class="pnote">Надсилаючи резюме, ви погоджуєтеся на обробку ваших персональних даних для підбору персоналу відповідно до <a href="#">Політики конфіденційності</a>.</p></sc-if>
  <sc-if value="{{noVacs}}" hint-placeholder-val="{{false}}">
  <div class="band">
    <div><h2>Зараз відкритих вакансій немає</h2><p>Надішліть резюме — ми зв’яжемося, щойно з’явиться позиція для вас.</p></div>
    <a href="{{resume}}" class="btn btn-red">Надіслати резюме<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
  </sc-if>
</div>
</main>
<shell-bottom></shell-bottom>
</script>
<script>
window.DC_BLOBS = {};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cookie: true, menu: false };
  }
  renderVals() {
    const s = this.state;
    const MAIL = 'nikel_kiev_rec_list@nikel.com.ua'; // set in the admin panel
    // the address with ?empty shows the state with no open positions
    const V = new URLSearchParams(location.search).has('empty') ? [] : [
      { t: '[Назва посади]', dep: 'Розробка', loc: '[Місто]' }, { t: '[Назва посади]', dep: 'Розробка', loc: '[Місто]' },
      { t: '[Назва посади]', dep: 'Виробництво', loc: '[Місто]' }, { t: '[Назва посади]', dep: 'Метрологія', loc: '[Місто]' },
      { t: '[Назва посади]', dep: 'Продажі', loc: '[Місто]' }
    ];
    const vacs = V.map((v) => ({ ...v, mail: 'mailto:' + MAIL + '?subject=' + encodeURIComponent('Відгук на вакансію: ' + v.t) }));
    return Object.assign(this.base(s), { vacs, hasVacs: vacs.length > 0, noVacs: !vacs.length, resume: 'mailto:' + MAIL });
  }
}

DC.mount(Component);
</script>
</body>
</html>
