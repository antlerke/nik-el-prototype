<section class="sec on-paper">
  <div class="wrap text-rows">
    <div class="about-cols"><h2 class="h2">Випробувальний центр</h2><div class="art"><p>Наш випробувальний центр акредитований Національним агентством з акредитації України на відповідність ДСТУ&nbsp;EN&nbsp;ISO/IEC&nbsp;17025:2019 у сфері випробувань лічильників електричної енергії та програмного забезпечення засобів вимірювальної техніки.</p><p>Це означає, що результати наших випробувань мають офіційно визнану достовірність.</p><p>Ми випробовуємо не лише власну продукцію. До нас звертаються виробники, імпортери й дистриб’ютори лічильників, органи з оцінки відповідності та розробники програмного забезпечення для засобів вимірювальної техніки.</p></div></div>
    <div class="about-cols"><h2 class="h2">Атестат про акредитацію</h2><div class="art"><table class="dtable"><thead><tr><th scope="col">Параметр</th><th scope="col">Значення</th></tr></thead><tbody><tr><td>Орган з акредитації</td><td>Національне агентство з акредитації України (НААУ)</td></tr><tr><td>Стандарт</td><td>ДСТУ EN ISO/IEC 17025:2019</td></tr><tr><td>Номер атестата</td><td>202502</td></tr><tr><td>Дата реєстрації</td><td>30 вересня 2026 року</td></tr><tr><td>Чинний до</td><td>29 вересня 2031 року</td></tr><tr><td>Сфера</td><td>Лічильники електричної енергії та програмне забезпечення засобів вимірювальної техніки</td></tr><tr><td>Додаток</td><td>Сфера акредитації на 19 аркушах</td></tr></tbody></table><p>НААУ — підписант Угоди EA MLA та Угоди Global ACI MRA у сфері «Випробування». Тому наші протоколи видаються в системі акредитації, визнаній на європейському та міжнародному рівнях.</p><p>Чинність атестата можна перевірити у відкритому реєстрі НААУ [посилання на запис у реєстрі].</p></div></div>
  </div>
</section>

<section class="sec">
  <div class="wrap text-rows">
    <div class="about-cols"><h2 class="h2">Навіщо лічильнику випробування</h2><div class="art"><p>Лічильники активної електричної енергії — законодавчо регульовані засоби вимірювальної техніки: категорія MI-003 Технічного регламенту засобів вимірювальної техніки, затвердженого постановою КМУ від 24.02.2016 №&nbsp;163.</p><p>Без оцінки відповідності лічильник не можна розмитнити, продати та ввести в експлуатацію. А для сертифіката потрібен протокол акредитованої лабораторії.</p></div></div>
  </div>
</section>

<section class="sec">
  <div class="wrap text-rows">
    <div class="about-cols"><h2 class="h2">Випробування лічильників</h2><div class="art"><h3>Метрологічна точність</h3><table class="dtable"><thead><tr><th scope="col">№</th><th scope="col">Випробування</th><th scope="col">Що підтверджує</th></tr></thead><tbody><tr><td>1.4</td><td>Передатне число (стала)</td><td>Імпульсний вихід відповідає сталій</td></tr><tr><td>1.5</td><td>Початковий запуск</td><td>Прилад стартує за нормований час</td></tr><tr><td>1.6</td><td>Відсутність самоходу</td><td>Без навантаження енергія не накручується</td></tr><tr><td>1.7</td><td>Поріг чутливості</td><td>Облік при мінімальному струмі</td></tr><tr><td>1.8</td><td>Збіжність</td><td>Повторюваність результатів</td></tr><tr><td>1.9</td><td>Межі похибки за струмом</td><td>Клас точності в робочому діапазоні</td></tr><tr><td>1.10</td><td>Точність відліку часу</td><td>Годинник для багатозонного обліку</td></tr></tbody></table><h3>Точність у реальній мережі</h3><p>Спотворення форми кривої:</p><ul class="feat"><li><span>1.11 Гармоніки в колах струму та напруги</span></li><li><span>1.12 Інтергармоніки в колі струму</span></li><li><span>1.13 Непарні гармоніки в колі струму</span></li><li><span>1.14 Постійний струм і парні гармоніки</span></li></ul><p>Зокрема, перевіряємо стійкість до типових схем спотворення обліку випрямленим сигналом.</p><p>Аномалії мережі та зовнішні впливи:</p><ul class="feat"><li><span>1.15 Зміна напруги</span></li><li><span>1.16 Зміна температури середовища</span></li><li><span>1.17 Переривання фазної напруги</span></li><li><span>1.18 Зміна частоти</span></li><li><span>1.19 Зворотна послідовність фаз</span></li><li><span>1.20 Зміна допоміжної напруги</span></li><li><span>1.21 Робота допоміжних пристроїв</span></li><li><span>1.24 Швидкі зміни струму навантаження</span></li><li><span>1.25 Замикання на землю</span></li></ul><h3>Надійність в експлуатації</h3><ul class="feat"><li><span>1.22 Короткочасні перевантаження струмом</span></li><li><span>1.23 Самонагрівання</span></li><li><span>1.26 Випробування на сухе тепло</span></li><li><span>1.27 Випробування на холод</span></li><li><span>1.28 Випробування на довговічність</span></li></ul><p>Довговічність — за ДСТУ&nbsp;EN&nbsp;62059-32-1:2016.</p><h3>Безпека, споживання, маркування</h3><ul class="feat"><li><span>1.1 Випробування, що стосуються безпеки</span></li><li><span>1.2 Потужність власного споживання</span></li><li><span>1.3 Маркування лічильника</span></li></ul><p>Безпека — за ДСТУ&nbsp;EN&nbsp;62052-31:2022 та ДСТУ&nbsp;EN&nbsp;50470-3:2022.</p><p>Нумерація — за додатком до атестата про акредитацію №&nbsp;202502. Повний перелік 28 позицій надаємо за запитом.</p></div></div>
    <div class="about-cols"><h2 class="h2">Випробування програмного забезпечення</h2><div class="art"><p>Перевіряємо законодавчо значуще ПЗ:</p><ul class="feat"><li><span>вимірювання та облік енергії;</span></li><li><span>тарифікацію;</span></li><li><span>журнал подій;</span></li><li><span>збереження даних під час оновлення;</span></li><li><span>розділення та захист від змін.</span></li></ul><p>А також функції поза метрологією: інтерфейси зв’язку, дисплей і сервісні режими, оновлення прошивки.</p><p>Нормативні документи: ДСТУ 7363:2013 (національні вимоги), ДСТУ OIML D 31:2018 (міжнародні вимоги OIML), WELMEC 7.2:2020 (європейський документ до директиви MID).</p></div></div>
    <div class="about-cols"><h2 class="h2">Нормативна база</h2><div class="art"><p>У сфері акредитації — чинні й попередні редакції стандартів. Тож ми проводимо випробування і для нової сертифікації, і для підтримки виробів, що вже на ринку.</p><table class="dtable"><thead><tr><th scope="col">Стандарт</th><th scope="col">Про що</th></tr></thead><tbody><tr><td>ДСТУ EN IEC 62052-11:2024 · EN 62052-11:2015</td><td>Загальні вимоги та умови випробувань</td></tr><tr><td>ДСТУ EN 62052-31:2022</td><td>Вимоги безпеки та випробування на безпеку</td></tr><tr><td>ДСТУ EN IEC 62053-21 · 62053-22</td><td>Активна енергія: класи 0,5–2 та 0,1S–0,5S</td></tr><tr><td>ДСТУ EN IEC 62053-23 · 62053-24</td><td>Реактивна енергія, зокрема за основною гармонікою</td></tr><tr><td>ДСТУ EN 50470-3:2022</td><td>Європейська серія: класи A, B, C</td></tr><tr><td>ДСТУ EN 62054-21:2015</td><td>Реле часу, багатозонний облік</td></tr><tr><td>ДСТУ EN 62059-32-1:2016</td><td>Надійність і довговічність</td></tr><tr><td>ДСТУ 7363:2013 · OIML D 31 · WELMEC 7.2:2020</td><td>Програмне забезпечення ЗВТ</td></tr></tbody></table></div></div>
  </div>
</section>

<section class="sec on-paper">
  <div class="wrap text-rows">
    <div class="about-cols"><h2 class="h2">Для кого</h2><div class="art"><h3>Органам з оцінки відповідності: лабораторія, яку можна внести до свого переліку</h3><ul class="feat"><li><span>Випробування лічильників за 28 позиціями та ПЗ засобів вимірювальної техніки.</span></li><li><span>Чинні й попередні редакції стандартів, серії IEC 62053 та EN 50470 одночасно.</span></li><li><span>Програму випробувань узгоджуємо заздалегідь, угода про конфіденційність — стандартний крок.</span></li><li><span>Представник замовника може бути присутнім, протокол містить посилання на пункти стандартів.</span></li></ul><p>Надамо повний пакет для внесення до вашого переліку лабораторій: атестат, додаток зі сферою, відомості про обладнання та персонал.</p></div></div>
  </div>
</section>

<section class="sec">

    <p class="lead flow-lead">Вимоги ДСТУ&nbsp;EN&nbsp;ISO/IEC&nbsp;17025:2019 щодо неупередженості та конфіденційності є предметом акредитаційної оцінки. На практиці це означає чотири речі.</p>

<section class="sec on-paper">
  <div class="wrap">
    <div class="shead"><div><span class="kick">ДЛЯ ІМПОРТЕРІВ І ДИСТРИБ’ЮТОРІВ</span><h2 class="h2">Випробування в Україні для імпортованих приладів</h2></div></div>
    <div class="tiles">
      <div class="ftile"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><h3>Кожне випробування триває рівно стільки, скільки вимагає методика, без затримок.</h3></div>
      <div class="ftile"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg><h3>Протокол, який приймають</h3><p>Документ акредитованої лабораторії для оцінки відповідності</p></div>

    <div class="about-cols"><h2 class="h2">Часті питання</h2><div class="art"><div class="qa"><details data-dc-keep><summary><span>Це повірка лічильників?</span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p>Ні. Ми проводимо випробування. Повірка приладів в експлуатації до нашої сфери акредитації не входить.</p></details><details data-dc-keep><summary><span>Скільки триває випробування?</span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p>Залежить від програми. Строк називаємо після узгодження переліку позицій. [типові строки — уточнити]</p></details><details data-dc-keep><summary><span>Скільки це коштує?</span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p>Вартість залежить від програми випробувань. Комерційну пропозицію готуємо на запит.</p></details><details data-dc-keep><summary><span>Якою мовою протокол?</span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p>Українською.</p></details><details data-dc-keep><summary><span>Чи захищена наша інформація?</span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p>Так. Конфіденційність — вимога ДСТУ&nbsp;EN&nbsp;ISO/IEC&nbsp;17025:2019, угоду про конфіденційність підписуємо до передачі зразків.</p></details><details data-dc-keep><summary><span>Що робити, якщо потрібне випробування поза сферою акредитації?</span><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p>Ми скажемо про це прямо й підкажемо лабораторію. Поза атестатом нічого не обіцяємо.</p></details></div></div></div>
