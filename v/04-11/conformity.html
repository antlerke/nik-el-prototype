</section>

<div class="wrap pbody">
  <div class="lab">
    <figure><img src="../../assets/e3a26a87-c-calibration.jpg" alt="Випробування лічильників на стенді"></figure>

    <div class="certs">
      <sc-for list="{{certs}}" as="c" hint-placeholder-count="4">
        <article class="cert">
          <h3>{{c.t}}</h3>
          <small>{{c.st}}</small>
          <p class="cd">{{c.d}}</p>
          <a href="#" class="cgo" aria-label="Сертифікат PDF: {{c.t}}">Сертифікат PDF<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </article>
      </sc-for>

</section>

    </div>
  </div>
</section>

<section class="wrap band-sec">
  <div class="band">
    <div><span class="kick">Випробувальний центр</span><h2>Замовити випробування</h2><p>Випробуємо лічильники та ПЗ за акредитованими методиками. Заявку отримає фахівець центру.</p></div>

</section>

    </div>
    <div class="fbot">
      <span>© 2005–2026 ТОВ «НІК-ЕЛЕКТРОНІКА»</span>
      <nav aria-label="Правова інформація та соцмережі"><a href="#">Політика конфіденційності</a><a href="#" onClick="{{openCookie}}">Cookie</a><span><a href="#">LinkedIn</a> · <a href="#">Facebook</a> · <a href="#">YouTube</a></span></nav>

<!-- Cookie-банер -->
<sc-if value="{{cookie}}" hint-placeholder-val="{{true}}">
  <div class="cookie" role="region" aria-label="Налаштування cookie">
    <p>Ми використовуємо необхідні cookie, щоб сайт працював. За вашою згодою також використаємо аналітичні cookie і сторонні сервіси — карти та відео. Детальніше — у <a href="#">Політиці cookie</a>.</p>
    <div class="row">
      <button class="btn btn-ink" onClick="{{closeCookie}}">Прийняти всі</button>
      <button class="btn btn-line" onClick="{{closeCookie}}">Лише необхідні</button>
      <button class="btn lnk" onClick="{{closeCookie}}">Налаштувати</button>
    </div>
  </div>
</sc-if>

</div>
</script>
<script>
window.DC_BLOBS = {};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cookie: true, menu: false };
  }
  base(s) {
    const isMenu = (t, href, items) => ({ t, href, items: items.map((x) => (Array.isArray(x) ? { t: x[0], href: x[1] } : { t: x, href })) });
    return {
      menu: [
        isMenu('Каталог', 'catalog.html', ['Продукти', 'Послуги', 'Програмне забезпечення', 'Таблиця взаємозамінності', 'Порівняти товари']),
        isMenu('Про нас', '#', ['Про компанію', ['Історія компанії', 'history.html'], ['Кар’єра', 'career.html'], ['Центр оцінки відповідності', 'conformity.html'], ['Наші партнери', 'partners.html']]),
        isMenu('Контакти', '#', ['Де купити', ['Сервісний центр', '#']]),
        isMenu('Прес-центр', 'news.html', ['Новини', ['НІКіпедія', '#'], ['Ми у ЗМІ', '#']])
      ],
      cookie: s.cookie && !s.menu,
      menuOpen: s.menu, menuExp: String(s.menu), menuLabel: s.menu ? 'Закрити меню' : 'Відкрити меню',
      burgerPath: s.menu ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      menuClick: (e) => { if (e && e.target && e.target.closest && e.target.closest('a')) this.setState({ menu: false }); },
      closeCookie: () => this.setState({ cookie: false }),
      openCookie: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ cookie: true }); }
    };
  }
  renderVals() {
    const certs = [
      { t: 'Управління якістю', st: 'ISO 9001', d: 'Вимоги до системи управління якістю: від розробки до сервісу.' },
      { t: 'Екологічний менеджмент', st: 'ISO 14001', d: 'Вимоги до системи екологічного менеджменту виробництва.' },
      { t: 'Інформаційна безпека', st: 'ISO/IEC 27001', d: 'Вимоги до системи управління інформаційною безпекою.' },
      { t: 'Компетентність лабораторії', st: 'ДСТУ EN ISO/IEC 17025:2019', d: 'Акредитація НААУ випробувального центру: 28 видів випробувань лічильників і випробування ПЗ.' }
    ];
    return Object.assign(this.base(this.state), { certs });
  }
}

DC.mount(Component);
</script>
