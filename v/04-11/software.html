<body>

<section class="phead">

    <div class="tabs"><a href="catalog.html">Продукти</a><a href="services.html">Послуги</a><a href="software.html" aria-current="page">Програмне забезпечення</a></div>

<script>
window.DC_BLOBS = {};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cookie: true, menu: false };
  }
  renderVals() {
    return Object.assign(this.base(this.state), {
      groups: [
        { t: 'Веб-платформи', items: [
          { t: 'NovaSyS', d: 'Автоматизована система контролю та обліку енергоресурсів від виробника лічильників NIK. Сама збирає дані з лічильників, перевіряє їх і перетворює на облік, баланси та звіти. Дві модифікації — для енергопостачання і для промисловості.' },
          { t: 'NIK Space', d: 'Комплексна система віддаленого збору показань лічильників для енергокомпаній та ОСББ. Оптимізує обслуговування будинку, заощаджує споживачам час і зменшує витрати.' },
          { t: 'UNIK', d: 'Програма для Windows, через яку налаштовують і зчитують лічильники NIK на місці встановлення. До оптичного порту лічильника вона підключається через оптичну головку OP-03.' },
          { t: 'AGSM GURU', d: '[уточнити]' }
        ] },
        { t: 'Мобільні застосунки', items: [
          { t: 'NIK-Surfer', d: 'Застосунок для збору показань лічильників по радіоканалу wM-Bus у парі з апаратним RF-to-USB модулем NIK-Surfer.' },
          { t: 'NIK BT-DLMS', d: '[уточнити]' }
        ] }
      ]
    });
  }
}

DC.mount(Component);
</script>
