<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кар’єра — варіант</title>
<!-- One look of where more photos go on «Кар’єра» (client feedback 23.11: «can we add photos there?»). The page body is
     read from the committed career.html (/@HEAD/ of tools-for-ai/serve.cjs) and drawn with the site's own style.css;
     each look only adds to it. ?look=now|A|B|C|D|E|F — the switcher (index.html) puts it in a frame.
     Photos are stand-ins from assets/ until the client sends real ones. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../v/04-11/style.css">
<style>
body{margin:0;background:#ffffff}
.ph{position:relative;margin:0;border-radius:1rem;overflow:hidden;background:var(--gray)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* B — a photo under «Кого ми шукаємо», where the left column is empty now */
.lkB .cr-who{grid-template-rows:auto 1fr;row-gap:1.5rem}
.lkB .cr-who>.h2{grid-column:1;grid-row:1}
.lkB .cr-who>.ph{grid-column:1;grid-row:2;aspect-ratio:4/3}
.lkB .cr-who>.art{grid-column:2;grid-row:1/span 2}
/* C — four photos in a row under the «Чому» cards */
.lkC-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:1rem}
.lkC-row .ph{aspect-ratio:4/3}
/* D — one photo in the page head, right of the text */
.lkD-head{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);column-gap:4rem;align-items:center}
.lkD-head .ph{align-self:stretch;min-height:22rem}
/* E — a photo on top of every «Чому» card */
.lkE .cr-why4 .service{padding-top:0;overflow:hidden}
.lkE .cr-why4 .ph{margin:0 -1.5rem 1.5rem;aspect-ratio:4/3;border-radius:0}
.lkE .cr-why4 .cr-icon{margin-top:-3.25rem;position:relative;z-index:1;box-shadow:0 0 0 .25rem var(--ink)}
/* F — a strip of photos edge to edge across the screen, between «Чому» and «Ми пропонуємо» */
.lkF-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem;padding:.5rem 0;background:var(--paper)}
.lkF-strip .ph{aspect-ratio:1/1;border-radius:0}
@media (max-width:900px){
  .lkB .cr-who>.h2,.lkB .cr-who>.ph,.lkB .cr-who>.art{grid-column:1;grid-row:auto}
  .lkB .cr-who>.ph{aspect-ratio:16/9}
  .lkC-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lkD-head{grid-template-columns:minmax(0,1fr)}
  .lkD-head .ph{min-height:0;aspect-ratio:16/9;margin-top:2rem}
  .lkF-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lkF-strip .ph:nth-child(n+4){display:none}
}
@media (max-width:600px){
  /* the cards are rows on phones: a small square photo on the left instead of the icon */
  .lkE .cr-why4 .service{padding:0 1rem 0 0;align-items:stretch}
  .lkE .cr-why4 .ph{flex:0 0 5.5rem;margin:0;aspect-ratio:1/1}
  .lkE .cr-why4 .cr-icon{display:none}
  .lkE .cr-why4 .service h3{align-self:center}
}
</style>
</head>
<body>
<!-- the site sets its font and text colour on this wrapper (shell.js), not in style.css -->
<div id="root" style="font-family: Geologica, sans-serif; color: var(--text); background: #ffffff; overflow-x: clip"></div>
<script>
const look = new URLSearchParams(location.search).get('look') || 'now';
const P = (f) => '../../../assets/' + f;
const ph = (f) => `<figure class="ph"><img src="${P(f)}" alt=""></figure>`;
const PICS = ['e3a26a87-c-calibration.jpg', 'de1ec571-role-engineer.webp', '1695fc08-c-tampo.jpg', '2d5e93a9-c-robot.jpg', '91d9cc8d-c-automation.jpg'];
const report = () => parent.postMessage({ h: document.documentElement.scrollHeight }, '*');

fetch('/@HEAD/v/04-11/career.html').then((r) => r.text()).then((html) => {
  const main = html.slice(html.indexOf('<main id="main">'), html.indexOf('</main>') + 7).split('../../assets/').join(P(''));
  const root = document.getElementById('root');
  root.innerHTML = main;
  const m = root.querySelector('main');
  m.classList.add('lk' + look);
  const why = m.querySelector('.cr-dark');
  const sections = m.querySelectorAll('section');
  const rozdily = sections[sections.length - 1];
  if (look === 'A') rozdily.insertAdjacentHTML('beforebegin', `<section class="sec"><div class="wrap"><div class="shead"><div><h2 class="h2">Життя команди</h2></div></div><div class="mosaic">${PICS.map(ph).join('')}</div></div></section>`);
  if (look === 'B') m.querySelector('.cr-who>.h2').insertAdjacentHTML('afterend', ph(PICS[1]));
  if (look === 'C') why.querySelector('.cr-why4').insertAdjacentHTML('afterend', `<div class="lkC-row">${PICS.slice(0, 4).map(ph).join('')}</div>`);
  if (look === 'D') { const w = m.querySelector('.phead .wrap'), tabs = w.querySelector('.tabs'); tabs.remove(); w.innerHTML = `<div class="lkD-head"><div>${w.innerHTML}</div>${ph(PICS[0])}</div>`; w.append(tabs); }
  if (look === 'E') why.querySelectorAll('.service').forEach((s, i) => s.insertAdjacentHTML('afterbegin', ph(PICS[i])));
  if (look === 'F') why.insertAdjacentHTML('afterend', `<div class="lkF-strip">${PICS.map(ph).join('')}</div>`);
  // tell the switcher how tall the page is, so the frame shows it whole
  report(); new ResizeObserver(report).observe(document.body);
});
addEventListener('load', report);
</script>
</body>
</html>
