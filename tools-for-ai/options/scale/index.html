<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Масштаб сайту — порівняння</title>
<!-- Client feedback 19.11, step 5 («все завелике»): any page of the site at a chosen browser zoom and screen width, to choose
     how much smaller the site should get. Zoom is shown the way the browser does it: the page is laid out for
     width ÷ zoom and drawn smaller, so the layout switches exactly as with Ctrl −.
     Open: http://127.0.0.1:8740/tools-for-ai/options/scale/ -->
<style>
  :root{--ink:#13385d;--line:#dde3e9;--paper:#f4f6f8}
  body{margin:0;font:15px/1.45 system-ui,sans-serif;color:#1d2833;background:#cfd4da}
  header{position:sticky;top:0;z-index:2;padding:12px 16px;background:#ffffff;box-shadow:0 1px 0 var(--line)}
  h1{margin:0 0 8px;font-size:16px;color:var(--ink)}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .row+.row{margin-top:8px}
  .row span{min-width:120px;font-size:13px;color:#59636e}
  button{min-height:34px;padding:0 12px;border:0;border-radius:8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font:600 14px system-ui,sans-serif;color:var(--ink);cursor:pointer}
  button[aria-pressed="true"]{background:var(--ink);box-shadow:none;color:#ffffff}
  #info{margin:10px 0 0;color:#36434f}
  .stage{margin:16px auto;overflow:hidden;background:#ffffff;box-shadow:0 8px 24px -12px rgba(0,0,0,.35)}
  iframe{display:block;border:0;transform-origin:0 0}
</style>
</head>
<body>
<header>
  <h1>Масштаб сайту: як виглядає сторінка, якщо все зменшити</h1>
  <div class="row" id="pages"><span>Сторінка:</span></div>
  <div class="row" id="zooms"><span>Масштаб:</span></div>
  <div class="row" id="screens"><span>Ширина екрана:</span></div>
  <p id="info"></p>
</header>
<div class="stage" id="stage"><iframe id="f" title="Сторінка" scrolling="no"></iframe></div>
<script>
const PAGES = [['index', 'Головна'], ['about', 'Про компанію'], ['conformity', 'Центр оцінки'], ['contract', 'Контрактне виробництво'], ['career', 'Кар’єра'], ['services', 'Послуги'], ['catalog', 'Каталог'], ['product', 'Картка товару'], ['hv', 'Високовольтні мережі']];
const ZOOMS = [['1', '100% — зараз'], ['0.9', '90%'], ['0.85', '85%'], ['0.8', '80%']];
const SCREENS = [['1366', 'Ноутбук 1366'], ['1440', '1440'], ['1536', 'Ноутбук 1536'], ['1920', 'Монітор 1920']];
const f = document.getElementById('f'), stage = document.getElementById('stage'), info = document.getElementById('info');
const state = { page: 'about', z: '1', w: '1440' };
try { Object.assign(state, JSON.parse(localStorage.getItem('scale-options') || '{}')); } catch (e) {}
const fit = () => {
  const z = +state.z, w = +state.w, d = f.contentDocument;
  if (!d || !d.documentElement) return;
  const h = d.documentElement.scrollHeight;
  f.style.height = h + 'px'; stage.style.height = Math.ceil(h * z) + 'px';
};
const show = () => {
  const z = +state.z, w = +state.w;
  stage.style.width = w + 'px';
  f.style.width = Math.round(w / z) + 'px'; f.style.transform = `scale(${z})`;
  f.src = '../../../v/04-11/' + state.page + '.html';
  for (const [row, key] of [['pages', 'page'], ['zooms', 'z'], ['screens', 'w']]) document.querySelectorAll('#' + row + ' button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.k === state[key]));
  info.textContent = z === 1 ? 'Так сайт виглядає зараз.' : `Так клієнт бачить сайт, якщо зменшить масштаб браузера до ${Math.round(z * 100)}%: сторінка розкладена для ширини ${Math.round(w / z)} px і намальована дрібніше.`;
  try { localStorage.setItem('scale-options', JSON.stringify(state)); } catch (e) {}
};
f.addEventListener('load', () => {
  // hide the cookie panel, then size the frame to the whole page (the page is drawn by a script, so wait a little)
  const s = f.contentDocument.createElement('style'); s.textContent = '.cookie{display:none!important}'; f.contentDocument.head.append(s);
  [300, 900, 2000].forEach((t) => setTimeout(fit, t));
});
const add = (row, k, text, key) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = text; b.onclick = () => { state[key] = k; show(); }; document.getElementById(row).append(b); };
PAGES.forEach(([k, t]) => add('pages', k, t, 'page'));
ZOOMS.forEach(([k, t]) => add('zooms', k, t, 'z'));
SCREENS.forEach(([k, t]) => add('screens', k, t, 'w'));
show();
</script>
</body>
</html>
