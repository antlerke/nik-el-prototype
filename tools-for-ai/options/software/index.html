<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Програмне забезпечення — логотипи, варіанти</title>
<!-- Switcher for Anna: where product logos and pictures go on «Програмне забезпечення» (client feedback 23.11), in a frame at a chosen width.
     Open: http://127.0.0.1:8740/tools-for-ai/options/software/index.html -->
<style>
  :root{--ink:#13385d;--red:#c8102e;--line:#dde3e9;--paper:#f4f6f8}
  body{margin:0;font:15px/1.45 system-ui,sans-serif;color:#1d2833;background:#cfd4da}
  header{position:sticky;top:0;z-index:2;padding:12px 16px;background:#ffffff;box-shadow:0 1px 0 var(--line)}
  h1{margin:0 0 8px;font-size:16px;color:var(--ink)}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .row+.row{margin-top:8px}
  .row span{margin-right:4px;font-size:13px;color:#59636e}
  button{min-height:36px;padding:0 14px;border:0;border-radius:8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font:600 14px system-ui,sans-serif;color:var(--ink);cursor:pointer}
  button[aria-pressed="true"]{background:var(--ink);box-shadow:none;color:#ffffff}
  button.new{box-shadow:inset 0 0 0 1.5px var(--red)}
  button.new[aria-pressed="true"]{background:var(--red)}
  #desc{margin:10px 0 0;max-width:900px;color:#36434f}
  .stage{display:flex;justify-content:center;padding:16px}
  iframe{display:block;border:0;background:#ffffff;box-shadow:0 8px 24px -12px rgba(0,0,0,.35)}
</style>
</head>
<body>
<header>
  <h1>«Програмне забезпечення» — логотипи та картинки продуктів</h1>
  <div class="row" id="looks"><span>Варіант:</span></div>
  <div class="row" id="widths"><span>Ширина:</span></div>
  <p id="desc"></p>
</header>
<div class="stage"><iframe id="f" title="Варіант" scrolling="no"></iframe></div>
<script>
const LOOKS = [
  ['now', 'Зараз', 'Як на сайті: лише назва продукту.'],
  ['A', 'A', 'Маленький квадратний логотип ліворуч від назви.'],
  ['B', 'B', 'Логотип на білій панелі через усю верхню частину картки — як фото товару.'],
  ['C', 'C', 'Логотип замість назви: великим, ліворуч угорі; назва лишається лише для пошуковиків і читалок екрана.'],
  ['D', 'D', 'Маленький логотип у правому верхньому куті картки, назва й текст — як зараз.'],
  ['E', 'E', 'Висока панель із логотипом ліворуч у картці, текст праворуч (на телефоні панель зверху).'],
  ['F', 'F — головний продукт', 'NovaSys — головна платформа — великою карткою на всю ширину: текст зліва, справа вікно програми з місцем під скриншот інтерфейсу. Решта — менші картки з логотипом, як на сайті зараз.', 1],
  ['G', 'G — F з тим, що є', 'Як F, але великою карткою NIK Space: справжній логотип і справжній екран програми (з PDF компанії на старому сайті). UNIK — зі знаком «U» з його коробки на старому сайті.', 1],
  ['I', 'I — іконки', 'Замість логотипів — іконка того, що робить програма, у рожевому кружку, як на інших сторінках сайту. Без порожніх місць; логотипи потім стануть на місце іконок.', 1],
  ['K', 'K — як каталог', 'Картки як у товарів каталогу: мітка (веб-платформа / програма для Windows / мобільний застосунок), панель з картинкою, назва, опис. Картинки з нинішнього сайту компанії: коробки NovaSyS і UNIK, логотип NIK Space, модуль NIK-Surfer. Де картинки немає — велика іконка.', 1],
  ['L', 'L — K + головний продукт', 'K з правками (мітки: де працює програма; більші коробки; білі кнопки) і NIK Space першим — широка картка з логотипом і справжнім екраном програми з PDF компанії. На справжньому сайті — скриншот без реальних даних.', 1],
  ['T1', 'T1 — мітки з іконкою', 'L, але в мітці маленька іконка: глобус — веб, вікно — Windows, телефон — мобільний.', 1],
  ['T2', 'T2 — мітка лише де інакше', 'L, але мітка лише там, де програма відрізняється від свого розділу: UNIK серед веб-платформ — «Програма для Windows» (червоним). Решта без міток.', 1],
  ['T3', 'T3 — для кого', 'L, але мітка каже, для кого програма або що робить (зі слів її опису). У AGSM GURU і NIK BT-DLMS опису ще немає — без мітки.', 1],
  ['T4', 'T4 — мітка біля назви', 'Як T1 (мітка з іконкою), але мітка праворуч від назви програми, а у великій картці — праворуч від логотипа. Картки починаються з картинки.', 1],
];
const WIDTHS = [['1440', 'Комп’ютер 1440'], ['1000', 'Ноутбук / планшет 1000'], ['700', 'Планшет 700'], ['390', 'Телефон 390']];
const f = document.getElementById('f'), desc = document.getElementById('desc');
const state = { look: 'now', w: '1440' };
try { Object.assign(state, JSON.parse(localStorage.getItem('software-options') || '{}')); } catch (e) {}
const show = () => {
  f.style.width = state.w + 'px';
  f.src = 'view.html?look=' + state.look;
  document.querySelectorAll('#looks button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.k === state.look));
  document.querySelectorAll('#widths button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.k === state.w));
  desc.textContent = LOOKS.find((l) => l[0] === state.look)[2];
  try { localStorage.setItem('software-options', JSON.stringify(state)); } catch (e) {}
};
const add = (row, k, text, key, isNew) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = text; if (isNew) b.className = 'new'; b.onclick = () => { state[key] = k; show(); }; document.getElementById(row).append(b); };
LOOKS.forEach(([k, t, , n]) => add('looks', k, t, 'look', n));
WIDTHS.forEach(([k, t]) => add('widths', k, t, 'w'));
addEventListener('message', (e) => { if (e.data && e.data.h) f.style.height = e.data.h + 'px'; });
addEventListener('keydown', (e) => { const i = LOOKS.findIndex((l) => l[0] === state.look); if (e.key === 'ArrowRight' && i < LOOKS.length - 1) { state.look = LOOKS[i + 1][0]; show(); } if (e.key === 'ArrowLeft' && i > 0) { state.look = LOOKS[i - 1][0]; show(); } });
show();
</script>
</body>
</html>
