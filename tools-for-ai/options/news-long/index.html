<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінка новини — варіанти</title>
<!-- Switcher for the client (28.11): the news page in a frame, two layouts of the text. The site's files stay as they are:
     option B is CSS added to the page inside the frame. Open: http://127.0.0.1:8740/tools-for-ai/options/news-long/index.html -->
<style>
  :root{--ink:#13385d;--line:#dde3e9;--paper:#f4f6f8}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;font:15px/1.45 system-ui,sans-serif;color:#1d2833;background:#cfd4da}
  header{padding:12px 16px;background:#ffffff;box-shadow:0 1px 0 var(--line)}
  h1{margin:0 0 8px;font-size:16px;color:var(--ink)}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .row+.row{margin-top:8px}
  .row span{min-width:110px;font-size:13px;color:#59636e}
  button{min-height:34px;padding:0 12px;border:0;border-radius:8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font:600 14px system-ui,sans-serif;color:var(--ink);cursor:pointer}
  button[aria-pressed="true"]{background:var(--ink);box-shadow:none;color:#ffffff}
  #desc{margin:10px 0 0;max-width:960px;color:#36434f}
  .stage{flex:1;display:flex;justify-content:center;padding:12px;min-height:0;overflow:auto}
  iframe{display:block;height:100%;border:0;background:#ffffff;box-shadow:0 8px 24px -12px rgba(0,0,0,.35)}
</style>
</head>
<body>
<header>
  <h1>Сторінка новини: як розмістити текст</h1>
  <div class="row" id="pages"><span>Новина:</span></div>
  <div class="row" id="looks"><span>Варіант:</span></div>
  <div class="row" id="widths"><span>Ширина:</span></div>
  <p id="desc"></p>
</header>
<div class="stage"><iframe id="f" title="Сторінка новини"></iframe></div>
<script>
const PAGES = [
  ['long', 'Довга (трансформатори струму)', 'view.html'],
  ['short', 'Коротка (ISO 27001)', '../../../v/04-11/article.html'],
];
const LOOKS = [
  ['A', 'A — текст + зміст праворуч', 'Текст шириною 55rem від лівого краю, праворуч зміст статті: їде разом із прокруткою, поточний розділ підсвічений. Зміст є, лише коли в новині 3 підзаголовки або більше. На планшеті й телефоні зміст — карткою над текстом.', ''],
  ['B', 'B — текст на всю ширину', 'Текст на всю ширину сторінки (як фото над ним), змісту немає. Найкоротша сторінка, але рядки дуже довгі — на комп’ютері близько 120 знаків.',
    '.lg-toc{display:none!important}.agrid.wide.lg-has-toc{grid-template-columns:minmax(0,1fr)}'],
];
const WIDTHS = [['1440', 'Комп’ютер 1440'], ['1000', 'Планшет 1000'], ['390', 'Телефон 390']];
const f = document.getElementById('f'), desc = document.getElementById('desc');
const state = { page: 'long', look: 'A', w: '1440' };
try { Object.assign(state, JSON.parse(localStorage.getItem('news-options') || '{}')); } catch (e) {}
const show = () => {
  f.style.width = state.w + 'px';
  f.src = PAGES.find((p) => p[0] === state.page)[2];
  for (const [row, key] of [['pages', 'page'], ['looks', 'look'], ['widths', 'w']]) document.querySelectorAll('#' + row + ' button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.k === state[key]));
  desc.textContent = LOOKS.find((l) => l[0] === state.look)[2];
  try { localStorage.setItem('news-options', JSON.stringify(state)); } catch (e) {}
};
f.addEventListener('load', () => {
  const css = LOOKS.find((l) => l[0] === state.look)[3];
  if (!css) return;
  const st = f.contentDocument.createElement('style'); st.textContent = css; f.contentDocument.head.append(st);
});
const buttons = (row, list, key) => list.forEach(([k, label]) => {
  const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = label;
  b.onclick = () => { state[key] = k; show(); };
  document.getElementById(row).append(b);
});
buttons('pages', PAGES, 'page'); buttons('looks', LOOKS, 'look'); buttons('widths', WIDTHS, 'w');
show();
</script>
</body>
</html>
