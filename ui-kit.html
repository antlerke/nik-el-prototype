    <h1>Кольори · UI kit</h1>
    <p>Одна палітра для десктопу й мобільної. Близькі відтінки зведені в один: 18 кольорів замість ~32. Червоний — один фірмовий, без «неонового».</p>
  </div>
  <h2 class="h">Бренд</h2><div class="grid"><div class="sw"><div class="c" style="background:#0D2A47"><span style="color:#ffffff">#0D2A47</span></div><div class="i"><b>Navy 900</b><p>Темні секції (відео, футер), наведення на сині кнопки</p><small>14.6 : 1 на білому</small></div></div><div class="sw"><div class="c" style="background:#13385D"><span style="color:#ffffff">#13385D</span></div><div class="i"><b>Navy 700</b><p>Заголовки, сині кнопки, активні елементи, іконки</p><small>12.0 : 1 на білому</small></div></div><div class="sw"><div class="c" style="background:#C8102E"><span style="color:#ffffff">#C8102E</span></div><div class="i"><b>Red 600</b><p>Головні кнопки, «+» у цифрах, крапки в мітках, маркери на схемі</p><small>5.9 : 1 на білому</small></div></div><div class="sw"><div class="c" style="background:#A50D26"><span style="color:#ffffff">#A50D26</span></div><div class="i"><b>Red 700</b><p>Наведення на червоні кнопки, червоний текст: мітки, теги, «Читати далі»</p><small>7.8 : 1 на білому</small></div></div></div><h2 class="h">Текст на світлому</h2><div class="grid"><div class="sw"><div class="c" style="background:#36434F"><span style="color:#ffffff">#36434F</span></div><div class="i"><b>Text</b><p>Основний текст, описи, текст у формі</p><small>10.1 : 1 на білому</small></div></div><div class="sw"><div class="c" style="background:#59636E"><span style="color:#ffffff">#59636E</span></div><div class="i"><b>Muted</b><p>Другорядне: дати, підписи, характеристики, категорія під приладом</p><small>6.1 : 1 на білому</small></div></div><div class="sw"><div class="c" style="background:#6B7682"><span style="color:#ffffff">#6B7682</span></div><div class="i"><b>Placeholder</b><p>Лише підказки в полях форми</p><small>4.6 : 1 на білому</small></div></div></div><h2 class="h">Текст на темному (Navy 700 / 900)</h2><div class="grid"><div class="sw"><div class="c" style="background:#13385d;color:#FFFFFF"><span style="color:#FFFFFF;font-size:28px;font-weight:700;font-family:Geologica,sans-serif">Аа</span><span style="color:#FFFFFF">#FFFFFF</span></div><div class="i"><b>On dark</b><p>Заголовки й посилання на темному</p><small>12.0 : 1 на Navy 700</small></div></div><div class="sw"><div class="c" style="background:#13385d;color:#D3DEEA"><span style="color:#D3DEEA;font-size:28px;font-weight:700;font-family:Geologica,sans-serif">Аа</span><span style="color:#D3DEEA">#D3DEEA</span></div><div class="i"><b>On dark muted</b><p>Описи й пункти на темному</p><small>8.8 : 1 на Navy 700</small></div></div><div class="sw"><div class="c" style="background:#13385d;color:#A9BBCF"><span style="color:#A9BBCF;font-size:28px;font-weight:700;font-family:Geologica,sans-serif">Аа</span><span style="color:#A9BBCF">#A9BBCF</span></div><div class="i"><b>On dark subtle</b><p>Нижній рядок футера, неактивні крапки</p><small>6.1 : 1 на Navy 700</small></div></div></div><h2 class="h">Поверхні</h2><div class="grid"><div class="sw"><div class="c" style="background:#FFFFFF"><span style="color:#13385d">#FFFFFF</span></div><div class="i"><b>White</b><p>Фон сторінки, картки, поля форми</p></div></div><div class="sw"><div class="c" style="background:#F4F6F8"><span style="color:#13385d">#F4F6F8</span></div><div class="i"><b>Paper</b><p>Сірі секції, неактивні кнопки й вкладки</p></div></div><div class="sw"><div class="c" style="background:#E6EAEB"><span style="color:#13385d">#E6EAEB</span></div><div class="i"><b>Gray</b><p>Наведення, заглушки фото</p></div></div></div><h2 class="h">Лінії й відтінки</h2><div class="grid"><div class="sw"><div class="c" style="background:#DDE3E9"><span style="color:#13385d">#DDE3E9</span></div><div class="i"><b>Line</b><p>Рамки карток, роздільники</p></div></div><div class="sw"><div class="c" style="background:#8592A0"><span style="color:#ffffff">#8592A0</span></div><div class="i"><b>Line strong</b><p>Рамки полів форми, чекбокси (наведення — #59636E)</p><small>3.2 : 1 на білому</small></div></div><div class="sw"><div class="c" style="background:rgba(200,16,46,.08)"><span style="color:#13385d">(200,16,46,.08)</span></div><div class="i"><b>Red tint</b><p>Фон міток розділів і червоних тегів (рамка — 18%)</p></div></div><div class="sw"><div class="c" style="background:rgba(19,56,93,.08)"><span style="color:#13385d">(19,56,93,.08)</span></div><div class="i"><b>Navy tint</b><p>Фон синіх тегів категорій</p></div></div></div><h2 class="h">Службові</h2><div class="grid"><div class="sw"><div class="c" style="background:#007AC2"><span style="color:#ffffff">#007AC2</span></div><div class="i"><b>Focus</b><p>Рамка фокусу з клавіатури</p><small>4.6 : 1 на білому</small></div></div><div class="sw"><div class="c" style="background:#006B44"><span style="color:#ffffff">#006B44</span></div><div class="i"><b>Success</b><p>Повідомлення «Дякуємо» (фон #CCEAE0)</p><small>6.6 : 1 на білому</small></div></div></div>
  <h2 class="h">Що зміниться</h2>
  <table><tr><th style="width:250px">Було</th><th style="width:150px">Стане</th><th>Де</th></tr><tr><td class="n">#E30427</td><td class="n">#C8102E</td><td class="w">Крапки в мітках, маркери на схемі розрізу, «+» у цифрах, активні крапки</td></tr><tr><td class="n">#C2031F · #B8031F</td><td class="n">#A50D26</td><td class="w">Текст міток розділів, червоні теги, «Читати далі», «01 / 04»</td></tr><tr><td class="n">червоні відтінки 7% · 10% · 11% · 16%</td><td class="n">8% · 18%</td><td class="w">Фон і рамка міток, тегів, номера «01», номерів етапів</td></tr><tr><td class="n">#21272E</td><td class="n">#36434F</td><td class="w">Опис у картках каталогу, текст у полях форми</td></tr><tr><td class="n">#46515C</td><td class="n">#59636E</td><td class="w">Категорія під приладом, підписи «Мережа / Струм», характеристики</td></tr><tr><td class="n">#F3F6FA</td><td class="n">#FFFFFF</td><td class="w">Посилання у футері</td></tr><tr><td class="n">#DCE5EE</td><td class="n">#D3DEEA</td><td class="w">Пункти під відео</td></tr><tr><td class="n">#CCD5DE</td><td class="n">#8592A0</td><td class="w">Рамки полів форми й чекбокса — тепер 3 : 1 до білого, як вимагає стандарт доступності</td></tr><tr><td class="n">#FAFBFC</td><td class="n">#FFFFFF</td><td class="w">Фон полів форми</td></tr><tr><td class="n">синій відтінок 10%</td><td class="n">8%</td><td class="w">Фон синіх тегів категорій</td></tr></table>
  <h2 class="h">Правила</h2>
  <div class="rules">
    <div class="rule"><b>Червоний — лише акцент</b>Головна кнопка, «+», крапки й маркери. Не більше одного червоного елемента, що «кличе до дії», на екран.</div>
    <div class="rule"><b>Синій — структура</b>Заголовки, другорядні кнопки, активні вкладки, іконки. Темні секції — Navy 900.</div>
    <div class="rule"><b>Контраст</b>Текст — не менше 4,5 : 1 до фону. Тому світлі сірі (#A9BBCF, #D3DEEA) — тільки на темному фоні.</div>
  </div>
</div>
