<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Головна — NIK-ЕЛЕКТРОНІКА (прототип)</title>
<meta name="robots" content="noindex">

<style>
@font-face{font-family:'Geologica';font-style:normal;font-weight:300 800;font-display:swap;src:url(assets/58ce8622-Geologica-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Geologica';font-style:normal;font-weight:300 800;font-display:swap;src:url(assets/129ad3ba-Geologica-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<style>
body{margin:0;background:#ffffff}
::selection{background:#13385d;color:#ffffff}
a{color:#13385d}a:not(.btn):hover{color:#b8031f}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}
.nav a{color:#13385d;text-decoration:none;font-weight:500;font-size:15px;padding:10px 0;transition:color .15s ease}
.nav a:hover{color:#b8031f}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:8px;font-weight:600;font-size:16px;text-decoration:none;box-sizing:border-box;border:0;cursor:pointer;font-family:inherit;transition:background-color .15s ease,color .15s ease,transform .16s cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.97)}
.btn-red{background:#e30427;color:#ffffff}.btn-red:hover{background:#b8031f;color:#ffffff}
.btn-line{box-shadow:inset 0 0 0 1.5px #13385d;color:#13385d;background:transparent}.btn-line:hover{background:#13385d;color:#ffffff}
.icon-btn{width:44px;height:44px;border-radius:8px;border:1px solid #c3ccd6;background:#ffffff;color:#13385d;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s ease,transform .16s cubic-bezier(.23,1,.32,1)}
.icon-btn:hover{border-color:#13385d}.icon-btn:active{transform:scale(.95)}
.h2{margin:0;font-size:clamp(36px,4vw,56px);line-height:1.04;font-weight:700;color:#13385d;letter-spacing:-0.025em;text-wrap:balance}
.skip{position:absolute;left:16px;top:-80px;z-index:100;background:#13385d;color:#ffffff;padding:12px 16px;border-radius:8px;text-decoration:none;font-weight:600}.skip:focus{top:12px;color:#ffffff}.skip:hover{color:#ffffff}
:focus-visible{outline:3px solid #007ac2;outline-offset:3px}
.burger{display:none}
@media (max-width:900px){.nav{display:none !important}.burger{display:inline-flex}}

/* hero load sequence */
.line{display:block;overflow:hidden;padding-bottom:.06em}
.line>span{display:block;animation:rise 900ms cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{transform:translateY(108%)}}
.fade-in{animation:fadeUp 700ms cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
.stage-img{animation:stageIn 1100ms cubic-bezier(.16,1,.3,1) 150ms both}
@keyframes stageIn{from{opacity:0;transform:scale(1.05)}}

/* hotspots */
.hs{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:fadeUp 500ms cubic-bezier(.16,1,.3,1) both}
.hs-dot{position:relative;width:16px;height:16px;border-radius:50%;background:#e30427;box-shadow:0 0 0 4px rgba(255,255,255,.95),0 2px 8px rgba(11,15,20,.25);transition:transform .2s cubic-bezier(.23,1,.32,1),background-color .2s ease}
.hs-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #e30427;animation:ping 2.6s cubic-bezier(.16,1,.3,1) infinite}
@keyframes ping{0%{transform:scale(.8);opacity:.9}70%,100%{transform:scale(2.4);opacity:0}}
.hs[aria-pressed="true"] .hs-dot{background:#13385d;transform:scale(1.25)}
.hs[aria-pressed="true"] .hs-dot::after{border-color:#13385d}
.hs-card{position:absolute;left:24px;bottom:24px;max-width:340px;background:#ffffff;border-radius:12px;padding:20px 22px;box-shadow:0 10px 28px rgba(11,15,20,.14);transition:opacity .25s ease,transform .3s cubic-bezier(.23,1,.32,1);opacity:0;transform:translateY(10px);pointer-events:none}
.hs-card.on{opacity:1;transform:none;pointer-events:auto}

/* role switcher */
.role-tab{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:transparent;color:#13385d;font:600 15px Geologica,sans-serif;cursor:pointer;transition:background-color .2s ease,color .2s ease}
.role-tab:hover{background:#c3ccd6}
.role-tab[aria-selected="true"]{background:#13385d;color:#ffffff}
.role-body{animation:fadeUp 350ms cubic-bezier(.16,1,.3,1) both}

/* catalog rail */
.rail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:32px;padding:4px 32px 24px;margin:0 -32px;scrollbar-width:thin;scrollbar-color:#13385d #e6eaeb}
.tile{flex:0 0 280px;scroll-snap-align:start;text-decoration:none;color:#13385d;display:flex;flex-direction:column;gap:16px}
.tile-img{border-radius:12px;overflow:hidden;background:#e6eaeb;aspect-ratio:4/5}
.tile-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.23,1,.32,1)}
.tile-name{font-size:20px;font-weight:600;line-height:1.25;transition:color .15s ease}
@media (hover:hover) and (pointer:fine){.tile:hover .tile-img img{transform:scale(1.05)}.tile:hover .tile-name{color:#b8031f}}

/* key figures: number size follows column width, so any length fits on one line */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px 48px;align-items:start}
.stat{container-type:inline-size;min-width:0}
.stat-num{font-size:clamp(44px,18cqi,104px);font-weight:700;line-height:1;color:#13385d;letter-spacing:-0.035em;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat-iso{min-height:clamp(44px,18cqi,104px);display:flex;flex-wrap:wrap;gap:8px;align-content:center}
.stat-cap{margin-top:14px;font-size:18px;line-height:1.4;color:#21272e;max-width:24ch;text-wrap:balance}
@media (max-width:1000px){.ruler-years{display:none}}
/* ruler */
.ruler{display:flex;align-items:flex-end;justify-content:space-between;height:120px;border-bottom:2px solid #13385d}
.tick{width:2px;background:#8699b0;height:28px;transform-origin:bottom}
.tick.major{background:#13385d;height:56px}
.tick.mile{background:#e30427;height:104px;width:3px}
.mile-card{padding-top:20px}

/* gallery */
.thumb{padding:0;border:0;border-radius:8px;overflow:hidden;aspect-ratio:1/1;cursor:pointer;background:#e6eaeb;outline:2px solid transparent;outline-offset:2px;transition:outline-color .2s ease,opacity .2s ease}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current="true"]{outline-color:#e30427}

.logo-slot{height:104px;transition:transform .2s cubic-bezier(.23,1,.32,1);border-radius:12px;background:#ffffff;display:flex;align-items:center;justify-content:center;color:#59636e;font-size:13px}

/* news */
.tab{min-height:44px;padding:0 20px;border:0;border-radius:999px;font:600 15px Geologica,sans-serif;cursor:pointer;transition:background-color .2s ease,color .2s ease}
.news-body{animation:fadeUp 350ms cubic-bezier(.16,1,.3,1) both}
.post{text-decoration:none;color:inherit;display:flex;flex-direction:column}
.post-img{border-radius:12px;overflow:hidden;background:#e6eaeb}
.post-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.23,1,.32,1)}
@media (hover:hover) and (pointer:fine){.post:hover .post-img img{transform:scale(1.04)}.post:hover .post-title{color:#b8031f}}
.post-title{transition:color .15s ease}

.foot a{color:#c3ccd6;text-decoration:none;font-size:15px;transition:color .15s ease}.foot a:hover{color:#ffffff}

/* scroll-driven: images reveal, ruler ticks grow, CTA mark turns */
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline: view()){
    .reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
    @keyframes reveal{from{clip-path:inset(14% 0 0 0 round 12px);transform:scale(1.06)}to{clip-path:inset(0 0 0 0 round 12px);transform:none}}
    .tick{animation:grow linear both;animation-timeline:view();animation-range:entry 20% cover 45%}
    @keyframes grow{from{transform:scaleY(.15)}}
    .mark{animation:turn linear both;animation-timeline:view();animation-range:entry 0% exit 100%}
    @keyframes turn{from{transform:rotate(-14deg) scale(.9)}to{transform:rotate(10deg) scale(1.04)}}
  }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition-duration:.01ms !important}
  .hs-card{transition:opacity .2s ease !important}
}
</style>
<style>
/* ===== v3: кольоровий ритм, масштаб, глибина ===== */
@property --d1{syntax:'<integer>';inherits:false;initial-value:0}
@property --d2{syntax:'<integer>';inherits:false;initial-value:0}
.btn{min-height:56px;padding:0 28px;border-radius:999px;gap:14px;font-size:17px}
.btn:has(.arr){padding-right:8px}
.arr{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(255,255,255,.2);transition:background-color .2s ease,color .2s ease}
.arr svg{transition:transform .25s cubic-bezier(.23,1,.32,1)}
.btn-line .arr{background:#dbe3eb}
.btn-white{background:#ffffff;color:#13385d}.btn-white .arr{background:#e30427;color:#ffffff}
.btn-white:hover{background:#13385d;color:#ffffff}
.btn-ghost{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8);color:#ffffff;background:transparent}.btn-ghost:hover{background:#ffffff;color:#b8031f}
@media (hover:hover) and (pointer:fine){.btn:hover .arr svg{transform:translateX(3px)}.btn-red:hover .arr{background:#ffffff;color:#b8031f}.btn-line:hover .arr{background:#ffffff;color:#13385d}}
.h2x{margin:0;font-size:clamp(40px,5.2vw,76px);line-height:.98;font-weight:700;color:#13385d;letter-spacing:-0.035em;text-wrap:balance}
.lead{font-size:clamp(18px,1.5vw,21px);line-height:1.5;color:#21272e}

/* hero */
.hero3{position:relative;overflow:hidden;background:radial-gradient(60% 70% at 74% 46%,#ffffff 0%,rgba(255,255,255,0) 70%),linear-gradient(180deg,#f3f6f9 0%,#dbe3eb 100%)}
.net{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.net .ln{fill:none;stroke:#13385d;stroke-opacity:.09;stroke-width:1.5}
.net .nd{fill:#13385d;fill-opacity:.16}
.net .pulse{fill:none;stroke:#007ac2;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:3 97;stroke-dashoffset:100;opacity:.75}
.hero3-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:0;align-items:center;min-height:780px;padding-top:24px;padding-bottom:40px}
.h1x{margin:0;font-size:clamp(40px,12cqi,92px);line-height:.94;font-weight:700;color:#13385d;letter-spacing:-0.04em;position:relative;z-index:2}
.h1x .red{color:#e30427}
.hero3-text{position:relative;z-index:2;padding-bottom:24px;container-type:inline-size}
.h1x .line>span{white-space:nowrap}
.stage3{position:relative;height:780px;display:flex;align-items:center;justify-content:center;perspective:1400px}
.stage3::before{content:"";position:absolute;left:50%;top:48%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.5) 35%,rgba(255,255,255,0) 66%);pointer-events:none}
.floor{position:absolute;left:50%;bottom:34px;width:78%;height:46px;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(19,56,93,.32),rgba(19,56,93,0));filter:blur(6px)}
.dev{position:relative;width:560px;aspect-ratio:894/1100;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.23,1,.32,1);animation:devIn 1200ms cubic-bezier(.16,1,.3,1) 120ms both}
@keyframes devIn{from{opacity:0;transform:translateY(40px) rotateX(8deg)}}
.dev img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 40px 40px rgba(19,56,93,.22)) drop-shadow(0 8px 10px rgba(19,56,93,.12))}
.dev .shine{position:absolute;inset:6% 2% 0 2%;border-radius:4% 4% 8% 8%;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 60%);background-size:250% 100%;mix-blend-mode:soft-light;animation:shine 7s cubic-bezier(.45,0,.55,1) 1.4s infinite;pointer-events:none}
@keyframes shine{0%{background-position:120% 0}40%,100%{background-position:-60% 0}}
.led{position:absolute;left:34.4%;top:29.6%;width:2.6%;height:1.8%;border-radius:2px;background:#9dff7a;box-shadow:0 0 10px 3px rgba(120,255,90,.75);animation:led 1.15s steps(1) infinite}
@keyframes led{0%,12%{opacity:1}13%,100%{opacity:.15}}
.chip{position:absolute;z-index:3;display:flex;flex-direction:column;gap:4px;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.86);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 18px 40px rgba(19,56,93,.16),0 0 0 1px rgba(19,56,93,.06);animation:fadeUp 700ms cubic-bezier(.16,1,.3,1) both;white-space:nowrap}
.chip-k{font-size:14px;color:#59636e;display:flex;align-items:center;gap:8px}
.chip-v{font-size:24px;font-weight:700;color:#13385d;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.chip-v small{font-size:15px;font-weight:600;color:#59636e;margin-left:4px}
.chip::after{content:"";position:absolute;width:var(--lw,60px);height:1.5px;background:#13385d;opacity:.35;top:50%}
.chip.nolead::after{display:none}
.chip.to-r::after{left:100%}
.chip.to-l::after{right:100%}
.chip .pin{position:absolute;top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#e30427;box-shadow:0 0 0 4px rgba(227,4,39,.18)}
.chip.to-r .pin{left:calc(100% + var(--lw,60px) - 5px)}
.chip.to-l .pin{right:calc(100% + var(--lw,60px) - 5px)}
.cnt{display:inline-block}
.cnt .d2{counter-reset:d2 var(--d2);animation:dig 100s steps(10,jump-none) infinite}
.cnt .d1{counter-reset:d1 var(--d1);animation:dig1 10s steps(10,jump-none) infinite}
.cnt .d2::after{content:counter(d2)}.cnt .d1::after{content:counter(d1)}
@keyframes dig{from{--d2:0}to{--d2:9}}
@keyframes dig1{from{--d1:0}to{--d1:9}}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:3px;background:#00a86b;border-radius:1px;animation:bar 1.6s ease-in-out infinite}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px;animation-delay:.15s}.bars i:nth-child(3){height:12px;animation-delay:.3s}
@keyframes bar{0%,100%{opacity:1}50%{opacity:.3}}
.live{width:8px;height:8px;border-radius:50%;background:#00a86b;box-shadow:0 0 0 0 rgba(0,168,107,.5);animation:live 2s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(0,168,107,.5)}80%,100%{box-shadow:0 0 0 8px rgba(0,168,107,0)}}
.hero3-facts{display:flex;gap:40px;margin-top:48px;flex-wrap:wrap}
.hero3-facts b{display:block;font-size:40px;line-height:1;color:#13385d;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.hero3-facts span{display:block;margin-top:8px;font-size:16px;color:#59636e}

/* roles */
.roles3{padding:120px 0 120px;background:#ffffff}
.roles3-h{display:flex;align-items:baseline;gap:.25em;flex-wrap:wrap;margin:0;font-size:clamp(40px,6vw,88px);line-height:1;font-weight:700;color:#13385d;letter-spacing:-0.04em}
.roles3-h .w{color:#e30427;animation:fadeUp 450ms cubic-bezier(.16,1,.3,1) both}
.rcards{display:flex;gap:12px;height:520px;margin-top:48px}
.rcard{position:relative;flex:1 1 0;min-width:0;border:0;padding:0;border-radius:24px;overflow:hidden;cursor:pointer;text-align:left;background:#13385d;font-family:inherit;transition:flex-grow .6s cubic-bezier(.23,1,.32,1)}
.rcard[aria-expanded="true"]{flex-grow:1.9;cursor:default}
.rcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.23,1,.32,1)}
.rcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,56,93,0) 30%,rgba(19,56,93,.9) 100%)}
.rcard[aria-expanded="false"]::after{background:linear-gradient(180deg,rgba(19,56,93,.25) 0%,rgba(19,56,93,.88) 100%)}
.rcard-in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:28px 24px;color:#ffffff}
.rcard-l{font-size:clamp(18px,1.55vw,22px);font-weight:700;line-height:1.15;letter-spacing:-0.01em}
.rcard-t{margin-top:12px;font-size:18px;line-height:1.5;color:#e6eaeb;max-width:34ch}
.rcard-b{margin-top:22px}
.rcard-more{animation:fadeUp 500ms cubic-bezier(.16,1,.3,1) 150ms both}
@media (hover:hover) and (pointer:fine){.rcard:hover img{transform:scale(1.05)}}

/* bento */
.bento-sec{background:#e6eaeb;padding:120px 0}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:300px;gap:16px;margin-top:48px}
.cell{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:24px;border-radius:24px;background:radial-gradient(80% 70% at 50% 45%,#ffffff 0%,#f4f7f9 100%);text-decoration:none;color:#13385d;overflow:hidden;isolation:isolate;transition:box-shadow .3s ease,transform .3s cubic-bezier(.23,1,.32,1)}
.cell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--acc);transition:height .3s cubic-bezier(.23,1,.32,1)}
.cell-tag{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#59636e}
.cell-tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc)}
.cell-img{position:absolute;left:50%;top:50%;width:var(--w,58%);height:auto;max-height:66%;object-fit:contain;transform:translate(-50%,-52%);transition:transform .5s cubic-bezier(.23,1,.32,1);z-index:-1;filter:drop-shadow(0 22px 22px rgba(19,56,93,.18))}
.cell-img.flat{mix-blend-mode:multiply;filter:none}
.cell-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cell-name{font-size:clamp(18px,1.55vw,22px);font-weight:700;line-height:1.15;letter-spacing:-0.01em;max-width:14ch}
.cell-go{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e6eaeb;color:#13385d;transition:background-color .2s ease,color .2s ease,transform .3s cubic-bezier(.23,1,.32,1)}
.cell-big{grid-column:span 2;grid-row:span 2;padding:36px}
.cell-big .cell-name{font-size:40px;max-width:12ch}
.cell-big .trio{position:absolute;left:4%;right:4%;top:15%;bottom:20%;z-index:-1;display:flex;align-items:flex-end;justify-content:center;gap:0}
.cell-big .trio img{height:88%;width:auto;filter:drop-shadow(0 30px 30px rgba(19,56,93,.2));transition:transform .6s cubic-bezier(.23,1,.32,1)}
.cell-big .trio img:nth-child(1){height:74%;transform:translateX(14%) rotate(-4deg)}
.cell-big .trio img:nth-child(2){position:relative;z-index:1}
.cell-big .trio img:nth-child(3){height:74%;transform:translateX(-14%) rotate(4deg)}
.cell-wide{grid-column:span 2}
@media (hover:hover) and (pointer:fine){
  .cell:hover{box-shadow:0 24px 48px rgba(19,56,93,.14);transform:translateY(-4px)}
  .cell:hover::after{height:8px}
  .cell:hover .cell-img{transform:translate(-50%,-56%) scale(1.06) rotate(-2deg)}
  .cell:hover .cell-go{background:#e30427;color:#ffffff;transform:rotate(-45deg)}
  .cell-big:hover .trio img:nth-child(1){transform:translateX(4%) rotate(-7deg)}
  .cell-big:hover .trio img:nth-child(3){transform:translateX(-4%) rotate(7deg)}
  .cell-big:hover .trio img:nth-child(2){transform:translateY(-10px)}
}

/* own production */
.own{padding:120px 0}
.own-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:64px;align-items:end}
.own-mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:260px 260px;gap:16px;margin-top:64px}
.own-mosaic div{border-radius:24px;overflow:hidden;background:#e6eaeb}
.own-mosaic div:first-child{grid-row:span 2}
.own-mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.own-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:64px}
.own-3 b{display:block;font-size:28px;line-height:1.15;color:#13385d;letter-spacing:-0.015em}
.own-3 span{display:block;margin-top:10px;font-size:18px;line-height:1.5;color:#21272e}
.own-3 div{border-top:3px solid #13385d;padding-top:20px}
.own-3 div:first-child{border-color:#e30427}

/* system */
.sys{background:#13385d;color:#ffffff;padding:120px 0;position:relative;overflow:hidden}
.sys::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(70% 80% at 50% 50%,#000,transparent)}
.flow{position:relative;display:flex;align-items:flex-start;margin-top:72px}
.node{flex:0 0 200px;display:flex;flex-direction:column;align-items:center;text-align:center}
.node-v{position:relative;width:200px;height:220px;display:grid;place-items:center}
.node-v::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(0,122,194,.45),rgba(0,122,194,0) 65%)}
.node-v img{position:relative;max-width:100%;max-height:100%;filter:drop-shadow(0 18px 24px rgba(0,0,0,.25))}
.node-t{margin-top:20px;font-size:22px;font-weight:700}
.node-d{margin-top:8px;font-size:17px;line-height:1.45;color:#c9d6e3;max-width:22ch}
.conn{position:relative;flex:1 1 auto;height:220px;min-width:40px}
.conn-l{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.22)}
.conn-k{position:absolute;left:-20px;right:-20px;top:calc(50% - 36px);text-align:center;white-space:nowrap;font-size:14px;font-weight:600;color:#c9d6e3}
.conn-l i{position:absolute;top:-4px;left:0;width:10px;height:10px;border-radius:50%;background:#7fd0ff;box-shadow:0 0 12px 3px rgba(127,208,255,.7);animation:flowX 2.4s linear infinite}
.conn-l i:nth-child(2){animation-delay:.8s}.conn-l i:nth-child(3){animation-delay:1.6s}
@keyframes flowX{from{left:0;opacity:0}10%{opacity:1}90%{opacity:1}to{left:calc(100% - 10px);opacity:0}}
.srv{width:150px;display:flex;flex-direction:column;gap:8px}
.srv span{height:40px;border-radius:8px;background:linear-gradient(180deg,#2a5a8a,#1d4670);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);display:flex;align-items:center;gap:6px;padding:0 12px}
.srv em{width:6px;height:6px;border-radius:50%;background:#7fd0ff;animation:bar 1.4s ease-in-out infinite}
.srv span:nth-child(2) em{animation-delay:.3s}.srv span:nth-child(3) em{animation-delay:.6s}
.srv b{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-left:8px}
.dash{width:190px;border-radius:14px;background:#ffffff;padding:14px;box-shadow:0 20px 40px rgba(0,0,0,.25);text-align:left}
.dash-k{font-size:12px;color:#59636e}.dash-v{font-size:20px;font-weight:700;color:#13385d;font-variant-numeric:tabular-nums}
.dash-bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:10px}
.dash-bars i{flex:1;border-radius:3px 3px 0 0;background:#c3ccd6;transform-origin:bottom;animation:grow2 2.8s cubic-bezier(.16,1,.3,1) infinite alternate}
.dash-bars i:last-child{background:#e30427}
@keyframes grow2{from{transform:scaleY(.55)}}

/* history */
.hist{background:#e9eef3;padding:120px 0;timeline-scope:--hist}
.hrail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:max(32px,calc((100% - 1216px)/2));padding:0 max(32px,calc((100% - 1216px)/2)) 8px;scrollbar-width:none;scroll-timeline:--hist inline;margin-top:48px}
.hrail::-webkit-scrollbar{display:none}
.ep{flex:0 0 440px;scroll-snap-align:start;background:#ffffff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.ep-img{aspect-ratio:16/10;overflow:hidden;background:#dbe3eb}
.ep-img img{width:100%;height:100%;object-fit:cover;display:block}
.ep-b{padding:28px 32px 36px;position:relative}
.ep-y{font-size:96px;line-height:.85;font-weight:700;letter-spacing:-0.05em;color:#13385d;font-variant-numeric:tabular-nums;margin-top:-76px;text-shadow:0 2px 0 #ffffff}
.ep-y span{color:#e30427}
.ep-t{margin-top:18px;font-size:24px;font-weight:700;line-height:1.2;color:#13385d}
.ep-d{margin-top:10px;font-size:18px;line-height:1.5;color:#21272e}
.hbar{height:3px;background:#c3ccd6;border-radius:2px;margin-top:40px;overflow:hidden}
.hbar i{display:block;height:100%;background:#e30427;transform-origin:left}
@supports (animation-timeline: --a){.hbar i{animation:hb linear both;animation-timeline:--hist}}
@keyframes hb{from{transform:scaleX(.18)}to{transform:scaleX(1)}}

/* video v3 */
.vplay{position:relative}
.vplay::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:ping 2.6s cubic-bezier(.16,1,.3,1) infinite}

@media (prefers-reduced-motion:no-preference){@supports (animation-timeline: view()){
  .ep{animation:epIn linear both;animation-timeline:view(inline);animation-range:entry 0% cover 40%}
  @keyframes epIn{from{opacity:.4;transform:scale(.94)}}
  .cell{animation:cellIn linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
  @keyframes cellIn{from{opacity:0;transform:translateY(40px)}}
  .dev-wrap{animation:float linear both;animation-timeline:scroll(root);animation-range:0 900px}
  @keyframes float{to{transform:translateY(80px) rotate(-3deg)}}
}}
@media (prefers-reduced-motion:reduce){
  .dev,.chip,.cell,.ep,.rcard-more,.roles3-h .w{animation:none !important}
}


.news3{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;margin-top:48px;align-items:stretch}
.news3-lead{background:#ffffff;border-radius:24px;overflow:hidden}
.news3-lead .post-img{aspect-ratio:16/9;border-radius:0}
.news3-list{display:flex;flex-direction:column;gap:16px}
.news3-row{flex-direction:row;gap:20px;align-items:center;background:#ffffff;border-radius:20px;padding:12px 24px 12px 12px}
.news3-row .post-img{flex:0 0 150px;height:112px;border-radius:12px}
@media (max-width:900px){.news3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.news3-row{padding:10px}.news3-row .post-img{flex-basis:96px;height:80px}.news3-lead .post-title{font-size:24px !important}.cta3{grid-template-columns:minmax(0,1fr) !important;padding-top:72px !important;padding-bottom:72px !important}.cta3 .mark{max-width:160px !important;justify-self:start !important}}

/* responsive */
@media (max-width:1100px){
  .hero3-grid{grid-template-columns:minmax(0,1fr) 420px}
  .dev{width:420px}.stage3{height:620px}
  .flow{flex-wrap:wrap;justify-content:center;gap:24px}
}
@media (max-width:900px){
  .hero3-grid{grid-template-columns:minmax(0,1fr);min-height:0;padding-top:40px}
  .stage3{height:auto;padding:40px 0 60px}
  .dev{width:min(78vw,420px)}
  .chip::after,.chip .pin{display:none}
  .chip.to-r{right:auto !important;left:-4% !important;top:4% !important}
  .conn{margin:16px 0}
  .rcards{flex-direction:column;height:auto}
  .rcard{flex:0 0 96px;transition:flex-basis .5s cubic-bezier(.23,1,.32,1)}
  .rcard[aria-expanded="true"]{flex:0 0 400px}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:230px}
  .cell-big{grid-column:span 2;grid-row:span 2}
  .cell-wide{grid-column:span 2}
  .own-grid{grid-template-columns:minmax(0,1fr);gap:24px}
  .own-mosaic{grid-template-columns:1fr 1fr;grid-template-rows:240px 160px 160px}
  .own-mosaic div:first-child{grid-column:span 2;grid-row:auto}
  .own-3{grid-template-columns:minmax(0,1fr);gap:28px}
  .flow{flex-direction:column;align-items:center;gap:0}
  .conn{flex:0 0 96px;width:2px;min-width:0;height:96px}
  .conn-l{left:50%;right:auto;top:0;bottom:0;width:2px;height:auto}
  .conn-l i{left:-4px;animation-name:flowY}
  @keyframes flowY{from{top:0;opacity:0}10%{opacity:1}90%{opacity:1}to{top:calc(100% - 10px);opacity:0}}
  .conn-k{left:calc(50% + 18px);right:auto;top:calc(50% - 10px);text-align:left;white-space:nowrap}
  .ep{flex-basis:300px}.ep-y{font-size:72px;margin-top:-58px}
  .foot .wrap{grid-template-columns:1fr 1fr !important}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .wrap.hero3-grid{padding-top:32px;padding-bottom:8px}
  .stage3{padding:24px 0 48px}
  .roles3,.bento-sec,.own,.sys,.hist{padding:72px 0}
  .hero3-facts{gap:24px}.hero3-facts b{font-size:32px}
  .chip{padding:10px 12px;border-radius:12px}.chip-v{font-size:18px}.chip-k{font-size:13px}
  .chip.hide-s{display:none}
  .bento{gap:10px;grid-auto-rows:200px}
  .cell{padding:16px;border-radius:18px}.cell-big{padding:20px}
  .cell-name{font-size:18px}.cell-big .cell-name{font-size:28px}
  .cell-tag{font-size:13px}.cell-go{width:36px;height:36px}
  .cell:not(.cell-big) .cell-go{display:none}
  .logos3{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:0 16px !important}.logos3 .logo-slot{height:64px !important}
  .video3{height:540px !important}.video3 .wrap{padding-bottom:48px !important}.vplay{width:88px !important;height:88px !important}
  .rcard-in{padding:20px}.rcard-l{font-size:22px}
  .own-mosaic{margin-top:40px}
  .hrail{padding:0 16px 8px;scroll-padding-left:16px}
  .ep{flex-basis:84%}
  .foot .wrap{grid-template-columns:1fr !important}
  .lang3{display:none !important}
}
</style>

<body>

<div style="font-family: Geologica, sans-serif; color: #21272e; background: #ffffff; overflow-x: hidden">

<sc-if value="{{n1}}" hint-placeholder-val="{{true}}">
<section id="main" class="hero3">
  <svg class="net" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path class="ln" d="M-20 640 L220 560 L420 610 L640 520 L880 590 L1120 500 L1460 560"></path>
    <path class="ln" d="M-20 300 L160 250 L330 330 L520 270"></path>
    <path class="ln" d="M220 560 L330 330 M640 520 L520 270 M1120 500 L1240 300 L1460 260"></path>
    <path class="ln" d="M60 760 L220 560 M880 590 L980 760"></path>
    <path class="pulse" pathLength="100" d="M-20 640 L220 560 L420 610 L640 520 L880 590 L1120 500 L1460 560" style="animation: pulseRun 7s linear infinite"></path>
    <path class="pulse" pathLength="100" d="M-20 300 L160 250 L330 330 L520 270" style="animation: pulseRun 5s linear 1.5s infinite"></path>
    <path class="pulse" pathLength="100" d="M1120 500 L1240 300 L1460 260" style="animation: pulseRun 4s linear .6s infinite"></path>
    <g class="nd"><circle cx="220" cy="560" r="5"></circle><circle cx="420" cy="610" r="4"></circle><circle cx="640" cy="520" r="5"></circle><circle cx="880" cy="590" r="4"></circle><circle cx="1120" cy="500" r="5"></circle><circle cx="160" cy="250" r="4"></circle><circle cx="330" cy="330" r="5"></circle><circle cx="520" cy="270" r="4"></circle><circle cx="1240" cy="300" r="4"></circle></g>

        </sc-for>
      </div>
      </div>
      <sc-for list="{{roleActive}}" as="a" hint-placeholder-count="1">
