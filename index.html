<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лічильники електроенергії, води й тепла — НІК-ЕЛЕКТРОНІКА</title>
<meta name="robots" content="noindex">

<style>
@font-face{font-family:'Geologica';font-style:normal;font-weight:300 800;font-display:swap;src:url(assets/58ce8622-Geologica-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Geologica';font-style:normal;font-weight:300 800;font-display:swap;src:url(assets/129ad3ba-Geologica-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<style>
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
:root{--ink:#13385d;--text:#21272e;--muted:#59636e;--line:#d6dde5;--gray:#e6eaeb;--paper:#f4f6f8;--red:#e30427;--red-h:#b8031f;--ease:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.23,1,.32,1)}
body{margin:0;background:#ffffff}
::selection{background:var(--ink);color:#ffffff}
a{color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid #007ac2;outline-offset:3px}
.skip{position:absolute;left:16px;top:-80px;z-index:100;background:var(--ink);color:#ffffff;padding:12px 16px;border-radius:8px;text-decoration:none;font-weight:600}.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 26px;border-radius:999px;border:0;font:600 16px Geologica,sans-serif;text-decoration:none;cursor:pointer;box-sizing:border-box;transition:background-color .2s ease,color .2s ease,box-shadow .2s ease,transform .16s var(--out)}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:#ffffff}.btn-ink:hover{background:#0f2d4b}
.btn-red{background:var(--red);color:#ffffff}.btn-red:hover{background:var(--red-h)}
.btn-line{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);background:transparent}.btn-line:hover{background:var(--ink);color:#ffffff}
.btn-white{background:#ffffff;color:var(--ink)}.btn-white:hover{background:var(--ink);color:#ffffff}
.btn svg{transition:transform .25s var(--out)}
@media (hover:hover) and (pointer:fine){.btn:hover svg{transform:translateX(3px)}}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;transition:background-color .2s ease}
.icon:hover{background:var(--gray)}

/* header */
.hd{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:36px;height:80px}
.menu{display:flex;gap:4px;flex:1 1 auto;margin:0;padding:0;list-style:none}
.menu>li{position:relative}
.menu>li>a{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;text-decoration:none;font-size:16px;font-weight:500;color:var(--ink);transition:background-color .2s ease}
.menu>li>a svg{transition:transform .25s var(--out)}
.menu>li:hover>a,.menu>li:focus-within>a{background:var(--gray)}
.menu>li:hover>a svg,.menu>li:focus-within>a svg{transform:rotate(180deg)}
.drop{position:absolute;left:0;top:calc(100% + 10px);min-width:280px;padding:10px;background:#ffffff;border-radius:16px;box-shadow:0 24px 48px rgba(19,56,93,.16),0 0 0 1px rgba(19,56,93,.06);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease,transform .25s var(--out)}
.drop::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
.menu>li:hover .drop,.menu>li:focus-within .drop{opacity:1;transform:none;pointer-events:auto}
.drop a{display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;text-decoration:none;font-size:16px;color:var(--text)}
.drop a:hover{background:var(--paper);color:var(--ink)}
.docs{min-height:44px;padding:0 18px;font-size:15px}
.lang{display:flex;font-size:14px;font-weight:600}
.lang a{padding:12px 6px;text-decoration:none;color:var(--muted)}
.lang a[aria-current]{color:var(--red)}
.burger{display:none}
.mnav{display:none}
@media (max-width:900px){
  .mnav{display:block;position:fixed;left:0;right:0;top:81px;bottom:0;z-index:29;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#ffffff;padding:8px 16px 40px;box-sizing:border-box;animation:mIn .35s var(--ease) both}
  @keyframes mIn{from{opacity:0;transform:translateY(-12px)}}
  .mnav .grp{padding:20px 0;border-bottom:1px solid var(--line)}
  .mnav .grp>a{display:flex;justify-content:space-between;align-items:center;min-height:48px;font-size:28px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);text-decoration:none}
  .mnav .sub{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:6px}
  .mnav .sub a{display:flex;align-items:center;min-height:44px;font-size:16px;color:var(--text);text-decoration:none}
  .mnav .foot{display:flex;flex-direction:column;gap:16px;padding-top:24px}
  .mnav .lang{display:flex;font-size:16px}
}

/* hero slider */
.hero{padding:16px 16px 0}
.frame{position:relative;height:clamp(600px,calc(100vh - 112px),800px);border-radius:28px;overflow:hidden;background:var(--ink);isolation:isolate}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s var(--ease)}
.slide.on{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 7s linear}
.slide.on img{transform:scale(1)}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(10,32,56,.88) 0%,rgba(19,56,93,.62) 42%,rgba(19,56,93,.08) 78%),linear-gradient(0deg,rgba(10,32,56,.65) 0%,rgba(10,32,56,0) 45%)}
.hgrid{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px calc(100% / 12));background-position:0 0}
.caps{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 56px 56px;display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:64px;align-items:end;color:#ffffff}
.capwrap{position:relative;min-height:340px}
.cap{position:absolute;left:0;right:0;bottom:0;opacity:0;transform:translateY(28px);transition:opacity .5s ease,transform .7s var(--out);pointer-events:none}
.cap.on{opacity:1;transform:none;transition-delay:.35s,.35s;pointer-events:auto}
.cap h1,.cap h2{margin:0;font-size:clamp(40px,5vw,76px);line-height:.98;font-weight:700;letter-spacing:-0.035em;text-wrap:balance;max-width:18ch}
.cap p{margin:28px 0 0;font-size:clamp(17px,1.4vw,20px);line-height:1.55;color:rgba(255,255,255,.88);max-width:52ch}
.idx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.idx button{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:baseline;padding:14px 0 16px;border:0;background:transparent;color:rgba(255,255,255,.62);font:500 16px Geologica,sans-serif;text-align:left;cursor:pointer;position:relative;transition:color .25s ease}
.idx button:hover{color:#ffffff}
.idx button[aria-current="true"]{color:#ffffff}
.idx .no{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.idx .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.22);overflow:hidden}
.idx .bar i{display:block;height:100%;width:100%;background:#ffffff;transform-origin:left;transform:scaleX(0)}
.idx button[aria-current="true"] .bar i{animation:prog 6.5s linear both}
.frame:hover .idx button[aria-current="true"] .bar i{animation-play-state:paused}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.arrows{position:absolute;right:56px;top:40px;z-index:3;display:flex;gap:8px}
.arrows button{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#ffffff;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);transition:background-color .2s ease,transform .16s var(--out)}
.arrows button:hover{background:rgba(255,255,255,.28)}
.arrows button:active{transform:scale(.94)}
.count{position:absolute;left:56px;top:44px;z-index:3;color:#ffffff;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.count b{font-size:15px}

/* section scaffolding */
.sec{padding:120px 0}
.rule{height:10px;border-top:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100% / 12)) top left/100% 10px no-repeat}
.shead{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:end;margin-top:40px}
.h2{margin:0;font-size:clamp(40px,4.6vw,72px);line-height:.95;font-weight:700;color:var(--ink);letter-spacing:-0.045em}
.lead{margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.55;color:var(--text);max-width:46ch}
.side{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.round{width:56px;height:56px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent;color:var(--ink);transition:background-color .2s ease,color .2s ease,transform .16s var(--out)}
.round:hover{background:var(--ink);color:#ffffff}
.round:active{transform:scale(.94)}

/* catalog track */
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:56px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.track::-webkit-scrollbar{display:none}
.cat{flex:0 0 25%;box-sizing:border-box;scroll-snap-align:start;position:relative;height:460px;padding:28px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--ink);overflow:hidden;isolation:isolate;transition:background-color .3s ease}
.cat:first-child{border-left:1px solid var(--line)}
.cat-n{font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cat-t{font-size:26px;line-height:1.12;font-weight:700;letter-spacing:-0.02em;max-width:11ch}
.cat-img{position:absolute;left:50%;top:54%;width:62%;height:52%;object-fit:contain;transform:translate(-50%,-50%);z-index:-1;transition:transform .6s var(--out)}
.cat-img.cut{filter:drop-shadow(0 24px 24px rgba(19,56,93,.18))}
.cat-img.flat{mix-blend-mode:multiply}
.cat.photo{color:#ffffff}
.cat.photo .cat-n{color:rgba(255,255,255,.8)}
.cat.photo .cat-img{inset:0;left:0;top:0;width:100%;height:100%;object-fit:cover;transform:none;z-index:-2}
.cat.photo::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(19,56,93,.15) 0%,rgba(10,32,56,.82) 100%)}
.cat-go{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--gray);color:var(--ink);transition:background-color .25s ease,color .25s ease,transform .35s var(--out)}
.cat.photo .cat-go{background:rgba(255,255,255,.2);color:#ffffff}
@media (hover:hover) and (pointer:fine){
  .cat:not(.photo):hover{background:var(--paper)}
  .cat:not(.photo):hover .cat-img{transform:translate(-50%,-54%) scale(1.05)}
  .cat.photo:hover .cat-img{transform:scale(1.05)}
  .cat:hover .cat-go{background:var(--red);color:#ffffff;transform:rotate(-45deg)}
}

/* about */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start;margin-top:56px}
.about p{margin:0;font-size:clamp(19px,1.6vw,23px);line-height:1.5;color:var(--text)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:240px 240px 200px;gap:12px}
.gal figure{margin:0;border-radius:16px;overflow:hidden;background:var(--gray);position:relative}
.gal figure:nth-child(1){grid-column:span 2;grid-row:span 2}
.gal figure:nth-child(4){grid-column:span 1}
.gal figure:nth-child(5){grid-column:span 2}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;left:12px;bottom:12px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.9);font-size:14px;font-weight:600;color:var(--ink)}

/* figures */
.figs{background:var(--ink);color:#ffffff}
.figs .rule{border-color:rgba(255,255,255,.18);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,transparent 1px calc(100% / 12))}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:40px;border-top:1px solid rgba(255,255,255,.18)}
.fig{container-type:inline-size;min-width:0;padding:28px 32px 32px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.fig+.fig{padding-left:32px;border-left:1px solid rgba(255,255,255,.18)}
.fig.big{grid-column:span 3}
.fig.sm{grid-column:span 2}
.fig.sm:nth-child(3){border-left:0;padding-left:0}
.fig b{display:block;font-weight:700;line-height:.9;letter-spacing:-0.05em;white-space:nowrap;font-variant-numeric:tabular-nums}
.fig.big b{font-size:clamp(44px,14cqi,88px)}
.fig.sm b{font-size:clamp(40px,16cqi,64px)}
.fig b i{font-style:normal;counter-reset:n var(--n)}
.fig b i::before{content:counter(n)}
.fig span{display:block;margin-top:12px;font-size:18px;color:#c9d6e3}
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){
  .fig b i{animation:cnt linear both;animation-timeline:view();animation-range:entry 10% cover 45%}
  @keyframes cnt{from{--n:0}}
}}

/* video */
.vid{position:relative;margin-top:56px;aspect-ratio:16/8;border-radius:28px;overflow:hidden;background:var(--ink);display:block;width:100%;border:0;padding:0;cursor:pointer;isolation:isolate}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1s var(--out)}
.vid::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(10,32,56,.7) 0%,rgba(10,32,56,0) 55%)}
.play{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:var(--red);color:#ffffff;display:grid;place-items:center;transition:transform .3s var(--out)}
.play::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);animation:ping 2.8s cubic-bezier(.16,1,.3,1) infinite}
@keyframes ping{0%{transform:scale(.85);opacity:1}80%,100%{transform:scale(1.35);opacity:0}}
.vcap{position:absolute;left:40px;bottom:36px;color:#ffffff;font-size:20px;font-weight:600;text-align:left}
.vcap small{display:block;margin-top:6px;font-size:16px;font-weight:400;color:rgba(255,255,255,.8)}
@media (hover:hover) and (pointer:fine){.vid:hover img{transform:scale(1.03)}.vid:hover .play{transform:scale(1.06)}}

/* clients */
.cli{background:var(--paper)}
.logos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:56px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.logos div{height:132px;display:grid;place-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#ffffff;font-size:15px;font-weight:600;color:#8699b0;transition:background-color .2s ease}
.logos div:hover{background:var(--paper)}

/* news */
.news{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:56px;border-top:1px solid var(--line)}
.post{display:flex;flex-direction:column;gap:14px;padding:32px 32px 8px 0;text-decoration:none;color:var(--ink)}
.post+.post{padding-left:32px;border-left:1px solid var(--line)}
.post .pi{aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--gray)}
.post .pi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--out)}
.post .d{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.post .t{font-size:23px;line-height:1.22;font-weight:700;letter-spacing:-0.015em;transition:color .2s ease}
.post .more{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--red-h)}
@media (hover:hover) and (pointer:fine){.post:hover .pi img{transform:scale(1.05)}.post:hover .t{color:var(--red-h)}}

/* cta */
.cta{background:var(--paper);position:relative;overflow:hidden}
.shead:has(> :only-child){grid-template-columns:minmax(0,1fr)}
.cta .mark{position:absolute;right:-40px;bottom:-60px;width:420px;opacity:.05}

/* modal form */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(10,32,56,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;overflow:auto;animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.dlg{position:relative;width:min(720px,100%);max-height:calc(100vh - 48px);overflow:auto;box-sizing:border-box;background:#ffffff;border-radius:28px;padding:44px;animation:pop .4s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.98)}}
.dlg h2{margin:0;font-size:48px;line-height:1;letter-spacing:-0.04em;color:var(--ink)}
.dlg .x{position:absolute;right:20px;top:20px}
.warn{display:flex;gap:14px;margin-top:24px;padding:18px 20px;border-radius:16px;background:#fff0d9;color:#5c3d00;font-size:16px;line-height:1.5}
.warn svg{flex:0 0 22px;margin-top:2px;color:#b06d00}
.warn a{color:#5c3d00;font-weight:600}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px;margin-top:28px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld.w{grid-column:1/-1}
.fld label{font-size:15px;font-weight:600;color:var(--ink)}
.fld input,.fld select,.fld textarea{min-height:52px;border:1.5px solid #c3ccd6;border-radius:14px;padding:0 16px;font:16px Geologica,sans-serif;color:var(--text);background:#ffffff;box-sizing:border-box;width:100%;transition:border-color .2s ease,box-shadow .2s ease}
.fld textarea{min-height:120px;padding:14px 16px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px rgba(19,56,93,.12)}
.err{display:none;font-size:14px;color:var(--red-h)}
.tried .fld :invalid{border-color:var(--red)}
.tried .fld :invalid~.err{display:block}
.captcha{display:flex;align-items:center;gap:14px;min-height:74px;padding:0 18px;border-radius:14px;border:1.5px dashed #c3ccd6;color:var(--muted);font-size:15px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5;color:var(--text)}
.consent input{width:22px;height:22px;margin:0;flex:0 0 22px;accent-color:var(--ink)}
.tried .consent input:invalid~.err{display:block}
.ok{text-align:center;padding:40px 0 16px}
.ok i{width:72px;height:72px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:#cceae0;color:#006b44}

/* footer */
.ft{background:var(--ink);color:#c9d6e3}
.ft a{color:#dbe3eb;text-decoration:none;transition:color .15s ease}.ft a:hover{color:#ffffff}
.fcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.16)}
.fcols>div{padding:36px 28px 44px 0;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.5}
.fcols>div+div{padding-left:28px;border-left:1px solid rgba(255,255,255,.16)}
.fcols b{color:#ffffff;font-size:16px;margin-bottom:6px}
.fbrand{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;padding:88px 0 48px;flex-wrap:wrap}
.fbrand .w{font-size:clamp(40px,5vw,72px);font-weight:700;line-height:.95;letter-spacing:-0.04em;color:#ffffff;max-width:14ch}

/* cookie */
.cookie{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;max-width:1248px;margin:0 auto;display:flex;align-items:center;gap:24px;box-sizing:border-box;background:#ffffff;border-radius:20px;padding:16px 16px 16px 24px;box-shadow:0 24px 64px rgba(10,32,56,.22),0 0 0 1px rgba(19,56,93,.06);animation:pop .5s var(--ease) .8s both}
.cookie p{margin:0;flex:1 1 auto;font-size:15px;line-height:1.55;color:var(--text)}
.cookie .row{display:flex;gap:8px;flex:0 0 auto}
.cookie .btn{min-height:44px;padding:0 18px;font-size:15px}
.cookie .lnk{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:0 8px}

/* reveal */
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){
  .rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  @keyframes rv{from{opacity:0;transform:translateY(48px)}}
  .rule{animation:ruleIn linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  @keyframes ruleIn{from{background-size:0% 10px}}
}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition-duration:.01ms !important}.slide img{transform:none}}

/* responsive */
@media (max-width:1100px){.menu>li>a{padding:0 10px;font-size:15px}.docs{display:none}.cat{flex-basis:33.333%}}
@media (max-width:900px){
  .menu,.lang{display:none}.burger{display:inline-grid}
  .caps{grid-template-columns:minmax(0,1fr);gap:28px;padding:0 24px 28px}
  .idx{flex-direction:row;gap:8px}.idx button{grid-template-columns:1fr;padding:10px 0 12px}.idx .tt{display:none}
  .capwrap{min-height:360px}
  .arrows{right:24px;top:24px}.count{left:24px;top:30px}
  .shead,.about{grid-template-columns:minmax(0,1fr);gap:24px}
  .side{justify-content:flex-start}
  .cat{flex-basis:50%;height:380px}
  .fig.big,.fig.sm{grid-column:span 6;padding-left:0 !important;border-left:0 !important}
  .news{grid-template-columns:minmax(0,1fr)}.post,.post+.post{padding:28px 0;border-left:0;border-bottom:1px solid var(--line)}
  .logos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fcols{grid-template-columns:1fr 1fr}.fcols>div:nth-child(3){padding-left:0;border-left:0}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .hero{padding:8px 8px 0}.frame{height:640px;border-radius:22px}
  .cap h1,.cap h2{font-size:40px}.cap p{font-size:16px;margin-top:18px}
  .capwrap{min-height:330px}
  .sec{padding:80px 0}
  .h2{font-size:40px}
  .cat{flex-basis:78%;height:360px;padding:22px}.cat-t{font-size:22px}
  .gal{grid-template-columns:1fr 1fr;grid-template-rows:220px 140px 140px}
  .gal figure:nth-child(1){grid-column:span 2;grid-row:span 1}.gal figure:nth-child(5){grid-column:span 2}.gal figure:nth-child(4){display:none}
  .fig span{font-size:17px}
  .fig.big b,.fig.sm b{font-size:56px}
  .logos div{height:96px}
  .vid{aspect-ratio:4/5;border-radius:22px}.play{width:96px;height:96px;margin:-48px 0 0 -48px}.vcap{left:20px;bottom:20px;font-size:18px}
  .dlg{padding:28px 20px;border-radius:22px}.dlg h2{font-size:36px}.fgrid2{grid-template-columns:1fr}
  .fcols{grid-template-columns:1fr}.fcols>div,.fcols>div+div{padding:24px 0;border-left:0;border-bottom:1px solid rgba(255,255,255,.16)}
  .cookie{left:8px;right:8px;bottom:8px;flex-direction:column;align-items:stretch;gap:14px;padding:18px}.cookie .row{flex-wrap:wrap}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script src="runtime.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">

<div style="font-family: Geologica, sans-serif; color: #21272e; background: #ffffff; overflow-x: hidden">

<a href="#main" class="skip">Перейти до змісту</a>
<header class="hd">

    </div>
  </div>
</header>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">

      <div class="grp">
        <a href="{{m.href}}">{{m.t}}<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>

<main id="main">
<!-- 2. HERO-слайдер -->
<section class="hero" aria-roledescription="карусель" aria-label="Головне про компанію">
  <div class="frame" onMouseEnter="{{pause}}" onMouseLeave="{{resume}}">
    <sc-for list="{{slides}}" as="s" hint-placeholder-count="4">
      <div class="{{s.cls}}" aria-hidden="{{s.hidden}}"><img src="{{s.img}}" alt="{{s.alt}}"></div>
    </sc-for>
    <div class="shade" aria-hidden="true"></div>
    <div class="hgrid" aria-hidden="true"></div>
    <div class="count" aria-hidden="true"><b>{{curNo}}</b> / 04</div>
    <div class="arrows">
      <button aria-label="Попередній слайд" onClick="{{prev}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
      <button aria-label="Наступний слайд" onClick="{{next}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>
    <div class="caps">
      <div class="capwrap" aria-live="polite">
        <div class="{{c0}}"><h1>Точний облік енергоресурсів — від розробки до сервісу</h1><p>Розробляємо та виробляємо лічильники електроенергії, води й тепла та системи автоматизованого обліку (AMI) з 2005 року. Увесь цикл — від конструкторського бюро до сервісного центру — під нашим контролем.</p></div>
        <div class="{{c1}}"><h2>Повний цикл виробництва</h2><p>Власне конструкторське бюро, SMT-лінія, лиття корпусів, складання, повірка, випробування та сервіс.</p></div>
        <div class="{{c2}}"><h2>Акредитований випробувальний центр</h2><p>Акредитація НААУ за ДСТУ EN ISO/IEC 17025:2019: 28 видів випробувань лічильників і випробування ПЗ. Результати визнані в Україні та на міжнародному рівні.</p></div>
        <div class="{{c3}}"><h2>Від України до ЄС та Азії</h2><p>Лічильники NIK працюють у мережах операторів систем розподілу по всій Україні, а також у країнах ЄС, Близького Сходу та Азії.</p></div>
      </div>
      <ol class="idx" aria-label="Слайди">
        <sc-for list="{{slides}}" as="s" hint-placeholder-count="4">
          <li><button aria-current="{{s.cur}}" onClick="{{s.pick}}"><span class="no">{{s.no}}</span><span class="tt">{{s.short}}</span><span class="bar" aria-hidden="true"><i></i></span></button></li>
        </sc-for>
      </ol>
    </div>
  </div>
</section>

<!-- 3. Каталог -->
<section class="sec" aria-labelledby="h-cat">

    <div class="rule" aria-hidden="true"></div>

        <button class="round" aria-label="Наступні категорії" onClick="{{catNext}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>

      <div>
        <p>НІК-ЕЛЕКТРОНІКА — український розробник і виробник приладів обліку енергоресурсів і систем автоматизованого обліку (AMI). Працюємо з 2005 року. Ми виробляємо лічильники електроенергії, води, тепла, стабілізатори напруги та програмне забезпечення для дистанційного збору даних.</p>
