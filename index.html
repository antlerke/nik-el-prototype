<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лічильники електроенергії, води й тепла — НІК-ЕЛЕКТРОНІКА</title>
<meta name="robots" content="noindex">

<style>
@font-face{font-family:'Geologica';font-style:normal;font-weight:300 800;font-display:swap;src:url(assets/58ce8622-Geologica-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Geologica';font-style:normal;font-weight:300 800;font-display:swap;src:url(assets/129ad3ba-Geologica-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<style>
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
:root{--ink:#13385d;--ink-d:#0d2a47;--text:#21272e;--muted:#59636e;--line:#dde3e9;--gray:#e6eaeb;--paper:#f4f6f8;--red:#e30427;--red-h:#b8031f;--red-a:rgba(227,4,39,.07);--red-b:rgba(227,4,39,.16);--red-t:#c2031f;--ease:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.23,1,.32,1)}
body{margin:0;background:#ffffff}
::selection{background:var(--ink);color:#ffffff}
a{color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #007ac2;outline-offset:3px}
.skip{position:absolute;left:16px;top:-80px;z-index:100;background:var(--ink);color:#ffffff;padding:12px 16px;border-radius:8px;text-decoration:none;font-weight:600}.skip:focus{top:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 28px;border-radius:16px;border:0;font:600 16px Geologica,sans-serif;text-decoration:none;cursor:pointer;box-sizing:border-box;transition:background-color .2s ease,color .2s ease,box-shadow .25s ease,transform .16s var(--out)}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:#ffffff}.btn-ink:hover{background:var(--ink-d)}
.btn-red{background:var(--red);color:#ffffff}.btn-red:hover{background:var(--red-h);box-shadow:0 14px 30px -12px rgba(227,4,39,.55)}
.btn-line{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);background:transparent}.btn-line:hover{background:var(--ink);color:#ffffff}
.btn svg{transition:transform .25s var(--out)}
@media (hover:hover) and (pointer:fine){.btn:hover svg.go{transform:translateX(3px)}}
.icon{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;transition:background-color .2s ease}
.icon:hover{background:var(--gray)}
.kick{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--red-a);box-shadow:inset 0 0 0 1px var(--red-b);color:var(--red-t);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.kick::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.kick.on-dark{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);color:#ffffff}

/* header */
.hd{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:32px;height:80px}
.menu{display:flex;gap:4px;flex:1 1 auto;margin:0;padding:0;list-style:none}
.menu>li{position:relative}
.menu>li>a{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;text-decoration:none;font-size:16px;font-weight:500;color:var(--ink);transition:background-color .2s ease}
.menu>li>a svg{transition:transform .25s var(--out)}
.menu>li:hover>a,.menu>li:focus-within>a{background:var(--gray)}
.menu>li:hover>a svg,.menu>li:focus-within>a svg{transform:rotate(180deg)}
.drop{position:absolute;left:0;top:calc(100% + 10px);min-width:280px;padding:10px;background:#ffffff;border-radius:16px;box-shadow:0 24px 48px rgba(19,56,93,.16),0 0 0 1px rgba(19,56,93,.06);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease,transform .25s var(--out)}
.drop::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
.menu>li:hover .drop,.menu>li:focus-within .drop{opacity:1;transform:none;pointer-events:auto}
.drop a{display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;text-decoration:none;font-size:16px;color:var(--text)}
.drop a:hover{background:var(--paper);color:var(--ink)}
.docs{min-height:44px;padding:0 18px;font-size:15px;border-radius:12px}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.seg a{display:grid;place-items:center;min-width:40px;height:36px;padding:0 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;transition:background-color .2s ease,color .2s ease}
.seg a:hover{color:var(--ink)}
.seg a[aria-current]{background:var(--ink);color:#ffffff}
.burger{display:none}
.mnav{display:none}
@media (max-width:900px){
  .mnav{display:block;position:fixed;left:0;right:0;top:81px;bottom:0;z-index:29;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#ffffff;padding:8px 16px 40px;box-sizing:border-box;animation:mIn .35s var(--ease) both}
  @keyframes mIn{from{opacity:0;transform:translateY(-12px)}}
  .mnav .grp{padding:20px 0;border-bottom:1px solid var(--line)}
  .mnav .grp>a{display:flex;justify-content:space-between;align-items:center;min-height:48px;font-size:28px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);text-decoration:none}
  .mnav .sub{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:6px}
  .mnav .sub a{display:flex;align-items:center;min-height:44px;font-size:16px;color:var(--text);text-decoration:none}
  .mnav .foot{display:flex;flex-direction:column;gap:16px;padding-top:24px}
}

/* hero: product slider */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#ffffff 0%,var(--paper) 100%)}
.hgrid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:48px;align-items:center;min-height:clamp(600px,calc(100vh - 80px),760px);padding-top:40px;padding-bottom:40px;box-sizing:border-box}
.caps{display:grid;margin-top:28px}
.cap{grid-area:1/1;opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .9s var(--out);pointer-events:none}
.cap.on{opacity:1;transform:none;transition-delay:.45s,.45s;pointer-events:auto}
.cap h1,.cap h2{margin:0;font-size:clamp(40px,4.4vw,68px);line-height:1;font-weight:700;letter-spacing:-0.04em;color:var(--ink);text-wrap:balance;max-width:16ch}
.cap p{margin:24px 0 0;font-size:clamp(17px,1.35vw,19px);line-height:1.6;color:var(--muted);max-width:50ch}
.hbtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
.idx{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:620px}
.idx button{width:100%;display:flex;flex-direction:column;gap:6px;padding:0 0 14px;border:0;background:transparent;color:var(--muted);font:500 14px/1.35 Geologica,sans-serif;text-align:left;cursor:pointer;position:relative;transition:color .25s ease}
.idx button:hover,.idx button[aria-current="true"]{color:var(--ink)}
.idx .no{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.idx .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.idx .bar i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left;transform:scaleX(0)}
.idx button[aria-current="true"] .bar i{animation:prog 8s linear both}
.hero:hover .idx button[aria-current="true"] .bar i{animation-play-state:paused}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stage{position:relative;height:min(680px,72vh);min-height:520px}
.disc{position:absolute;left:50%;top:50%;width:min(600px,100%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,#ffffff 0%,#ffffff 55%,rgba(255,255,255,0) 100%),radial-gradient(closest-side,rgba(19,56,93,.10),rgba(19,56,93,0))}
.disc::before{content:"";position:absolute;inset:6%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(19,56,93,.08)}
.disc::after{content:"";position:absolute;inset:18%;border-radius:50%;box-shadow:inset 0 0 0 1px var(--red-b)}
.prod{position:absolute;left:0;right:0;top:4%;bottom:14%;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(28px) scale(.96);transition:opacity .9s ease,transform 1.4s var(--ease)}
.prod.on{opacity:1;transform:none;transition-delay:.25s,.25s}
.prod img{max-height:100%;max-width:78%;object-fit:contain;filter:drop-shadow(0 40px 36px rgba(19,56,93,.24))}
.ptag{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:16px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 40px -20px rgba(19,56,93,.4),0 0 0 1px var(--line);white-space:nowrap}
.ptag b{font-size:17px;color:var(--ink)}
.ptag span{font-size:14px;color:var(--muted)}
.ptag em{font-style:normal;padding:6px 10px;border-radius:9px;background:var(--red-a);color:var(--red-t);font-size:13px;font-weight:600}
.chip{position:absolute;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.9);box-shadow:0 14px 30px -18px rgba(19,56,93,.45),0 0 0 1px var(--line);font-size:14px;font-weight:600;color:var(--ink);opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .8s var(--out)}
.chip.on{opacity:1;transform:none;transition-delay:.9s,.9s}
.chip i{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--red-b);box-shadow:0 0 0 3px var(--red-a)}

/* sections */
.sec{padding:120px 0}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.h2{margin:16px 0 0;font-size:clamp(36px,3.6vw,56px);line-height:1.02;font-weight:700;color:var(--ink);letter-spacing:-0.04em;text-wrap:balance}
.lead{margin:0;font-size:clamp(17px,1.3vw,19px);line-height:1.6;color:var(--muted);max-width:44ch}

/* catalog cards */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:40px}
.tabs button{height:48px;padding:0 20px;border-radius:14px;border:0;background:#ffffff;box-shadow:inset 0 0 0 1.5px var(--line);font:600 15px Geologica,sans-serif;color:var(--ink);cursor:pointer;transition:background-color .2s ease,color .2s ease,box-shadow .2s ease}
.tabs button:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#ffffff;box-shadow:none}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:28px}
.card{display:flex;flex-direction:column;padding:16px;border-radius:24px;background:#ffffff;box-shadow:0 0 0 1px var(--line);text-decoration:none;color:var(--ink);transition:transform .35s var(--out),box-shadow .35s ease;animation:cin .5s var(--out) both}
@keyframes cin{from{opacity:0;transform:translateY(16px)}}
.card.wide{grid-column:span 2}
.ctop{display:flex;justify-content:space-between;align-items:center}
.tag{padding:6px 10px;border-radius:8px;background:rgba(19,56,93,.07);color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tag.r{background:var(--red-a);color:var(--red-t)}
.cno{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cimg{position:relative;margin-top:14px;height:220px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--paper) 0%,var(--gray) 100%);display:flex;align-items:center;justify-content:center}
.card.wide .cimg{height:260px}
.cimg img{max-width:72%;max-height:84%;object-fit:contain;transition:transform .6s var(--out)}
.cimg img.cut{filter:drop-shadow(0 18px 18px rgba(19,56,93,.22))}
.cimg img.flat{mix-blend-mode:multiply}
.cimg img.photo{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.ct{margin-top:18px;font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}
.cd{margin-top:8px;font-size:15px;line-height:1.5;color:var(--muted);flex:1 1 auto}
.spec{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.cd+.spec{margin-top:16px}
.spec span{color:var(--muted)}.spec b{font-weight:600;color:var(--ink);text-align:right}
.card.more{justify-content:flex-end;padding:28px;background:linear-gradient(160deg,var(--red-a),rgba(227,4,39,.02));box-shadow:inset 0 0 0 1px var(--red-b);min-height:420px}
.more .mk{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red-t)}
.more .mt{margin-top:10px;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-0.03em;max-width:12ch}
.more .md{margin-top:14px;font-size:15px;line-height:1.55;color:var(--muted);max-width:34ch}
.more .mgo{margin-top:28px;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px;border-radius:14px;background:var(--red);color:#ffffff;font-size:15px;font-weight:600;transition:background-color .2s ease}
@media (hover:hover) and (pointer:fine){.card.more:hover .mgo{background:var(--red-h)}}
.also{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:28px;font-size:15px;color:var(--muted)}
.also span{margin-right:6px}
.also a{padding:10px 16px;border-radius:999px;background:#ffffff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);text-decoration:none;font-weight:500;transition:box-shadow .2s ease}
.also a:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cgo{margin-top:18px;height:48px;border-radius:14px;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600;transition:background-color .25s ease,color .25s ease}
@media (hover:hover) and (pointer:fine){
  .card:hover{transform:translateY(-6px);box-shadow:0 28px 56px -24px rgba(19,56,93,.35),0 0 0 1.5px var(--ink)}
  .card:hover .cimg img:not(.photo){transform:scale(1.06) rotate(-2deg)}
  .card:hover .cimg img.photo{transform:scale(1.05)}
  .card:hover .cgo{background:var(--ink);color:#ffffff}
}

/* inside: hotspots on a tilting device */
.ins{background:#ffffff}
.igrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;margin-top:56px;align-items:stretch}
.ibox{position:relative;border-radius:28px;background:radial-gradient(60% 55% at 50% 45%,#ffffff 0%,var(--paper) 70%,var(--gray) 100%);box-shadow:inset 0 0 0 1px var(--line);min-height:680px;display:flex;align-items:center;justify-content:center;perspective:1400px;overflow:hidden}
.tilt{position:relative;width:min(330px,62%);transform-style:preserve-3d;transition:transform .5s var(--out)}
.tilt img{display:block;width:100%;height:auto;filter:drop-shadow(0 46px 40px rgba(19,56,93,.28))}
.ground{position:absolute;left:50%;bottom:36px;width:300px;height:26px;margin-left:-150px;border-radius:50%;background:radial-gradient(closest-side,rgba(19,56,93,.22),rgba(19,56,93,0))}
@media (hover:none){.ihint{display:none !important}}
.ihint{position:absolute;left:24px;top:22px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center;transform:translateZ(30px)}
.spot span{position:relative;width:18px;height:18px;border-radius:50%;background:#ffffff;box-shadow:0 0 0 3px var(--red),0 6px 14px rgba(19,56,93,.35);transition:transform .25s var(--out),background-color .2s ease}
.spot:hover span{transform:scale(1.15)}
.spot[aria-pressed="true"] span{background:var(--red);box-shadow:0 0 0 4px #ffffff,0 0 0 10px var(--red-b),0 6px 14px rgba(19,56,93,.35)}
.spot[aria-pressed="true"]::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--red-b);animation:ping 2s cubic-bezier(.16,1,.3,1) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.icard{display:flex;flex-direction:column;gap:16px}
.info{flex:1 1 auto;border-radius:28px;padding:36px;background:linear-gradient(160deg,var(--ink) 0%,var(--ink-d) 100%);color:#ffffff;display:flex;flex-direction:column}
.info .n{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:var(--red);display:grid;place-items:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.info h3{margin:0;font-size:28px;line-height:1.15;letter-spacing:-0.02em}
.info .sub{margin-top:6px;font-size:15px;color:#a9bbcf}
.info p{margin:24px 0 0;font-size:17px;line-height:1.65;color:#dce5ee}
.kv{margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;gap:10px;font-size:15px}
.kv div{display:flex;justify-content:space-between;gap:16px}.kv span{color:#a9bbcf}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips button{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:14px;border:0;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);font:500 15px Geologica,sans-serif;color:var(--text);text-align:left;cursor:pointer;transition:box-shadow .2s ease,background-color .2s ease}
.chips button i{width:8px;height:8px;border-radius:50%;background:#a9bbcf;flex:0 0 8px}
.chips button:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.chips button[aria-pressed="true"]{background:#ffffff;box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);font-weight:600}
.chips button[aria-pressed="true"] i{background:var(--red)}

/* exploded view */
.xpl{background:var(--paper)}
.xstage{position:relative;container-type:inline-size;margin-top:40px;aspect-ratio:640/296;border-radius:28px;background:#ffffff;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.xp{position:absolute;display:block;height:auto}
.xscroll{margin-top:40px}
.xscroll .xstage{margin-top:0}
.xm{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--red);color:#ffffff;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 0 0 6px var(--red-b)}
.xleg{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.xleg li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 0;padding:20px 20px 20px 0;border-bottom:1px solid var(--line)}
.xleg li b{grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--red-a);color:var(--red-t);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.xleg li span{font-size:17px;font-weight:600;color:var(--ink)}
.xleg li small{font-size:14px;line-height:1.45;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){
  .xp{animation:asm linear both;animation-timeline:view();animation-range:entry 30% cover 55%}
  @keyframes asm{from{translate:calc(var(--ax) * 1cqi) calc(var(--ay) * 1cqi)}}
  .xm{animation:mk linear both;animation-timeline:view();animation-range:cover 50% cover 60%}
  @keyframes mk{from{opacity:0;transform:scale(.4)}}
}}

/* full cycle */
.cyc{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:end}
.cyc p{margin:0;font-size:clamp(18px,1.45vw,21px);line-height:1.55;color:var(--text)}
.steps{list-style:none;margin:56px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;counter-reset:st}
.steps li{position:relative;display:flex;flex-direction:column;gap:14px}
.steps .ph{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:var(--gray)}
.steps .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--out)}
.steps li:hover .ph img{transform:scale(1.05)}
.steps .ph.svc{background:var(--red-a);box-shadow:inset 0 0 0 1px var(--red-b);display:flex;align-items:flex-end;padding:20px;box-sizing:border-box;color:var(--red-t);font-size:15px;line-height:1.45;font-weight:500}
.steps .lb{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--ink);line-height:1.25}
.steps .lb b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--red-a);color:var(--red-t);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}

/* figures */
.figs{position:relative;background:linear-gradient(120deg,var(--ink) 0%,var(--ink-d) 100%);color:#ffffff;overflow:hidden;padding:110px 0}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.fig{container-type:inline-size;min-width:0;padding:0 28px}
.fig:first-child{padding-left:0}
.fig+.fig{border-left:1px solid rgba(255,255,255,.14)}
.fbar{height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:40px}
.fbar i{display:block;height:100%;background:var(--red)}
.fig b{display:block;font-size:clamp(56px,5.9vw,86px);font-weight:800;line-height:.9;letter-spacing:-0.055em;white-space:nowrap;font-variant-numeric:tabular-nums}
.fig b em{font-style:normal;color:var(--red)}
.fig span{display:block;margin-top:28px;font-size:20px;font-weight:600;white-space:nowrap}
.fig small{display:block;margin-top:10px;font-size:15px;letter-spacing:.03em;color:#a9bbcf;white-space:nowrap}

/* video (autoplay, muted) */
.vsec{padding:16px 16px 0}
.vbox{position:relative;height:clamp(560px,82vh,780px);border-radius:28px;overflow:hidden;background:var(--ink-d);isolation:isolate;color:#ffffff}
.vf{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:0;animation:vfade 18s infinite}
.vf:nth-of-type(2){animation-delay:6s}.vf:nth-of-type(3){animation-delay:12s}
@keyframes vfade{0%{opacity:0;transform:scale(1.04)}6%{opacity:1}33%{opacity:1}40%{opacity:0;transform:scale(1.14)}100%{opacity:0}}
.vbox.paused .vf{animation-play-state:paused}
.vbox::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(13,42,71,.85) 0%,rgba(13,42,71,.25) 55%,rgba(13,42,71,.1) 100%)}
.vtxt{position:absolute;left:56px;right:56px;bottom:48px}
.vtxt h2{margin:22px 0 0;font-size:clamp(44px,6vw,92px);line-height:.92;font-weight:700;letter-spacing:-0.05em;max-width:12ch}
.vtxt p{margin:24px 0 0;font-size:clamp(17px,1.4vw,20px);line-height:1.55;color:rgba(255,255,255,.86);max-width:52ch}
.vrow{margin-top:36px;padding-top:22px;border-top:1px solid rgba(255,255,255,.22);display:flex;gap:36px;flex-wrap:wrap;font-size:15px;font-weight:500;color:#dce5ee}
.vrow span::before{content:"";display:inline-block;width:7px;height:7px;margin-right:10px;border-radius:50%;background:var(--red);vertical-align:middle}
.vctl{position:absolute;right:24px;top:24px;display:flex;gap:8px}
.vctl button,.vctl span{height:44px;padding:0 14px;border-radius:12px;border:0;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);color:#ffffff;font:500 14px Geologica,sans-serif;cursor:pointer}
.vctl span{cursor:default}

/* partners marquee */
.mq{margin-top:56px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mrow{display:flex;width:max-content;animation:marq 48s linear infinite}
.mrow.rev{animation-direction:reverse;animation-duration:60s}
.mq:hover .mrow{animation-play-state:paused}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mname{display:flex;align-items:center;gap:40px;padding-right:40px;font-size:clamp(28px,3.2vw,48px);font-weight:600;letter-spacing:-0.03em;color:var(--ink);white-space:nowrap}
.mname::after{content:"";flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:var(--red-b);box-shadow:0 0 0 6px var(--red-a)}
.mname.ph{color:#9aa9b9}
.mseg{display:flex;padding-right:12px}
.mseg span{margin-right:12px;padding:12px 20px;border-radius:999px;background:#ffffff;box-shadow:inset 0 0 0 1px var(--line);font-size:16px;font-weight:500;color:var(--muted);white-space:nowrap}
.mrow+.mrow{margin-top:28px}

/* news */
.ngrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);grid-template-rows:auto auto;gap:20px;margin-top:48px}
.nc{display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:0 0 0 1px var(--line);text-decoration:none;color:var(--ink);transition:transform .35s var(--out),box-shadow .35s ease}
.nc.big{grid-row:span 2}
.nc .pi{overflow:hidden;background:var(--gray)}
.nc .pi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--out)}
.nc.big .pi{flex:1 1 auto;min-height:320px}
.nc.sm{flex-direction:row}
.nc.sm .pi{flex:0 0 42%;min-height:220px}
.nc .bd{padding:28px;display:flex;flex-direction:column;gap:14px}
.nc .meta{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.nc .t{font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-0.015em}
.nc.big .t{font-size:30px;line-height:1.15}
.nc .more{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--red-t);transition:gap .25s var(--out)}
@media (hover:hover) and (pointer:fine){.nc:hover{transform:translateY(-4px);box-shadow:0 24px 48px -24px rgba(19,56,93,.35),0 0 0 1.5px var(--ink)}.nc:hover .pi img{transform:scale(1.04)}.nc:hover .more{gap:14px}}

/* contact */
.cta{background:var(--paper)}
.cgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:start}
.clist{display:flex;flex-direction:column;gap:12px;margin-top:40px}
.clist a,.clist div{display:flex;align-items:center;gap:16px;font-size:17px;font-weight:500;color:var(--ink);text-decoration:none}
.clist i{width:52px;height:52px;border-radius:14px;background:#ffffff;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--red);flex:0 0 52px}
.clist small{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.note{display:flex;gap:14px;margin-top:36px;padding:20px;border-radius:18px;background:var(--red-a);box-shadow:inset 0 0 0 1px var(--red-b);font-size:15px;line-height:1.55;color:var(--text)}
.note svg{flex:0 0 22px;color:var(--red-t);margin-top:1px}
.note a{color:var(--red-t);font-weight:600}
.fcard{background:#ffffff;border-radius:28px;padding:40px;box-shadow:0 30px 60px -36px rgba(19,56,93,.4),0 0 0 1px var(--line)}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld.w{grid-column:1/-1}
.fld label{font-size:14px;font-weight:600;color:var(--ink)}
.fld input,.fld select,.fld textarea{min-height:54px;border:1.5px solid #ccd5de;border-radius:14px;padding:0 16px;font:16px Geologica,sans-serif;color:var(--text);background:#fafbfc;box-sizing:border-box;width:100%;transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease}
.fld textarea{min-height:120px;padding:14px 16px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--ink);background:#ffffff;box-shadow:0 0 0 4px rgba(19,56,93,.12)}
.err{display:none;font-size:14px;color:var(--red-h)}
.tried .fld :invalid{border-color:var(--red)}
.tried .fld :invalid~.err{display:block}
.captcha{display:flex;align-items:center;gap:14px;min-height:70px;padding:0 18px;border-radius:14px;border:1.5px dashed #ccd5de;color:var(--muted);font-size:15px}
.consent{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5;color:var(--text)}
.consent input{width:22px;height:22px;margin:0;flex:0 0 22px;accent-color:var(--ink)}
.consent>span:nth-child(2){flex:1 1 0}
.ok{text-align:center;padding:48px 0}
.ok i{width:72px;height:72px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:#cceae0;color:#006b44}

/* footer */
.ft{background:var(--ink);color:#c9d6e3}
.ft a{color:#dbe3eb;text-decoration:none;transition:color .15s ease}.ft a:hover{color:#ffffff}
.fcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.16)}
.fcols>div{padding:36px 28px 44px 0;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.5}
.fcols>div+div{padding-left:28px;border-left:1px solid rgba(255,255,255,.16)}
.fcols b{color:#ffffff;font-size:16px;margin-bottom:6px}
.fbrand{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;padding:88px 0 48px;flex-wrap:wrap}
.fbrand .w{font-size:clamp(36px,4.4vw,64px);font-weight:700;line-height:.98;letter-spacing:-0.04em;color:#ffffff;max-width:14ch}

/* cookie */
.cookie{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;max-width:1248px;margin:0 auto;display:flex;align-items:center;gap:24px;box-sizing:border-box;background:#ffffff;border-radius:20px;padding:16px 16px 16px 24px;box-shadow:0 24px 64px rgba(10,32,56,.22),0 0 0 1px rgba(19,56,93,.06);animation:pop .5s var(--ease) .8s both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.98)}}
.cookie p{margin:0;flex:1 1 auto;font-size:15px;line-height:1.55;color:var(--text)}
.cookie .row{display:flex;gap:8px;flex:0 0 auto}
.cookie .btn{min-height:44px;padding:0 18px;font-size:15px;border-radius:12px}
.cookie .lnk{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:0 8px}

/* reveal */
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){
  .rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  @keyframes rv{from{opacity:0;transform:translateY(40px)}}
}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition-duration:.01ms !important}.vf:first-of-type{opacity:1}}

/* responsive */
@media (max-width:1180px){.menu>li>a{padding:0 10px;font-size:15px}.docs{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card.more{grid-column:span 2 !important;min-height:0}.steps{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:28px}.steps li::after{display:none}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:56px}.fig:nth-child(3){padding-left:0;border-left:0}}
@media (max-width:900px){
  .menu,.seg.top{display:none}.burger{display:inline-grid}
  .hgrid{grid-template-columns:minmax(0,1fr);gap:8px;min-height:0;padding-top:28px}
  .stage{order:-1;height:420px;min-height:0}
  .cap h1,.cap h2{font-size:40px}
  .idx{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:32px}.idx .tt{display:none}
  .igrid,.cyc,.cgrid{grid-template-columns:minmax(0,1fr);gap:28px}
  .ibox{min-height:560px}
  .xleg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ngrid{grid-template-columns:minmax(0,1fr)}.nc.big{grid-row:auto}
  .fcols{grid-template-columns:1fr 1fr}.fcols>div:nth-child(3){padding-left:0;border-left:0}
  .vtxt{left:24px;right:24px;bottom:28px}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .sec{padding:80px 0}
  .stage{height:360px}
  .ptag{gap:10px;padding:8px 10px 8px 14px}.ptag span{display:none}
  .chip{display:none}
  .hbtns .btn{flex:1 1 100%}
  .idx button{font-size:0}.idx .no{font-size:13px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:2px 16px}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto}
  .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:28px -16px 0;padding:4px 16px 12px;scroll-padding:0 16px}.cards::-webkit-scrollbar{display:none}.card{flex:0 0 82%;scroll-snap-align:start}.card.more{min-height:0;grid-column:auto !important}
  .xscroll{overflow-x:auto;margin:40px -16px 0;padding:0 16px;scrollbar-width:none}.xscroll .xstage{min-width:720px}
  .cimg,.card.wide .cimg{height:200px}
  .ibox{min-height:480px}.tilt{width:56%}
  .info{padding:28px}.info h3{font-size:24px}
  .chips{grid-template-columns:minmax(0,1fr)}
  .xstage{border-radius:20px}.xm{width:24px;height:24px;margin:-12px 0 0 -12px;font-size:11px;box-shadow:0 0 0 4px var(--red-b)}
  .xleg{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .figs{padding:72px 0}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:48px}.fig{padding:0 16px !important;border-left:0 !important}.fig:nth-child(odd){padding-left:0 !important}.fig b{font-size:min(56px,30cqi)}.fbar{margin-bottom:24px}
  .fig span{font-size:16px;margin-top:16px;white-space:normal}.fig small{font-size:13px;white-space:normal}
  .vtxt h2{font-size:40px}
  .vsec{padding:8px 8px 0}.vbox{border-radius:22px;height:640px}.vctl span{display:none}
  .mname{gap:24px;padding-right:24px}.mseg span{font-size:14px;padding:10px 16px}
  .nc.sm{flex-direction:column}.nc.sm .pi{flex:none;height:200px;min-height:0}.nc .bd{padding:22px}.nc.big .t{font-size:24px}
  .fcard{padding:24px 18px;border-radius:22px}.fgrid2{grid-template-columns:1fr}
  .fcols{grid-template-columns:1fr}.fcols>div,.fcols>div+div{padding:24px 0;border-left:0;border-bottom:1px solid rgba(255,255,255,.16)}
  .cookie{left:8px;right:8px;bottom:8px;flex-direction:column;align-items:stretch;gap:14px;padding:18px}.cookie .row{flex-wrap:wrap}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script src="runtime.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">

<div style="font-family: Geologica, sans-serif; color: #21272e; background: #ffffff; overflow-x: hidden">

<a href="#main" class="skip">Перейти до змісту</a>
<header class="hd">
  <div class="wrap">
    <a href="#" aria-label="НІК-ЕЛЕКТРОНІКА — на головну" style="display: flex"><img src="assets/4acb50f3-nik-logo.svg" alt="НІК-ЕЛЕКТРОНІКА — на головну" style="height: 34px; width: auto; display: block"></a>
    <nav aria-label="Головне меню" style="flex: 1 1 auto">
      <ul class="menu">
        <sc-for list="{{menu}}" as="m" hint-placeholder-count="4">
          <li>
            <a href="{{m.href}}" aria-haspopup="true">{{m.t}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></a>
            <div class="drop">
              <sc-for list="{{m.items}}" as="i" hint-placeholder-count="4"><a href="{{i.href}}">{{i.t}}</a></sc-for>
            </div>
          </li>
        </sc-for>
      </ul>
    </nav>
    <a href="#" class="btn btn-line docs">Електронні документи</a>
    <div style="display: flex; align-items: center; gap: 6px">
      <button class="icon burger" type="button" aria-label="{{menuLabel}}" aria-expanded="{{menuExp}}" aria-controls="mnav" onClick="{{toggleMenu}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{burgerPath}}"></path></svg></button>
      <button class="icon" aria-label="Пошук моделі, документа або статті" title="Пошук моделі, документа або статті"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
      <a href="#" class="icon" aria-label="Увійти в особистий кабінет" title="Увійти в особистий кабінет"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
      <div class="seg top" aria-label="Мова сайту" style="margin-left: 6px"><a href="#" aria-current="true">UA</a><a href="#">EN</a><a href="#">RU</a></div>
    </div>
  </div>
</header>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
  <nav class="mnav" id="mnav" aria-label="Мобільне меню" onClick="{{menuClick}}">
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="4">
      <div class="grp">
        <a href="{{m.href}}">{{m.t}}<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        <div class="sub"><sc-for list="{{m.items}}" as="i" hint-placeholder-count="4"><a href="{{i.href}}">{{i.t}}</a></sc-for></div>
      </div>
    </sc-for>
    <div class="foot">
      <a href="#" class="btn btn-line" style="width: 100%">Електронні документи</a>
      <a href="#contact" class="btn btn-red" style="width: 100%">Зв'язатися з нами</a>
      <div class="seg" aria-label="Мова сайту" style="align-self: flex-start"><a href="#" aria-current="true">UA</a><a href="#">EN</a><a href="#">RU</a></div>
    </div>
  </nav>
</sc-if>

<main id="main">
<!-- 1. Hero: продукт і затверджений текст змінюються синхронно -->
<section class="hero" aria-roledescription="карусель" aria-label="Головне про компанію" onMouseEnter="{{pause}}" onMouseLeave="{{resume}}">
  <div class="wrap hgrid">
    <div>
      <span class="kick">Український виробник · з 2005 року</span>
      <div class="caps" aria-live="polite">
        <div class="{{c0}}"><h1>Точний облік енергоресурсів — від розробки до сервісу</h1><p>Розробляємо та виробляємо лічильники електроенергії, води й тепла та системи автоматизованого обліку (AMI) з 2005 року. Увесь цикл — від конструкторського бюро до сервісного центру — під нашим контролем.</p></div>
        <div class="{{c1}}"><h2>Повний цикл виробництва</h2><p>Власне конструкторське бюро, SMT-лінія, лиття корпусів, складання, повірка, випробування та сервіс.</p></div>
        <div class="{{c2}}"><h2>Акредитований випробувальний центр</h2><p>Акредитація НААУ за ДСТУ EN ISO/IEC 17025:2019: 28 видів випробувань лічильників і випробування ПЗ. Результати визнані в Україні та на міжнародному рівні.</p></div>
        <div class="{{c3}}"><h2>Від України до ЄС та Азії</h2><p>Лічильники NIK працюють у мережах операторів систем розподілу по всій Україні, а також у країнах ЄС, Близького Сходу та Азії.</p></div>
      </div>
      <div class="hbtns">
        <a href="#catalog" class="btn btn-red">Переглянути каталог<svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        <a href="#inside" class="btn btn-line"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>Як влаштований прилад</a>
      </div>
      <ol class="idx" aria-label="Слайди">
        <sc-for list="{{slides}}" as="s" hint-placeholder-count="4">
